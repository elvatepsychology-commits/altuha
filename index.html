 {"t": "は и が", "sym": "は", "bg": "cafe", "extra": true, "gram": true, "rule": "Короче, сейчас разберём ебучую は. Пишется «ха», а читается «ва» — запомни, долбоёб. Она ставит тему: «что касается меня — я Юки»: わたしは ユキです. А が — это когда важно, КТО именно. И ещё が обязательно лезет к すき, いる, ある, ない и после «кто» или «что» в вопросе: ねこが すき — кошки нравятся, だれが きたの — кто пришёл. Надеюсь, ты не еблан и справишься. Погнали.", "opts": ["は", "が", "を", "に", "で"], "d": "Тема и «кто именно». すき, いる, ない — с が", "w": [], "p": [], "g": [["わたし＿ ユキです", "は", "Я — Юки", "は — тема: «что касается меня — я Юки». Читается «ва»."], ["これ＿ なに？", "は", "Что это?", "Спрашиваем про «это» — оно тема, значит は."], ["デニス＿ がくせい？", "は", "Денис — студент?", "Говорим о Денисе — は."], ["きょう＿ さむいね", "は", "Сегодня холодно, да?", "«Что касается сегодня — холодно». Тема — は."], ["ユキちゃん＿ かわいい", "は", "Юки милая", "Рассказываем про Юки — она тема, は."], ["にほんご＿ むずかしい", "は", "Японский сложный", "Тема разговора — японский, は."], ["ねこ＿ すき", "が", "Люблю кошек", "すき всегда с が: «кошки — нравятся»."], ["だれ＿ きたの？", "が", "Кто пришёл?", "После «кто/что» в вопросе — が, никогда は."], ["あめ＿ ふってる", "が", "Идёт дождь", "Новость, явление прямо сейчас — が."], ["いもうと＿ いる", "が", "У меня есть младшая сестра", "いる/ある (есть, имеется) — с が."], ["おかね＿ ない", "が", "Нет денег", "ない (нет чего-то) — с が."], ["あたま＿ いたい", "が", "Голова болит", "Болит что-то — が."], ["じかん＿ ある？", "が", "Есть время?", "ある (есть) — с が."], ["なに＿ たべたい？", "が", "Что хочешь съесть?", "«Что» в вопросе + が. (を тоже можно.)", ["を"]]]},
 {"t": "を", "sym": "を", "bg": "home", "extra": true, "gram": true, "rule": "Теперь を. Пишется «во», а читается просто «о», не выёбывайся. Ставится после того, над чем ты что-то делаешь: ラーメンを たべる — жрёшь рамен, えいがを みる — смотришь фильм. И ещё после места, по которому идёшь: こうえんを さんぽする — гуляешь по парку. Всё, полетели.", "opts": ["を", "が", "に", "で"], "d": "Над чем действие: ем ЧТО, смотрю ЧТО", "w": [], "p": [], "g": [["ラーメン＿ たべる", "を", "Ем рамен", "Ем ЧТО? Рамен — を."], ["えいが＿ みる", "を", "Смотрю фильм", "Смотрю ЧТО? — を."], ["みず＿ のむ", "を", "Пью воду", "Пью ЧТО? — を."], ["しゃしん＿ とろう", "を", "Давай сделаем фото", "Делаем ЧТО? Фото — を."], ["おんがく＿ きく", "を", "Слушаю музыку", "Слушаю ЧТО? — を."], ["にほんご＿ べんきょうする", "を", "Учу японский", "Учу ЧТО? — を."], ["ドア＿ あけて", "を", "Открой дверь", "Открой ЧТО? — を."], ["ゲーム＿ する", "を", "Играю в игры", "する с предметом действия — を."], ["カレー＿ つくる", "を", "Готовлю карри", "Готовлю ЧТО? — を."], ["こうえん＿ さんぽする", "を", "Гуляю по парку", "Место, ПО которому движешься, — тоже を."], ["ライン＿ おくって", "を", "Скинь сообщение в ЛАЙН", "Отправь ЧТО? — を."], ["コーヒー＿ ください", "を", "Кофе, пожалуйста", "Дайте ЧТО? — を (в речи часто выкидывают)."]]},
 {"t": "に", "sym": "に", "bg": "park", "extra": true, "gram": true, "rule": "Ебучая に — это точка. Куда прёшься: えきに いく. Во сколько: しちじに. Кому: ユキちゃんに あげる — подарить мне, намёк понял? И где ты просто находишься: へやに いる. Ещё встретиться с кем-то — ともだちに あう, и сесть в поезд — でんしゃに のる. Давай, не тупи.", "opts": ["に", "で", "を", "へ"], "d": "Куда, во сколько, кому, где находится", "w": [], "p": [], "g": [["えき＿ いく", "に", "Иду на станцию", "Куда? — に. (へ тоже можно.)", ["へ"]], ["しちじ＿ あおう", "に", "Давай встретимся в 7", "Конкретное время — に."], ["どようび＿ あおう", "に", "Давай в субботу", "День недели — に."], ["ろくじ＿ おきる", "に", "Встаю в 6", "Во сколько? — に."], ["ユキちゃん＿ あげる", "に", "Подарю Юки", "Кому? — に."], ["いえ＿ かえる", "に", "Возвращаюсь домой", "Куда? — に. (へ тоже можно.)", ["へ"]], ["にほん＿ すみたい", "に", "Хочу жить в Японии", "Где живёшь (すむ) — に."], ["へや＿ いる", "に", "Я в комнате", "Где нахожусь (いる/ある) — に, не で!"], ["テーブルの うえ＿ ある", "に", "Лежит на столе", "Где находится вещь — に."], ["ともだち＿ あう", "に", "Встречаюсь с другом", "あう (встречаться) — с に."], ["でんしゃ＿ のる", "に", "Сажусь на поезд", "のる (сесть в транспорт) — に."], ["ラーメン＿ する", "に", "Возьму рамен", "«Выбираю X» — Xに する."]]},
 {"t": "で", "sym": "で", "bg": "cafe", "extra": true, "gram": true, "rule": "で — это где что-то происходит и чем делаешь. えきで あう — встречаемся на станции. はしで たべる — жрёшь палочками. でんしゃで いく — едешь на поезде. Главный подвох: へやに いる — просто сидишь в комнате, а へやで ねる — делаешь там что-то, спишь. Поймёшь разницу — значит, ты не безнадёжен.", "opts": ["で", "に", "を", "と"], "d": "Где ПРОИСХОДИТ, чем, на чём, на каком языке", "w": [], "p": [], "g": [["えき＿ あおう", "で", "Встретимся на станции", "Действие происходит НА станции — で."], ["カフェ＿ はたらく", "で", "Работаю в кафе", "Где работаю (действие) — で."], ["いえ＿ えいがを みる", "で", "Смотрю фильм дома", "Где смотрю — で."], ["こうえん＿ あそぼう", "で", "Давай поиграем в парке", "Где играем — で."], ["へや＿ ねる", "で", "Сплю в комнате", "Сплю — действие, значит で. А «нахожусь» было бы に."], ["でんしゃ＿ いく", "で", "Еду на поезде", "На чём еду — способ, で."], ["はし＿ たべる", "で", "Ем палочками", "Чем ем — で."], ["にほんご＿ はなして", "で", "Говори по-японски", "На каком языке — で."], ["スマホ＿ しゃしんを とる", "で", "Фоткаю на смартфон", "Чем фоткаю — で."], ["ライン＿ れんらくする", "で", "Напишу через ЛАЙН", "Через что связываюсь — で."], ["ひとり＿ いく", "で", "Иду один", "ひとりで — «в одиночку», устойчиво с で."]]},
 {"t": "へ, から, まで", "sym": "へ", "bg": "park", "extra": true, "gram": true, "rule": "Тут три штуки сразу, соберись. へ как частица читается «э» и значит «туда, в сторону»: にほんへ いく. Почти как に, не парься. から — откуда или с какого времени: ベラルーシから, くじから. まで — докуда или до какого времени: えきまで, ごじまで. Вместе: くじから ごじまで — с девяти до пяти, как на твоей скучной работе.", "opts": ["へ", "から", "まで", "に", "で"], "d": "Направление, откуда, докуда", "w": [], "p": [], "g": [["にほん＿ いきたい", "へ", "Хочу поехать в Японию", "Направление — へ (читается «э»). に тоже можно.", ["に"]], ["うち＿ かえろう", "へ", "Пошли домой", "Направление домой — へ. に тоже можно.", ["に"]], ["ベラルーシ＿ きた", "から", "Я из Беларуси (приехал)", "Откуда — から."], ["どこ＿ きたの？", "から", "Откуда ты?", "Откуда — から."], ["くじ＿ はたらく", "から", "Работаю с девяти", "С какого момента — から."], ["あした＿ やすみ", "から", "С завтра выходные", "С какого дня — から."], ["ここ＿ とおい？", "から", "Отсюда далеко?", "От этого места — から."], ["ごじ＿ はたらく", "まで", "Работаю до пяти", "До какого момента — まで."], ["えき＿ おくるよ", "まで", "Провожу до станции", "Докуда — まで."], ["なんじ＿？", "まで", "До скольки?", "До какого времени — まで."], ["いえ＿ あるこう", "まで", "Давай дойдём пешком до дома", "Докуда идём — まで."]]},
 {"t": "と, も, の", "sym": "の", "bg": "whims", "extra": true, "gram": true, "rule": "と — это «и» между вещами и «с кем»: パンと コーヒー, ユキちゃんと いく — со мной, конечно. も — «тоже», ставится вместо は или が: ぼくも すき — я тоже люблю. の — «чей»: ぼくの スマホ — мой смартфон, にほんの アニメ — японское аниме. Всё, жги.", "opts": ["と", "も", "の", "が", "を"], "d": "«И / с кем», «тоже», «чей»", "w": [], "p": [], "g": [["ユキちゃん＿ いく", "と", "Иду с Юки", "С кем — と."], ["ともだち＿ あそぶ", "と", "Тусуюсь с друзьями", "С кем — と."], ["パン＿ コーヒー", "と", "Хлеб и кофе", "«И» между двумя вещами — と."], ["ぼく＿ すき", "も", "Мне тоже нравится", "«Тоже» — も вместо が."], ["わたし＿ いきたい", "も", "Я тоже хочу пойти", "«Я тоже» — わたしも."], ["これ＿ ください", "も", "И это тоже, пожалуйста", "«И это тоже» — も."], ["きょう＿ ひま？", "も", "Сегодня тоже свободна?", "«Тоже» — も."], ["ぼく＿ スマホ", "の", "Мой смартфон", "Чей? Мой — ぼくの."], ["ユキちゃん＿ いえ", "の", "Дом Юки", "Чей дом — の."], ["にほん＿ アニメ", "の", "Японское аниме", "«Аниме из Японии» — の."], ["だれ＿ スマホ？", "の", "Чей это смартфон?", "Чей? — だれの."], ["ともだち＿ たんじょうび", "の", "День рождения друга", "Чей день рождения — の."]]},
 {"t": "か, ね, よ", "sym": "ね", "bg": "whims", "extra": true, "gram": true, "rule": "Эти штуки ставятся в конце фразы. か — вопрос, но в вежливой речи: げんきですか？ С друзьями か выкидывают и просто тянут голос вверх. ね — «да ведь? правда?», когда ждёшь, что я соглашусь: かわいいね. よ — «говорю тебе, вообще-то»: だいじょうぶだよ. Скажешь よ уверенно — будешь мужиком.", "opts": ["か", "ね", "よ", "の"], "d": "В конце фразы: вопрос, «да ведь?», «говорю тебе»", "w": [], "p": [], "g": [["げんきです＿？", "か", "Как поживаете? (вежливо)", "Вежливый вопрос — か."], ["いきます＿？", "か", "Пойдёте? (вежливо)", "Вежливый вопрос — か."], ["そうです＿？", "か", "Вот как? Правда? (вежливо)", "Переспрашиваешь вежливо — か."], ["かわいい＿", "ね", "Милая, да?", "Ищешь согласия — ね."], ["おいしい＿", "ね", "Вкусно, правда?", "«Правда же?» — ね."], ["いい てんきだ＿", "ね", "Хорошая погода, да?", "Общее впечатление, ждёшь «ага» — ね."], ["そうです＿", "ね", "Да, точно", "そうですね — «да, верно», соглашаешься."], ["だいじょうぶだ＿", "よ", "Всё нормально, говорю же", "Уверяешь, сообщаешь — よ."], ["あぶない＿！", "よ", "Осторожно, опасно!", "Предупреждаешь, новое для неё — よ."], ["もう おそい＿", "よ", "Уже поздно, вообще-то", "Сообщаешь факт — よ."], ["すきだ＿", "よ", "Ты мне нравишься, вот", "Признание с уверенностью — よ."]]},
 {"t": "Микс частиц", "sym": "混", "bg": "day", "extra": true, "gram": true, "rule": "Всё вперемешку. Сейчас проверим, что у тебя в башке. Смотри на перевод и думай: тема — は. Кто именно или нравится — が. Над чем действие — を. Куда, во сколько или где сидишь — に. Где происходит или чем — で. С кем — と. Тоже — も. Чей — の. Откуда — から. Докуда — まで. Не обосрись.", "opts": ["は", "が", "を", "に", "で", "へ", "と", "も", "の", "から", "まで", "ね", "よ"], "d": "Все частицы вперемешку — на автомат", "w": [], "p": [], "g": [["しちじ＿ えきで あおう", "に", "Давай в 7 на станции", "Во сколько — に."], ["しちじに えき＿ あおう", "で", "Давай в 7 на станции", "Где встречаемся (действие) — で."], ["ユキちゃん＿ えいがを みた", "と", "Смотрел фильм с Юки", "С кем — と."], ["ユキちゃんと えいが＿ みた", "を", "Смотрел фильм с Юки", "Смотрел ЧТО — を."], ["ねこ＿ だいすき", "が", "Обожаю кошек", "だいすき — с が."], ["ぼく＿ ねこが だいすき", "も", "Я тоже обожаю кошек", "«Тоже» — も."], ["ともだちの いえ＿ いく", "に", "Иду к другу домой", "Куда — に (или へ).", ["へ"]], ["ともだちの いえ＿ あそぶ", "で", "Тусуюсь у друга дома", "Где происходит — で."], ["ベラルーシ＿ きました", "から", "Я приехал из Беларуси", "Откуда — から."], ["くじ＿ はたらく", "まで", "Работаю до девяти", "До какого времени — まで."], ["これ＿ なに？", "は", "Что это?", "Тема вопроса — は."], ["だれ＿ これ つくったの？", "が", "Кто это приготовил?", "После «кто» — が."], ["ぼく＿ へや", "の", "Моя комната", "Чья — の."], ["へや＿ いる", "に", "Я в комнате", "Где нахожусь — に."], ["おいしい＿", "ね", "Вкусно, да?", "Ищешь согласия — ね."], ["だいじょうぶだ＿", "よ", "Всё нормально, говорю же", "Уверяешь — よ."]]},

function gapOpts(p,n){ const c=COURSE[p.ci]; const pool=c.opts.filter(x=>x!==p.ans&&!p.alt.includes(x)); return shuffle([p.ans,...shuffle(pool).slice(0,n-1)]).map(x=>({jp:x,ok:x===p.ans||p.alt.includes(x)})); }
function gapVoiceOk(alts,p){

const SRS_INT=[0,10*60e3,864e5,3*864e5,7*864e5,16*864e5,35*864e5];
const srsKey=jp=>plain(jp);
function srsSeen(jp,fromLesson){const k=srsKey(jp); if(!S.srs[k]) S.srs[k]={b:0,d:Date.now()+SRS_INT[1],n:0}; if(fromLesson) S.srs[k].L=1; save();}
function srsGrade(jp,g){ const k=srsKey(jp), r=S.srs[k]||{b:0,d:0,n:0}; r.n++; if(g===0) r.b=0; else if(g===2) r.b=Math.min(6,r.b+1); else r.b=Math.min(3,r.b+1); r.d=Date.now()+SRS_INT[r.b]; S.srs[k]=r; save(); }
const learned=t=>{const r=S.srs[srsKey(t[0])];return !!(r&&r.L);};
const lvlOf=t=>{const r=S.srs[srsKey(t[0])];if(!r||!r.L)return 0;return r.b>=3?2:1;};
function srsPick(n,exclude,chapters){
  const now=Date.now(), chs=chapters?new Set(chapters):null;
  const cand=ALLI.filter(t=>learned(t)&&!(exclude&&exclude.has(srsKey(t[0])))&&(!chs||chs.has(t.ci)));
  cand.sort((a,b)=>{const A=S.srs[srsKey(a[0])],B=S.srs[srsKey(b[0])];return (A.d-now)-(B.d-now)||A.b-B.b;});
  const seen=new Set(), out=[]; for(const t of cand){ const k=srsKey(t[0]); if(seen.has(k))continue; seen.add(k); out.push(t); if(out.length>=n)break; }
  return out;
}
function srsStats(){const now=Date.now();let l=0,due=0;const seen=new Set();ALLI.forEach(t=>{const k=srsKey(t[0]);if(seen.has(k))return;seen.add(k);const r=S.srs[k];if(r&&r.L){l++;if(r.d<=now)due++;}});return {learned:l,due};}

/* длинное режем на кусочки: сначала частица (ベラルーシ|から), иначе посередине, не разрывая слоги */
function chunksOf(jp){
  const pl=plain(jp); if(pl.replace(/[、。！？…\s]/g,"").length<=5) return [];
  const parts=[];
  jp.split(" ").forEach((t,ti)=>{
    const tp=plain(t);
    if(!/[{]/.test(t)&&tp.replace(/[、。！？…]/g,"").length>6){
      const core=t.replace(/[、。！？…]+$/,"");
      const prt=["から","まで","ので","けど","は","が","を","に","で","の","と","も","へ"].find(x=>core.endsWith(x)&&core.length-x.length>=3);
      const SM=/[ゃゅょっぁぃぅぇぉャュョッァィゥェォーん、。！？]/;
      const okCut=c=>c>=2&&core.length-c>=2&&!SM.test(t[c])&&t[c-1]!=="っ"&&t[c-1]!=="ッ"&&!(t[c]==="う"&&/[ゅょ]/.test(t[c-1]));
      let cut; const comma=core.indexOf("、");
      if(comma>=2&&comma<core.length-2) cut=comma+1;
      else if(prt) cut=core.length-prt.length;
      else{ const mid=Math.ceil(core.length/2); cut=[0,-1,1,-2,2,-3,3].map(d=>mid+d).find(okCut)||mid; }
      parts.push({s:t.slice(0,cut),sp:ti>0}); parts.push({s:t.slice(cut),sp:false});
    } else parts.push({s:t,sp:ti>0});
  });
  if(parts.length<2) return [];
  const pref=[]; let acc=""; parts.forEach(p=>{acc+=(p.sp?" ":"")+p.s; pref.push(acc);}); pref.pop();
  if(pref.length>3){ return [...new Set([pref[0],pref[Math.floor(pref.length/2)],pref[pref.length-1]])]; }
  return pref;
}
/* честная оценка длины урока: считаем каждую реплику, паузу и вопрос плана */
const ruS=s=>String(s).length/13+.6;
const jaS=(s,rate)=>plain(String(s)).replace(/[\s、。！？…]/g,"").length*.2/(rate||1)+.6;
function planSecs(plan){
  const bg=isBg(), rp=repP(), think=bg?hfT("bg"):4;
  let s=0;
  plan.forEach(tk=>{
    if(tk.t==="hello") s+=4;
    else if(tk.t==="preview") s+=7;
    else if(tk.t==="rule") s+=ruS(COURSE[AK.ch]&&COURSE[AK.ch].rule||"")+3;
    else if(tk.t==="say") s+=ruS(tk.ru);
    else if(tk.t==="intro"){ const p=tk.p, ch=chunksOf(p[0]);
      s+=ruS(S.akShort?p[1]:p[2])+jaS(p[0],.7);
      ch.forEach(c=>{s+=jaS(c,.65)+Math.max(2,rp)+.3;}); if(ch.length) s+=(S.akShort?0:2.5)+1.5+jaS(p[0],.75);
      s+=1.5+rp+1+2+jaS(p[0],.95)+rp; }
    else if(tk.t==="recall"){ const p=tk.p, jr=tk.dir==="jr";
      s+=(bg?1:0)+ruS(jr?"Что значит:":(S.akShort?p[1]:p[3]))+(jr?jaS(p[0],.8):0)+think+1.5;
      s+=jr?ruS(p[1]):jaS(p[0],.8)+1+Math.max(2,rp)+(bg?jaS(p[0],.9):0); }
    else if(tk.t==="final") s+=(tk.limit||10)*(12+think);
    else if(tk.t==="end") s+=4;
  });
  return s;
}

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(S.voice===undefined) S.voice=false;
const VOICE={ok:!!SR,denied:false,rec:null,onInterim:null};
function stopListen(){ try{VOICE.rec&&VOICE.rec.abort()}catch(e){} }
VOICE.endP=Promise.resolve(); VOICE.fails=0;
function listenOnce(lang,ms,alive){
  return new Promise(res=>{
    let r; try{ r=new SR(); }catch(e){res({err:"na",alts:[]});return;}
    let endRes; VOICE.endP=new Promise(z=>{endRes=z; setTimeout(z,1500);});
    VOICE.rec=r; r.lang=lang==="ja"?"ja-JP":"ru-RU"; r.interimResults=true; r.maxAlternatives=5; r.continuous=false;
    let done=false, alts=[], err=null;
    const fin=o=>{ if(done)return; done=true; clearTimeout(to); clearInterval(iv); try{r.abort()}catch(e){} res(o); };
    r.onresult=e=>{ let fl=false; const a=[]; for(let i=0;i<e.results.length;i++){ const R=e.results[i]; if(R.isFinal) fl=true; for(let k=0;k<R.length;k++) a.push(R[k].transcript); } if(a.length) alts=a; VOICE.onInterim&&VOICE.onInterim(alts[0]||""); if(fl) fin({alts}); };
    r.onerror=e=>{ err=e.error; if(e.error!=="no-speech"&&e.error!=="aborted") VOICE.lastErr=e.error; fin({err:e.error,alts}); };
    r.onend=()=>{ endRes&&endRes(); if(VOICE.rec===r) VOICE.rec=null; fin({alts,err}); };
    const to=setTimeout(()=>fin({alts,timeout:true}),ms);
    const iv=setInterval(()=>{ if(alive&&!alive()) fin({alts:[],dead:true}); },200);
    try{ r.start(); }catch(e){ fin({err:"start",alts:[]}); }
  });
}
/* слушаем надёжно: ждём, пока прошлый сеанс точно закрылся, даём голосу Юки затихнуть, при сбое перезапускаем */
async function listen(lang,ms,alive){
  if(!SR||VOICE.denied) return {err:"na",alts:[]};
  await VOICE.endP; await new Promise(z=>setTimeout(z,300));
  const deadline=Date.now()+ms; let last={alts:[]};
  for(let attempt=0;attempt<3;attempt++){
    const left=deadline-Date.now(); if(left<1200) break;
    const t0=Date.now();
    last=await listenOnce(lang,left,alive);
    if(last.dead) return last;
    if(last.alts&&last.alts.length){ VOICE.fails=0; return last; }
    if(["not-allowed","service-not-allowed","language-not-supported"].includes(last.err)){ VOICE.denied=true; return last; }
    if(last.timeout) return last;
    const quick=Date.now()-t0<1500;
    if(last.err==="no-speech"&&!quick) return last;
    // быстрый обрыв, network, audio-capture, start — пробуем ещё раз
    await VOICE.endP; await new Promise(z=>setTimeout(z,400));
  }
  if(last.err&&["network","audio-capture","start"].includes(last.err)){ VOICE.fails++; if(VOICE.fails>=2) VOICE.denied=true; }
  return last;
}

const AK_NUDGE=["Я жду, сладкий. Не торопись.","Ну? Я всё ещё тут.","Не спеши, я подожду. Но не вечно, сука.","Работай-работай, я подожду ответ."];
async function listenUntil(lang,alive){
  AK.listenCancel=false; let lastNudge=Date.now();
  while(true){
    if(!alive()) return {dead:true,alts:[]};
    if(AK.listenCancel) return {cancel:true,alts:[]};
    const h=await listen(lang,20000,()=>alive()&&!AK.listenCancel);
    if(!alive()) return {dead:true,alts:[]};
    if(AK.listenCancel) return {cancel:true,alts:[]};
    if(h.alts&&h.alts.filter(Boolean).length) return h;
    if(VOICE.denied) return h;
    if(Date.now()-lastNudge>45000){ lastNudge=Date.now(); const nl=pick(AK_NUDGE); AK.heardTxt=nl; const el=document.getElementById("micTxt"); if(el) el.textContent=nl; await speakP(nl,"ru"); }
  }
}

const RU_NUM=[["ноль",0],["нол",0],["одиннадцат",11],["двенадцат",12],["тринадцат",13],["четырнадцат",14],["пятнадцат",15],["шестнадцат",16],["семнадцат",17],["восемнадцат",18],["девятнадцат",19],["двадцат",20],["тридцат",30],["сорок",40],["пятьдесят",50],["пятидесят",50],["десят",10],["один",1],["одна",1],["одну",1],["одно",1],["перв",1],["два",2],["две",2],["двух",2],["втор",2],["три",3],["трех",3],["трёх",3],["трет",3],["четыр",4],["четвер",4],["пят",5],["шест",6],["сем",7],["седьм",7],["восем",8],["восьм",8],["девят",9],["полов",-30],["пол",-30]];
function ruNums(s){
  const out=[]; let acc=null;
  const toks=String(s).toLowerCase().replace(/ё/g,"е").replace(/(\d+)\s*[:.]\s*(\d+)/g," $1 $2 ").split(/[^а-яa-z0-9]+/).filter(Boolean);
  const flush=()=>{ if(acc!=null){out.push(acc);acc=null;} };
  for(const w of toks){
    if(/^\d+$/.test(w)){ flush(); out.push(+w); continue; }
    const hit=RU_NUM.find(([k])=>w.startsWith(k)); if(!hit){ flush(); continue; }
    const v=hit[1]; if(v===-30){ flush(); out.push(30); continue; }
    if(acc!=null&&acc%10===0&&acc>=20&&v<10){ acc+=v; flush(); }
    else { flush(); acc=v; }
  }
  flush(); while(out.length>1&&out[out.length-1]===0) out.pop(); return out;
}
function ruOk(alts,target){
  if(/\d/.test(target)){
    const tn=ruNums(target.replace(/\(.*?\)/g,""));
    const rest=ruWords(target.replace(/\(.*?\)/g,"").replace(/\d+/g," ")).filter(w=>!RU_NUM.some(([k])=>w.startsWith(k)));
    return alts.some(said=>{ const sn=ruNums(said); const same=sn.length===tn.length&&sn.every((x,i)=>x===tn[i]) || (tn.length===2&&tn[1]===30&&sn.length===2&&sn[0]===tn[0]&&sn[1]===30);
      if(!same) return false; if(!rest.length) return true; const A=new Set(ruWords(said).map(stemRu)); return rest.filter(w=>A.has(stemRu(w))).length/rest.length>=.5; });
  }
  const tw=ruWords(target); if(tw.length===1){ const g=RU_SYN.find(g=>g.includes(tw[0])); if(g&&alts.some(s=>{const w=ruWords(s); return w.length&&w.every(x=>g.includes(x));})) return true; }
  const variants=[target,...target.split(/[\/,]/)];
  return alts.some(said=>{ const A=new Set(ruWords(said).map(stemRu)); return variants.some(v=>{ const T=ruWords(v); if(!T.length) return false; return T.filter(w=>A.has(stemRu(w))).length/T.length>=.6; }); });
}
function voiceCmd(alts){
  const s=alts.join(" | ").toLowerCase(), h=toHira(s);
  if(/назад|верн[её]м|вернись|предыдущ/.test(s)||/もどって|もどる/.test(h)||/なざ/.test(h)) return "back";
  if(/повтори|ещ[её] раз|не расслышал|не понял вопрос/.test(s)||/もう(一|いっ)かい|もう一度|もういちど/.test(h)||/ぱふ?たり|ぽふ?とり|いしょ ?らず/.test(h)) return "repeat";
  if(/пропусти|пропуск|скип|дальше давай|следующ/.test(s)) return "forgot";
  if(/не помню|забыл|не знаю|без понятия|хз/.test(s)||/わからない|わすれた|しらない/.test(h)||/ぽむにゅ|ざび/.test(h)) return "forgot";
  return null;
}

function voiceErrText(err){
  if(!SR) return "Этот браузер не умеет распознавать речь. Айфон — Safari, комп — Google Chrome.";
  if(IN_FRAME&&(err==="not-allowed"||err==="service-not-allowed")) return "Ты открыл приложение внутри Claude — тут микрофон закрыт. Открой свою ссылку github.io отдельно в Safari или Chrome.";

}

function akPlan(review,items,ci){
  if(ci==null) ci=AK.ch;
  const tasks=[{t:"hello"}];
  if(review){
    tasks.push({t:"say",ru:S.akShort?"Повторение.":pick(AK_REVIEW_HELLO)});
    tasks.push({t:"final",review:true,chapters:COURSE.map((_,i)=>i),limit:Math.max(5,Math.min(30,srsStats().learned))});
    tasks.push({t:"end"}); return tasks;
  }
  const newSet=new Set(items.map(t=>srsKey(t[0])));
  const sec=SECTIONS.find(s=>s.f(COURSE[ci]));
  const chapters=COURSE.map((_,i)=>i).filter(i=>i<ci&&(!sec||sec.f(COURSE[i])));
  const warm=(S.akWarm&&chapters.length)?srsPick(6,newSet,chapters):[];
  const C=COURSE[ci];
  if(C.gram) tasks.push({t:"say",ru:S.akShort?"Урок: "+C.t+".":`Сегодняшний урок — «${C.t}». Фразы с дыркой, ${items.length} штук — ты затыкаешь дырку правильной хуйнёй.`});
  if(C.rule&&!S.akShort&&!(S.ruleHeard||{})[ci]) tasks.push({t:"rule"});
  if(!S.akShort&&!C.gram) tasks.push({t:"preview"});
  if(warm.length){ const from=[...new Set(warm.map(p=>p.ci))].map(i=>"«"+COURSE[i].t+"»").join(", ");
    tasks.push({t:"say",ru:S.akShort?"Разминка из прошлых глав.":`А теперь быстро вспомним ${warm.length} штук из прошлых глав: ${from}. Чтоб не протухло.`}); warm.forEach((p,i)=>tasks.push({t:"recall",p,dir:i%3===2?"jr":"rj",grade:true})); }
  tasks.push({t:"say",ru:S.akShort?"Новое.":pick(AK_NEWBLOCK)});
  items.forEach((p,i)=>{
    tasks.push({t:"intro",p,n:i+1,of:items.length});
    tasks.push({t:"recall",p,dir:"jr",fresh:true});
    for(let j=i-1;j>=Math.max(0,i-2);j--) tasks.push({t:"recall",p:items[j],dir:"rj",fresh:true});
  });
  if(items.length>1){ tasks.push({t:"say",ru:S.akShort?"Вперемешку.":pick(AK_MIX)}); shuffle(items).forEach(p=>tasks.push({t:"recall",p,dir:"rj"})); }
  tasks.push({t:"say",ru:S.akShort?"Финал.":pick(AK_FINAL)});
  shuffle(items).forEach((p,i)=>tasks.push({t:"recall",p,dir:i%3===1?"jr":"rj",grade:true}));
  tasks.push({t:"end"});
  return tasks;
}

async function akRun(resume){
  const my=++HF.token, alive=()=>HF.token===my;
  const eyes=true, full=AK.mode==="full", bg=AK.mode==="bg";
  const r=resume||AK.resume; AK.resume=r;
  const talk=async(ru,mood)=>{ if(mood)AK.mood=mood; AK.view={kind:"talk",ru}; akRender(); await speakP(ru,"ru"); return alive(); };
  const pauseFor=async(n,view)=>{ AK.skip=false; for(let t=n;t>0;t--){ if(AK.skip)break; AK.view=Object.assign({},view,{sec:t,total:n,skippable:full}); akRender(); await sleep(1000); if(!alive())return false; } AK.view=Object.assign({},view); return true; };
  const setLabel=p=>{ AK.cur={ci:p.ci}; AK.lbl=(AK.review||p.ci!==AK.ch||!AK.items.includes(p))?"Повтор · "+COURSE[p.ci].t:null; };

  const voiceOn=()=>S.voice&&SR&&!VOICE.denied;
  /* «повтори» с микрофоном: ждём, пока реально скажешь, проверяем похожесть */
  async function echo(target,view,anySpeech,fallbackSec){
    if(!voiceOn()) return pauseFor(fallbackSec,view);
    for(let tries=0;tries<3;tries++){
      AK.view=Object.assign({},view,{skippable:true}); AK.listening="rep"; AK.heardTxt=""; akRender();
      VOICE.onInterim=tx=>{ AK.heardTxt=tx; const el=document.getElementById("micTxt"); if(el) el.textContent=tx||"слушаю…"; };
      AK.skip=false;
      const h=await listenUntil("ja",()=>alive()&&!AK.skip);
      AK.listening=null; VOICE.onInterim=null;
      if(!alive())return false;
      if(AK.skip||h.cancel||VOICE.denied) { AK.view=Object.assign({},view); akRender(); return true; }
      const alts=(h.alts||[]).filter(Boolean);
      const cmd=voiceCmd(alts);
      if(cmd==="forgot"){ return true; }
      if(cmd!=="repeat"&&(anySpeech||jaOk(alts,target,true))){ AK.view=Object.assign({},view,{heard:alts[0]}); akRender(); await speakP(pick(["Норм.","Похоже.","Да.","Красиво.","Ага."]),"ru"); return alive(); }
      if(cmd!=="repeat"){ AK.view=Object.assign({},view,{heard:alts[0]}); akRender(); await speakP(pick(["Не похоже. Слушай ещё раз.","Неа, не то. Ещё раз.","Ты что-то своё сказал. Слушай."]),"ru"); if(!alive())return false; }
      await speakP(target,"ja",.65); if(!alive())return false;
    }
    await speakP("Ладно, потом дожмём.","ru"); return alive();
  }
  async function intro(task){
    const p=task.p; setLabel(p);
    const story=S.akShort?(/[.!?…)]$/.test(p[1])?p[1]:p[1]+"."):p[2];
    if(!await talk((task.n?`${p.kind==="w"?"Слово":"Фраза"} ${task.n} из ${task.of}. `:"")+story,task.n%2?"happy":"laugh"))return false;
    AK.view={kind:"teach",p,chunk:p[0]}; AK.mood="happy"; akRender();
    await speakP(p[0],"ja",.7); if(!alive())return false;
    const ch=p.kind==="g"?[]:chunksOf(p[0]);
    if(ch.length){
      if(!S.akShort){ AK.view={kind:"teach",p,chunk:p[0],note:"по кусочкам"}; akRender(); await speakP("Длинная. Разберём по кусочкам.","ru"); if(!alive())return false; }
      for(let k=0;k<ch.length;k++){
        AK.view={kind:"teach",p,chunk:ch[k],note:`кусочек ${k+1}`}; akRender();
        await speakP(ch[k],"ja",.65); if(!alive())return false;
        if(k===0){ await speakP("Повтори.","ru"); if(!alive())return false; }
        if(!await echo(ch[k],{kind:"repeat",p,chunk:ch[k],cue:"повтори кусочек"},true,Math.max(2,repP())))return false;
      }
      AK.view={kind:"teach",p,chunk:p[0],note:"целиком"}; akRender();
      await speakP("Теперь целиком.","ru"); if(!alive())return false;
      await speakP(p[0],"ja",.75); if(!alive())return false;
    }
    const cue=S.akShort?pick(AK_SHORT_REP):pick(AK_REPEAT);
    AK.view={kind:"repeat",p,chunk:p[0],cue}; akRender();
    await speakP(cue,"ru"); if(!alive())return false;
    if(!await echo(p[0],{kind:"repeat",p,chunk:p[0],cue},false,repP()+1))return false;
    AK.view={kind:"teach",p,chunk:p[0],note:"в живом темпе"}; akRender();
    await speakP(S.akShort?"Быстрее.":"И ещё раз, в живом темпе.","ru"); if(!alive())return false;
    await speakP(p[0],"ja",.95); if(!alive())return false;
    if(!await echo(p[0],{kind:"repeat",p,chunk:p[0],cue:"повтори быстро"},false,repP()))return false;
    srsSeen(p[0],true);
    return true;
  }

  async function recall(task){
    const p=task.p; setLabel(p);
    const v={jp:p[0],ru:p[1]};
    const c=COURSE[p.ci], same=(p.kind==="w"?c.W:c.P).map(q=>({jp:q[0],ru:q[1]}));
    const gapQ=p.kind==="g";
    const jr=task.dir==="jr"&&!gapQ;
    const word=p.kind==="w";
    const readCh=!!COURSE[p.ci].read;
    const promptRu=readCh?(jr?"Как читается:":p[3]):jr?(word?"Что значит слово:":"Что значит:"):(S.akShort?"Как будет: "+p[1].replace(/[?!.]+$/,"")+"?":p[3]);
    let promptHtml=jr?`<span class="akru">${esc(promptRu)}</span><span class="jp akjp">${rb(p[0])}</span>`:`<span class="akru">${esc(promptRu)}</span>`;
    let opts=null;
    if(gapQ){ promptHtml=`<span class="akru">${esc(p[3])}</span>${gapHTML(p)}<span class="hint">${esc(p[1])}</span>`; opts=gapOpts(p,full?4:3); }
    else if(eyes){ const n=full?4:3; opts=jr?shuffle([v,...otherV(v,same,n-1,"ru")]).map(o=>({ru:o.ru,ok:o===v})):shuffle([v,...otherV(v,same,n-1,"jp")]).map(o=>({jp:o.jp,ok:o===v})); }
    AK.tap=null; AK.view={kind:"check",p,opts,promptHtml}; akRender();
    if(bg){ chime(); await sleep(700); if(!alive())return false; }
    if(gapQ){ await speakP((S.akShort?"":p[3]+" ")+p[1]+".","ru"); if(!alive())return false; const [ga,gb]=p.gapT.split("＿"); await speakP(ga+"… "+gb,"ja",.8); if(!alive())return false; }
    else { await speakP(promptRu,"ru"); if(!alive())return false;
    if(jr){ await speakP(p[0],"ja",.8); if(!alive())return false; } }
    const T=hfT(AK.mode);
    let vres=null, said="";
    if(S.voice&&SR&&!VOICE.denied&&AK.tap==null){
      const lang=(jr&&!readCh)?"ru":"ja";
      AK.listening=gapQ?"gap":readCh?"read":lang; AK.heardTxt=""; akRender();
      VOICE.onInterim=tx=>{ AK.heardTxt=tx; const el=document.getElementById("micTxt"); if(el) el.textContent=tx||"слушаю…"; };
      AK.showOpts=false;
      const heard=await Promise.race([listenUntil(lang,alive),new Promise(res=>{AK.waitResolve=()=>{cancelListen();res({tapped:true});};})]);
      AK.waitResolve=null; AK.listening=null; VOICE.onInterim=null; AK.showOpts=false;
      if(!alive())return false;
      if(VOICE.denied){ AK.view={kind:"talk",ru:"Микрофон не работает, так что отвечай кнопками. Причину написала сверху."}; akRender(); await speakP("Микрофон не работает, отвечай кнопками.","ru"); if(!alive())return false; AK.view={kind:"check",p,opts,promptHtml}; akRender(); }
      else if(heard.cancel){ vres="forgot"; }

        if(alts.length){
          if(gapQ?gapVoiceOk(alts,p):(jr&&!readCh)?ruOk(alts,p[1]):jaOk(alts,p[0],false,/\d/.test(p[1]))) vres="right";
          else { const cmd=voiceCmd(alts); vres=cmd||"wrong"; if(vres==="wrong"&&alts.some(x=>RUDE.test(x))) AK.rude=true; }
        }
      }
      if(vres==="repeat"){ await talk(pick(VOICE_REPEAT),"calm"); if(!alive())return false; return recall(task); }
      if(vres==="back"){ await talk(pick(VOICE_BACK),"calm"); if(!alive())return false; return "back"; }
    }
    if(!vres&&AK.tap==null){
      if(full){ await akWait(); if(!alive())return false; }
      else if(!(S.voice&&SR&&!VOICE.denied)){
        if(bg&&Math.random()<.3){ await speakP(pick(AK_RECALL_CUE),"ru"); if(!alive())return false; }
        for(let t=T;t>0;t--){ if(AK.tap!=null)break; AK.view={kind:"check",p,opts,promptHtml,sec:t,total:T}; akRender(); tick(false); await sleep(1000); if(!alive())return false; }
        tick(true);
      }
    }
    const tapped=vres?(vres==="right"||vres==="wrong"):AK.tap!=null;
    const right=vres?vres==="right":(tapped&&opts[AK.tap].ok);
    const talkSaid=vres&&vres!=="forgot"?said:"";
    const revealHtml=gapQ?`<span class="akru">Правильно:</span>${gapHTML(p,p.ans,"ok")}<span class="hint">${esc(p[1])}</span><span class="hint">${esc(p[2])}</span>`:promptHtml;
    const sayAnswer=async(withRepeat)=>{
      AK.view={kind:"reveal",p,opts,promptHtml:revealHtml}; akRender();
      if(gapQ){ await speakP(p[0],"ja",.8); if(!alive())return false; if(!S.akShort){ await speakP(p[2],"ru"); if(!alive())return false; }
        if(withRepeat){ await speakP("Повтори целиком.","ru"); if(!alive())return false; if(!await echo(p[0],{kind:"reveal",p,opts,promptHtml:revealHtml},false,Math.max(2,repP())))return false; }
        return true; }
      if(jr){ await speakP("Это: "+p[1],"ru"); if(!alive())return false; if(bg){ await speakP(p[0],"ja",.85); if(!alive())return false; } }
      else{
        await speakP(p[0],"ja",.8); if(!alive())return false;
        if(bg){ await sleep(400); await speakP(p[0],"ja",.95); if(!alive())return false; }
        if(withRepeat){ await speakP(S.akShort?"Повтори.":pick(["Повтори.","Скажи вслух.","Повторяй."]),"ru"); if(!alive())return false;
          if(!await echo(p[0],{kind:"reveal",p,opts,promptHtml},false,Math.max(2,repP())))return false; }

      return true;
    };
    if(vres==="forgot"){

      await speakP(AK.view.ru,"ru"); if(!alive())return false;
      if(!await sayAnswer(true))return false;
      if(task.grade||AK.review) srsGrade(p[0],0);
      const key=srsKey(p[0])+task.dir;
      if((r.requeued[key]||0)<2){ r.requeued[key]=(r.requeued[key]||0)+1; AK.plan.splice(r.i+3,0,{t:"recall",p,dir:"rj",fresh:true}); }
    } else if(tapped&&!right){
      AK.bad++; AK.mood=AK.bad>=3?"angry":"pout";
      const ins=AK.rude?pick(RUDE_BACK):pick(HER_RU[Math.min(1,Math.floor((AK.bad-1)/2))]); AK.rude=false;
      AK.view={kind:"react",ru:ins,bad:true,opts,said:talkSaid}; akRender(); beep(false); buzz();
      await speakP(ins,"ru"); if(!alive())return false;
      await speakP("Правильно:","ru"); if(!alive())return false;
      if(!await sayAnswer(true))return false;
      if(task.grade||AK.review) srsGrade(p[0],0);
      const key=srsKey(p[0])+task.dir;
      if((r.requeued[key]||0)<2){ r.requeued[key]=(r.requeued[key]||0)+1; AK.plan.splice(r.i+3,0,{t:"recall",p,dir:"rj",fresh:true}); }
      if(full){ AK.view={kind:"react",ru:"Запомнил? Я скоро ещё раз спрошу.",opts,wait:true}; akRender(); await akWait(); if(!alive())return false; }
    } else if(right){
      AK.good++; AK.mood=pick(["blush","laugh","happy"]);
      const pr=Math.random()<.3?pick(AK_PRAISE):pick(AK_RIGHT_SHORT);
      AK.view={kind:"react",ru:pr,opts,said:talkSaid}; akRender(); beep(true);
      await speakP(pr,"ru"); if(!alive())return false;
      AK.view={kind:"reveal",p,opts,promptHtml:revealHtml}; akRender();
      await speakP(jr?p[1]:p[0],jr?"ru":"ja",.85); if(!alive())return false;
      if(task.grade||AK.review) srsGrade(p[0],2);
    } else {
      await speakP("Ответ.","ru"); if(!alive())return false;
      if(!await sayAnswer(!jr))return false;
      if(task.grade||AK.review) srsGrade(p[0],1);
    }
    AK.reviewed++;
    await sleep(250);
    return alive();
  }

  while(r.i<AK.plan.length){
    const task=AK.plan[r.i];
    AK.prog=Math.min(.98,r.i/AK.plan.length);
    if(task.t==="hello"){
      const been=!AK.review&&(()=>{const s=chStats(AK.ch);return s.w.l+s.p.l>0;})();
      const hello=S.akShort?pick(AK_SHORT_HELLO):!AK.review&&!been?pick(AK_HELLO):S.acad.lastBad>=3?pick(AK_HELLO_BAD):S.acad.lastGood?pick(AK_HELLO_GOOD):pick(AK_HELLO);
      if(!await talk(hello,"happy"))return;
    }
    else if(task.t==="rule"){ const c=COURSE[AK.ch]; AK.view={kind:"talk",ru:c.rule}; AK.mood="laugh"; akRender(); await speakP(c.rule,"ru"); if(!alive())return; S.ruleHeard=S.ruleHeard||{}; S.ruleHeard[AK.ch]=Date.now(); save(); }
    else if(task.t==="preview"){
      const L=AK.items, names=L.slice(0,6).map(p=>p[1].replace(/[?!.]+$/,"").replace(/\s*\(.*\)/,"")).join(", ");
      if(!await talk((L.length<=6?"Сегодня выучишь: "+names+".":`Сегодня ${L.length} новых. Начнём с: ${names}.`)+" Не страшно, я помогу.","blush"))return;
    }
    else if(task.t==="say"){ if(!await talk(task.ru,"calm"))return; }
    else if(task.t==="intro"){ if(!await intro(task))return; }
    else if(task.t==="recall"){ const x=await recall(task); if(x===false)return; if(x==="back"){ let j=r.i-1; while(j>0&&!["intro","recall"].includes(AK.plan[j].t)) j--; r.i=Math.max(0,j); continue; } }
    else if(task.t==="final"){
      const used=new Set(); let k=task.k||0;
      while(k<task.limit){
        const p=srsPick(1,used,task.chapters)[0]; if(!p) break;
        used.add(srsKey(p[0]));
        task.k=++k;
        const x=await recall({t:"recall",p,dir:k%4===0?"jr":"rj",grade:true}); if(x===false)return;
        AK.prog=Math.min(.98,k/task.limit);
      }
    }
    else if(task.t==="end"){
      AK.prog=1;
      S.acad.lastBad=AK.bad; S.acad.lastGood=AK.bad===0&&AK.good>0; S.xp+=AK.reviewed*3; markDay(); save();
      const end=S.akShort?pick(AK_SHORT_END):AK.bad>=3?pick(AK_END_BAD):pick(AK_END_GOOD);
      AK.mood=AK.bad>=3?"pout":"blush";
      if(!await talk(end))return;
      wakeOff(); r.i++; return AK.review?akReviewEnd():akEnd();
    }
    r.i++;
  }
}

/* =================== СОЗВОН-ЭКЗАМЕН =================== */
function examPool(chs){ const set=new Set(chs); const seen=new Set(); return ALLI.filter(t=>set.has(t.ci)&&!seen.has(srsKey(t[0]))&&seen.add(srsKey(t[0]))); }
function akExamStart(chs,lv,final){
  const L=(final?EXAM_FINAL:EXAM_LV)[lv];
  const pool=examPool(chs);
  const qs=[]; let bag=[];
  while(qs.length<L.n){ if(!bag.length) bag=shuffle(pool.slice()); const p=bag.pop();
    const canBuild=p.kind==="p"&&p[0].split(" ").length>=2;
    const r=Math.random(); const type=p.kind==="g"?"g":canBuild&&r<(lv==="easy"?.15:lv==="mid"?.25:.35)?"c":r<.6?"a":"b";
    qs.push({p,type}); }
  AK.ch=chs[0]; AK.lbl=null; AK.cur=null; AK.review=false; AK.bad=0; AK.good=0; AK.mood="happy"; AK.paused=false;
  const lives=final?5:3;
  AK.exam={lv,lives,max:lives,i:0,n:L.n,o:L.o,qs,streak:0,maxStreak:0,final,chs,t0:Date.now()};
  AK.view={kind:"talk",ru:""};
  akBoot(); akExamRun();
}
async function akExamRun(resume){
  const my=++HF.token, alive=()=>HF.token===my;
  const E=AK.exam;
  const talk=async(ru,mood)=>{ if(mood)AK.mood=mood; AK.view={kind:"talk",ru}; akRender(); await speakP(ru,"ru"); return alive(); };
  const r=resume||{started:false}; AK.resume=r;
  if(!r.started){ if(!await talk(S.akShort?pick(AK_SHORT_HELLO)+(E.final?" Финальный экзамен.":" Созвон, три жизни."):pick(E.final?EX_HELLO_FINAL:EX_HELLO),"pout"))return; r.started=true; }
  while(E.i<E.n&&E.lives>0){
    const q=E.qs[E.i], p=q.p, v={jp:p[0],ru:p[1]}; AK.prog=E.i/E.n; AK.cur={ci:p.ci};
    const c=COURSE[p.ci], same=(p.kind==="w"?c.W:c.P).map(x=>({jp:x[0],ru:x[1]}));
    let ok=false, rightLabel, rightLang;
    AK.tap=null;
    if(q.type==="c"){
      const toks=p[0].split(" "); const extra=[];
      for(const o of shuffle(ALLI.filter(t=>t.kind==="p"))){ if(extra.length>=2)break; for(const t of o[0].split(" ")){ if(!toks.includes(t)&&!extra.includes(t)){extra.push(t);break;} } }
      const b={tiles:shuffle([...toks,...extra].map((t,i)=>({t,i}))),sel:[],answer:p[0],done:false,ok:false};
      const promptHtml=`<span class="akru">Собери по-японски:</span><span class="akru" style="font-size:20px">${esc(p[1])}</span>`;
      AK.view={kind:"build",p,b,promptHtml}; akRender();
      await speakP("Собери: "+p[1],"ru"); if(!alive())return;
      if(!b.done){ await akWait(); if(!alive())return; }
      ok=b.ok; rightLabel=p[0]; rightLang="ja";
      AK.view={kind:"reveal",p,opts:[{jp:p[0],ok:true}],promptHtml};
    } else {
      let opts,promptRu,promptHtml;
      if(q.type==="g"){
        opts=gapOpts(p,E.o); promptRu=p[3]+" "+p[1]+".";
        promptHtml=`<span class="akru">${esc(p[3])}</span>${gapHTML(p)}<span class="hint">${esc(p[1])}</span>`;
      } else if(q.type==="a"){
        opts=shuffle([v,...otherV(v,same,E.o-1,"jp")]).map(o=>({jp:o.jp,ok:o===v}));
        promptRu=S.akShort?"Как будет: "+p[1].replace(/[?!.]+$/,"")+"?":p[3];
        promptHtml=`<span class="akru">${esc(promptRu)}</span>`;
      } else {
        opts=shuffle([v,...otherV(v,same,E.o-1,"ru")]).map(o=>({ru:o.ru,ok:o===v}));
        promptRu="Переведи.";
        promptHtml=`<span class="akru">Переведи:</span><span class="jp akjp">${rb(p[0])}</span>`;
      }
      AK.view={kind:"check",p,opts,promptHtml}; akRender();
      await speakP(promptRu,"ru"); if(!alive())return;
      if(q.type==="b"){ await speakP(p[0],"ja",.8); if(!alive())return; }
      if(AK.tap==null){ await akWait(); if(!alive())return; }
      ok=opts[AK.tap].ok; rightLabel=q.type==="b"?p[1]:p[0]; rightLang=q.type==="b"?"ru":"ja";
      AK.view={kind:"reveal",p,opts,promptHtml};
    }
    if(!ok){
      E.lives--; AK.bad++; E.streak=0; AK.mood=E.lives<=1?"angry":"pout"; srsGrade(p[0],0);
      const opts=AK.view.opts;
      if(E.lives<=0){ const lv=pick(HER_LEAVE); AK.view={kind:"react",ru:lv,bad:true,opts}; akRender(); beep(false); buzz(); await speakP(lv,"ru"); if(!alive())return; break; }
      const ins=pick(HER_RU[Math.min(1,AK.bad-1)])+(E.lives===1?" Последняя жизнь, долбоёб.":"");
      AK.view={kind:"react",ru:ins,bad:true,opts}; akRender(); beep(false); buzz();
      await speakP(ins,"ru"); if(!alive())return;
      AK.view={kind:"reveal",p,opts,promptHtml:`<span class="akru">Правильно:</span><span class="jp akjp">${rb(p[0])}</span><span class="hint">${esc(p[1])}</span>`}; akRender();
      await speakP("Правильно:","ru"); if(!alive())return;
      await speakP(p[0],"ja",.85); if(!alive())return;
      AK.view={kind:"react",ru:"Запомнил? Дальше.",opts,wait:true}; akRender(); await akWait(); if(!alive())return;
    } else {
      AK.good++; E.streak++; E.maxStreak=Math.max(E.maxStreak,E.streak); AK.mood=pick(["blush","laugh","happy"]); srsGrade(p[0],2);
      const pr=EX_STREAK[E.streak]||pick(S.akShort?["Да.","Ага.","Норм.","Верно, сука."]:AK_PRAISE);
      const opts=AK.view.opts;
      AK.view={kind:"react",ru:pr,opts}; akRender(); beep(true);
      await speakP(pr,"ru"); if(!alive())return;
      await speakP(rightLabel,rightLang,.9); if(!alive())return;
    }
    await sleep(300); if(!alive())return;
    E.i++;
  }
  AK.prog=1;
  const pass=E.lives>0;
  const key=E.final?"F":E.chs[0];
  const prev=S.acad.exam[key]||{best:0,pass:false,lv:{}};
  prev.lv=prev.lv||{}; prev.lv[E.lv]=Math.max(prev.lv[E.lv]||0,AK.good);
  S.acad.exam[key]={best:Math.max(prev.best,AK.good),pass:prev.pass||pass,lv:prev.lv};
  S.xp+=AK.good*8; markDay(); save();
  if(pass){ AK.mood="blush"; const m=S.akShort?"Сдал. Свободен, красавчик.":pick(EX_PASS); AK.view={kind:"talk",ru:m}; akRender(); await speakP(m,"ru"); if(!alive())return; }
  wakeOff(); akExamEnd(pass);
}

  const lvls=Object.keys(EXAM_LV), nextLv=lvls[lvls.indexOf(E.lv)+1];
  const c=COURSE[E.chs[0]];
  app.innerHTML=`<section class="screen res">

/* транслитерация каны в кириллицу (по Поливанову) — показываем только когда ошибся */
function kanaCyr(jp){
  const s=kanaOf(jp).replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
  let out="", i=0, gem=false;
  while(i<s.length){
    const two=s.slice(i,i+2), one=s[i];
    let it=BYK[two]||BYK[one], used=BYK[two]?2:1;
    if(one==="っ"){ gem=true; i++; continue; }
    if(one==="ー"){ out+=":"; i++; continue; }
    if(one==="ん"){ out+="н"; i++; continue; }
    if(!it){ out+=one; i++; gem=false; continue; }
    let c=CYR[it.r[0]]||it.r[0];
    if(it.k==="を") c="о"; if(it.k==="は"&&/^\s*$/.test(s[i+1]||" ")&&i>0) c="ва"; if(it.k==="へ"&&/^\s*$/.test(s[i+1]||" ")&&i>0) c="э";
    if(gem){ c=c[0]+c; gem=false; }
    out+=c; i+=used;
  }
  return out;
}

  const KN=knownKana(), seen=new Set();
  return ALLI.filter(t=>{ const k=kanaOf(t[0]); if(seen.has(k)) return false; seen.add(k);
    if(S.rp.src==="w"&&t.kind!=="w") return false; if(S.rp.src==="p"&&t.kind==="w") return false;

    render({msg:"🎧 Слушай…",mood:"calm"});
    if(!await play()) return;
    while(true){
      st.tap=null; st.replay=false;
      const voice=S.voice&&SR&&!VOICE.denied;
      render({msg:d.q,opts,listening:voice,mood:"happy"});
      await speakP(d.q,"ru"); if(!alive()) return;
      let heard=null;
      const waitTap=new Promise(r=>{st.res=r;});
      if(voice){
        VOICE.onInterim=tx=>{ const el=document.getElementById("micTxt"); if(el) el.textContent=tx||"слушаю…"; };
        heard=await Promise.race([listenUntil("ru",alive),waitTap.then(()=>null)]); VOICE.onInterim=null;
      } else await waitTap;
      if(!alive()) return;
      if(st.replay){ render({msg:"🎧 Ещё раз…",mood:"calm"}); if(!await play()) return; continue; }
      let ok;
      if(st.tap!=null) ok=opts[st.tap].ok;
      else { const alts=(heard&&heard.alts||[]).filter(Boolean); if(voiceCmd(alts)==="repeat"){ render({msg:"🎧 Ещё раз…",mood:"calm"}); if(!await play()) return; continue; } ok=ruOk(alts,d.a); st.tap=opts.findIndex(o=>o.ok&&ok)>=0?opts.findIndex(o=>o.ok):opts.findIndex(o=>!o.ok); }
      if(ok){ good++; render({msg:pick(RP_RIGHT),opts,done:true,tap:st.tap,mood:"blush"}); beep(true); await speakP(st.v.msg,"ru"); }
      else { render({msg:pick(HER_RU[0])+" Правильно: "+d.a,opts,done:true,tap:st.tap,bad:true,mood:"angry"}); beep(false); buzz(); await speakP(st.v.msg,"ru"); }
      if(!alive()) return;
      await new Promise(r=>{st.res=r;}); if(!alive()) return;
      break;
    }
  }
  wakeOff(); S.ls.best=Math.max(S.ls.best||0,good); S.xp+=good*5; markDay(); save();
  app.innerHTML=`<section class="screen res">
    <div class="stage small bg-day">${sceneDeco("day")}<div class="girlwrap">${girlSVG(good>=7?"blush":good>=5?"happy":"pout")}</div></div>
    <h2>${good===8?"ЕБАТЬ ТЫ МАКТРАХЕР ПРЯМ":good>=6?"СЛЫШИШЬ, КРАСАВА":"НУ Я В АХУЕ С ВАС"}</h2>
    <p>Понял ${good} из 8</p>
    <button class="big" id="again" ${pinkBtn}>Ещё 8 диалогов</button>
    <button class="ghost" id="back">Назад</button>
  </section>`;
  document.getElementById("again").onclick=()=>{ voicePrime(); listenRun(); };
  document.getElementById("back").onclick=listenScreen;
}

function nSplitKana(str){ const out=[]; let i=0; while(i<str.length){ const two=str.substr(i,2); if(two.length===2&&BYK[two]){out.push(two);i+=2;} else { if(BYK[str[i]]) out.push(str[i]); i++; } } return out; }

function vBuild(step){
  const c=step.c, tasks=[];
  if(step.k==="voice"){
    const l=step.l;
    if(c.kana){ l.items.forEach(it=>tasks.push({t:"kana",it,id:it.id})); return {kind:"kana",tasks,teach:[]}; }
    l.items.forEach((it,i)=>{ tasks.push({t:"say",it,id:it.id}); if(it.kind==="w"&&i%3===1) tasks.push({t:"mean",it,id:it.id+"#m"}); });
    return {kind:"lesson",tasks,teach:l.items};
  }
  if(step.k==="call"){
    if(c.kana){ c.L.flatMap(l=>l.items).forEach(it=>tasks.push({t:"kana",it,id:it.id})); return {kind:"kana",tasks,teach:[]}; }
    c.T.forEach(tk=>tasks.push({t:"reply",tk,id:tk.id}));
    c.L.flatMap(l=>l.items).forEach((it,i)=>{ tasks.push(i%5===4&&it.kind==="w"?{t:"mean",it,id:it.id+"#m"}:{t:"say",it,id:it.id}); });
    return {kind:"call",tasks,teach:[]};
  }
  if(step.k==="oral"){
    N5_CONTENT.forEach(c=>{ shuffle(c.T).slice(0,3).forEach(tk=>tasks.push({t:"reply",tk,id:tk.id})); shuffle(c.L.flatMap(l=>l.items)).slice(0,2).forEach((it,i)=>tasks.push(i===1&&it.kind==="w"?{t:"mean",it,id:it.id+"#m"}:{t:"say",it,id:it.id})); });
    N5C.filter(c=>c.kana).forEach(c=>shuffle(c.L.flatMap(l=>l.items)).slice(0,3).forEach(it=>tasks.push({t:"kana",it,id:it.id})));
    return {kind:"oral",tasks,teach:[]};
  }
}

async function vListen(lang,alive){

    if(!alive()) return {dead:true};
    if(NV.typed!=null){ const t=NV.typed; NV.typed=null; NV.listening=null; return {alts:[t],typed:true}; }
    if(NV.cmd){ const c=NV.cmd; NV.cmd=null; NV.listening=null; if(c==="switch"){ vRender(); continue; } return {cmd:c,alts:[]}; }
    if(NV.typing||!nVoiceOn()){ if(NV.listening!=="__t"){ NV.listening=null; vRender(); NV.listening="__t"; } await sleep(150); continue; }
    NV.listening=lang; NV.heardTxt=""; vRender();
    VOICE.onInterim=tx=>{ NV.heardTxt=tx; const el=document.getElementById("vHeard"); if(el) el.textContent=tx||"…"; };
    const h=await Promise.race([listen(lang==="kana"?"ru":lang,15000,()=>alive()&&NV&&NV.typed==null&&!NV.cmd), new Promise(res=>{ const iv=setInterval(()=>{ if(!alive()||!NV||NV.typed!=null||NV.cmd){ clearInterval(iv); res({alts:[]}); } },40); })]);
    VOICE.onInterim=null; NV.listening=null;
    if(!alive()) return {dead:true};
    const alts=(h.alts||[]).filter(Boolean);
    if(alts.length) return {alts,vcmd:voiceCmd(alts)};
    if(VOICE.denied){ vRender(); continue; }
    if(Date.now()-lastNudge>45000){ lastNudge=Date.now(); const nl=pick(AK_NUDGE); NV.view=Object.assign({},NV.view,{heard:null}); await speakP(nl,"ru"); }
  }

async function vRun(){
  const my=++HF.token, alive=()=>HF.token===my&&NV&&!NV.dead;
  const say=async(ru,mood)=>{ if(mood) NV.mood=mood; NV.view={ru}; vRender(); await speakP(ru,"ru"); return alive(); };
  const hello=NV.kind==="call"?pick(VL.helloCall).replace("{t}",NV.step.c.t):NV.kind==="kana"?pick(VL.helloKana):NV.kind==="oral"?pick(VL.helloOral):pick(VL.helloLesson);
  if(!await say(hello,"happy")) return;
  /* урок частицы: сначала коротко объясняет */
  const gl=NV.step&&NV.step.l&&NV.step.l.gram;
  if(gl){ for(const s of gl.slides){ NV.skip=false; NV.mood="happy"; NV.view={ru:s.say,ja:s.ex,canSkip:true}; vRender(); await speakP(s.say,"ru"); if(!alive()) return; if(!NV.skip){ await nSayJa(s.ex,.75); if(!alive()) return; } NV.cmd=null; }
    NV.skip=false; NV.view={}; if(!await say("Всё, теперь ты. Говоришь фразы — частица на своё место.")) return; }
  /* знакомство (урок голосом) */
  if(NV.teach.length){
    for(const it of NV.teach){
      NV.cur={teach:it};
      NV.mood="happy"; NV.view={ru:pick(VL.teach)+it.ru,ja:it.jp}; vRender();
      await speakP(pick(VL.teach)+it.ru,"ru"); if(!alive()) return;
      await nSayJa(it.jp,.7); if(!alive()) return;
      for(let tr=0;;tr++){
        NV.view={ru:tr?pick(["Ещё раз.","Не то. Снова.","Давай ещё."]):pick(VL.teachRep),ja:it.jp}; vRender(); await speakP(NV.view.ru,"ru"); if(!alive()) return;
        const h=await vListen("ja",alive); if(!alive()) return;
        let ok=!h.cmd&&(h.typed?nTypeOk(h.alts[0],[it.jp]):nOk(h.alts,[it.jp,...(it.acc||[])]));
        if(!ok&&h.vcmd&&!h.cmd) h.cmd=h.vcmd;
        if(h.cmd==="skip"){ NV.skip=false; continue; }
        if(h.cmd==="back"){ continue; }
        if(h.cmd==="repeat"){ await nSayJa(it.jp,.7); tr--; continue; }
        if(h.cmd==="forgot"){ await nSayJa(it.jp,.7); continue; }
        if(!h.typed) nSk("pron",ok);
        NV.view={ru:ok?pick(VL.teachOk):pick(VL.teachBad),ja:it.jp,heard:h.alts[0]}; vRender();
        await speakP(NV.view.ru,"ru"); if(!alive()) return;
        if(ok) break; await nSayJa(it.jp,.65); if(!alive()) return;
      }
    }
    if(!await say(pick(VL.recall))) return;
  }
  /* круги, пока не будет чисто */
  while(true){
    NV.errs=new Map(); NV.asked=0; NV.hist=[];
    let q=shuffle(NV.tasks); if(NV.kind==="lesson"){ q=q.filter(t=>t.t!=="mean").concat(q.filter(t=>t.t==="mean")); }
    if(NV.round>1&&NV.lastTicked) { const tk=NV.tasks.filter(t=>NV.lastTicked.has(t.id)); q=(window.AP&&AP.on)?shuffle(tk.concat(tk)):q.concat(shuffle(tk)); }
    NV.queue=q; const retry=new Map();
    while(NV.queue.length){
      const task=NV.queue.shift();
      const r=await vAsk(task,alive); if(!alive()) return;
      if(NV.finish) break;
      NV.hist=NV.hist||[];
      if(r.back){ NV.queue.unshift(task); if(NV.hist.length){ NV.queue.unshift(NV.hist.pop()); NV.asked=Math.max(0,NV.asked-1); } await speakP(pick(["Ладно, назад.","Окей, отматываю.","Назад так назад."]),"ru"); continue; }
      NV.hist.push(task); if(NV.hist.length>30) NV.hist.shift();
      NV.asked++;
      if(!r.ok) nErr(task.it?task.it.id:task.tk?task.tk.id:null);
      if(NV.endless&&!NV.queue.length) NV.queue=shuffle(NV.tasks).filter((t,i,a)=>!(i===0&&t===task&&a.length>1)||true);
      if(!r.ok&&!NV.endless){
        const prev=NV.errs.get(task.id); if(!prev) NV.errs.set(task.id,{task,heard:r.heard||"",fixed:false}); NV.totalErr++;
        const rc=(retry.get(task.id)||0)+1; retry.set(task.id,rc);
        if(rc<=2){ NV.queue.splice(Math.min(NV.queue.length,2+Math.floor(Math.random()*4)),0,task); NV.asked--; }
      } else if(NV.errs.has(task.id)) NV.errs.get(task.id).fixed=true;
    }
    if(NV.finish||NV.endless||!NV.errs.size) break;
    wakeOff();
    const ticked=await vReview(); if(!NV||NV.dead) return; akBoot();
    if(!ticked.size){ if(!await say(pick(VL.notick),"blush")) return; break; }
    NV.lastTicked=ticked; NV.round++;
    if(!await say(pick(VL.round2),"pout")) return;
  }
  /* финал */
  const n=NS(); const share=NV.totalErr/Math.max(1,NV.tasks.length);
  const end=NV.totalErr===0?pick(VL.endClean):share>.2||NV.round>2?pick(VL.endTired):pick(VL.endOk);
  if(!NV.endless&&!await say(end,NV.totalErr===0?"blush":share>.2?"pout":"laugh")) return;
  const secs=(Date.now()-NV.t0)/1000; nLog(0,secs); S.xp+=NV.tasks.length*5; nMark();
  const st=NV.step;
  if(st.k==="voice"||st.k==="call") n.les3=(n.les3||0)+1;
  if(st.k==="errv"){ }
  if(st.k==="voice"){ const d=n.done[st.l.id]||(n.done[st.l.id]={}); d.voice=Date.now(); st.l.items.forEach(it=>{ if(!n.srs[it.id]) n.srs[it.id]={b:1,d:Date.now()+N_INT[1],t:Date.now()}; }); }
  if(st.k==="call"){ const ch=n.ch[st.c.id]||(n.ch[st.c.id]={}); ch.call=Date.now(); ch.callErr=NV.totalErr; if(!ch.exam) ch.exam=Date.now(); st.c.L.forEach(l=>{ const d=n.done[l.id]||(n.done[l.id]={}); if(!d.tap) d.tap=Date.now(); if(!d.voice) d.voice=Date.now(); l.items.forEach(it=>{ if(!n.srs[it.id]) n.srs[it.id]={b:1,d:Date.now()+N_INT[1],t:Date.now()}; }); }); }
  if(st.k==="oral"){ n.oral=Date.now(); n.oralErr=NV.totalErr; if(!n.win) n.win=Date.now(); }
  save(); wakeOff();
  const info={kind:NV.kind,step:st,err:NV.totalErr,rounds:NV.round,secs,n:NV.tasks.length,ok:NV.freeOk,bad:NV.freeBad}; NV=null;
  if(st.k==="oral") return n5Win(); vEnd(info);
}
async function vAsk(task,alive){
  NV.cur=task; NV.typed=null; NV.cmd=null; NV.skip=false;
  const it=task.it, tk=task.tk;
  let targets, lang, sayPrompt;
  if(task.t==="kana"){ targets=null; lang="kana"; }
  else if(task.t==="say"){ targets=[it.jp,...(it.acc||[]),...(typeof nSynMates==="function"?nSynMates(it).map(x=>x.jp):[])]; lang="ja"; }
  else if(task.t==="reply"){ targets=tk.ans; lang="ja"; }
  else if(task.t==="mean"){ lang="ru"; }
  const ask=async()=>{
    NV.mood=pick(["happy","neutral","laugh"]);
    if(task.t==="kana"){ NV.view={kanaBig:it.jp,ru:""}; vRender(); await speakP(pick(VL.kana),"ru"); return; }
    if(task.t==="say"){ const p=pick(VL.ask)+it.ru; NV.view={ru:p}; vRender(); await speakP(p,"ru"); return; }
    if(task.t==="mean"){ NV.view={ja:it.jp,ru:pick(VL.askMean)}; vRender(); await nSayJa(it.jp); if(!alive()) return; await speakP(NV.view.ru,"ru"); return; }
    if(task.t==="reply"){ NV.view={ja:tk.q||"",hint:(tk.q&&!NS().hintVoice)?tk.hint:tk.hint}; vRender();
      if(tk.q){ await nSayJa(tk.q); if(!alive()) return; if(NS().hintVoice) await speakP("Подсказка: "+tk.hint,"ru"); }
      else await speakP(tk.hint,"ru"); }
  };
  await ask(); if(!alive()) return {ok:false};
  for(let tries=0;tries<4;tries++){
    const h=await vListen(lang,alive); if(!alive()) return {ok:false};
    if(h.cmd==="back"||(!h.cmd&&h.vcmd==="back"&&(NV.hist||[]).length&&!(task.t==="kana"?nKanaOk(h.alts,it):task.t==="mean"?nRuOk(h.alts,it.ru):nOk(h.alts,targets)))) return {back:true};
    let ok=false, heard=(h.alts||[])[0]||"";
    if(h.cmd) ok=false;
    else if(task.t==="kana") ok=h.typed?(kanaTypeOk(heard,it.kana)||nKanaOk([heard],it)):nKanaOk(h.alts,it);
    else if(task.t==="mean") ok=nRuOk(h.alts,it.ru)||(typeof nSynMates==="function"&&nSynMates(it).some(x=>nRuOk(h.alts,x.ru)));
    else ok=h.typed?nTypeOk(heard,[targets[0],...targets.slice(1).filter(x=>!/[一-鿿]/.test(x))]):nOk(h.alts,targets);
    if(!ok&&!h.cmd&&h.vcmd) h.cmd=h.vcmd;
    if(h.cmd==="repeat"&&tries<8){ await ask(); if(!alive()) return {ok:false}; tries--; continue; }
    if(!h.typed&&h.cmd!=="forgot"&&task.t!=="mean") nSk("pron",ok);
    if(task.t==="reply"||task.t==="say") nSk(task.t==="reply"?"listen":"vocab",ok);
    if(it&&task.t!=="kana") nGrade(it.id,ok,false);
    const answerJa=task.t==="kana"?it.jp:task.t==="reply"?tk.ans[0]:task.t==="say"?it.jp:null;
    if(ok){ NV.mood=pick(["blush","laugh","happy"]); const pr=pick(VL.right);
      NV.skip=false; NV.view=Object.assign({},NV.view,{heard,ru:pr,ans:task.t==="kana"?null:answerJa,bad:false,canSkip:true}); vRender(); beep(true);
      await speakP(pr,"ru"); return {ok:true}; }
    /* ошибка: разбор можно пропустить (Enter), но дальше — только когда скажешь/напишешь правильно */
    NV.mood=h.cmd==="forgot"?"pout":"angry"; beep(false); buzz();
    NV.skip=false; const go=()=>alive()&&!NV.skip;
    const w=h.cmd==="forgot"?pick(["Забыл? Слушай:","Запоминай:"]):pick(["Нет.","Мимо.","Не то.","Неа."]);
    const showAns=async()=>{ NV.skip=false;
      if(task.t==="kana"){ NV.view={kanaBig:it.jp,ru:`${it.ru} — «${it.cyr}»`,heard,bad:true,canSkip:true}; vRender(); await speakP(it.cyr||it.ru,"ru"); }
      else if(task.t==="mean"){ NV.view={ja:it.jp,ru:it.ru,heard,bad:true,canSkip:true}; vRender(); await speakP(it.ru,"ru"); }
      else { NV.view={ja:task.t==="reply"?tk.q:"",ru:"Правильно так:",ans:answerJa,heard,bad:true,canSkip:true}; vRender(); if(go()) await nSayJa(answerJa,.8); } };
    if(task.t==="kana"){ NV.view={kanaBig:it.jp,ru:`${w} ${it.ru} — «${it.cyr}»`,heard,bad:true,canSkip:true}; vRender(); await speakP(w+" "+(it.cyr||it.ru),"ru"); }
    else if(task.t==="mean"){ NV.view={ja:it.jp,ru:`${w} ${it.ru}`,heard,bad:true,canSkip:true}; vRender(); await speakP(w+" "+it.ru,"ru"); }
    else { NV.view={ja:task.t==="reply"?tk.q:"",ru:w,ans:answerJa,heard,bad:true,canSkip:true}; vRender(); await speakP(w,"ru"); if(go()) await nSayJa(answerJa,.8); }
    if(!alive()) return {ok:false};
    /* петля: пока не будет правильно — дальше не идём */
    const chk=(hh)=>{ const a0=(hh.alts||[])[0]||"";
      if(task.t==="kana") return hh.typed?(kanaTypeOk(a0,it.kana)||nKanaOk([a0],it)):nKanaOk(hh.alts,it);
      if(task.t==="mean") return nRuOk(hh.alts,it.ru)||(typeof nSynMates==="function"&&nSynMates(it).some(x=>nRuOk(hh.alts,x.ru)));
      return hh.typed?nTypeOk(a0,[answerJa]):nOk(hh.alts,[answerJa]); };
    const sayAgain=task.t==="mean"?"Скажи перевод сам.":task.t==="kana"?"Прочитай сам.":"Теперь ты. Пока не скажешь правильно — дальше не пойдём.";
    let fails=0;
    while(true){
      NV.skip=false;
      NV.view=Object.assign({},NV.view,{ru:fails?pick(["Ещё раз.","Нет. Ещё.","Давай ещё.","Не то. Снова."]):sayAgain,bad:false,canSkip:false,heard:null}); vRender();
      await speakP(NV.view.ru,"ru"); if(!alive()) return {ok:false};
      const h2=await vListen(task.t==="mean"?"ru":task.t==="kana"?"kana":"ja",alive); if(!alive()) return {ok:false};
      if(h2.cmd==="back") return {back:true};
      if(h2.cmd==="skip"){ continue; }
      const ok2=!h2.cmd&&chk(h2);
      const c2=!ok2&&!h2.cmd?h2.vcmd:h2.cmd;
      if(c2==="repeat"||c2==="forgot"){ await showAns(); if(!alive()) return {ok:false}; continue; }
      if(!h2.typed&&task.t!=="mean") nSk("pron",ok2);
      if(ok2){ NV.mood="happy"; NV.view=Object.assign({},NV.view,{heard:(h2.alts||[])[0]||"",ru:pick(VL.teachOk),bad:false,canSkip:false}); vRender(); beep(true); await speakP(NV.view.ru,"ru"); break; }
      fails++; heard=(h2.alts||[])[0]||""; NV.mood="angry"; beep(false); buzz();
      await showAns(); if(!alive()) return {ok:false};
    }
    NV.skip=false; if(NV.view) NV.view.canSkip=false;
    if(!alive()) return {ok:false};
    return {ok:false,heard};
  }
  return {ok:false};
}
function vReview(){
  return new Promise(res=>{
    const list=[...NV.errs.values()];
    const sel=new Set();
    const draw=()=>{
      app.innerHTML=`<section class="screen nrev">
        <div class="stage small bg-${NV.bg}">${sceneDeco(NV.bg)}<div class="girlwrap">${girlSVG("pout")}</div></div>
        <h2 class="nrevh">Закончено. Были ошибки: ${list.length}</h2>
        <div class="note">Иногда микрофон слышит хуйню, хотя ты сказал правильно. Поэтому решай честно: <b>отметь галочкой то, где ты реально проебался.</b> Если отметишь хоть одно — Юки погонит всю тему по новой. Если ничего — засчитает.</div>
        <div class="rvlist">${list.map((e,i)=>{ const t=e.task; const jp=t.t==="kana"?t.it.jp:t.t==="reply"?t.tk.ans[0]:t.it.jp; const ru=t.t==="kana"?t.it.ru+" · «"+t.it.cyr+"»":t.t==="reply"?(t.tk.q?plain(t.tk.q)+" → ":"")+t.tk.hint:t.it.ru;
          return `<button class="rvi ${sel.has(i)?"on":""}" data-i="${i}" aria-pressed="${sel.has(i)}"><span class="chk">${sel.has(i)?"✓":""}</span><span class="tx"><span class="${t.t==="kana"?"kfont":"jfont"}">${rb(jp)}</span><small>${esc(ru)}</small>${e.heard?`<small class="hd">услышала: «${esc(e.heard)}»</small>`:`<small class="hd">ты сказал «не знаю»</small>`}${e.fixed?`<small class="fx">потом ответил верно</small>`:""}</span></button>`; }).join("")}</div>
        <button class="big" id="rvgo" ${pinkBtn}>${sel.size?`ДА, ЗАТУПИЛ В ${sel.size} — ГОНИ ЗАНОВО`:"Я ВСЁ СКАЗАЛ ПРАВИЛЬНО — ЗАСЧИТАЙ"}</button>
        <button class="ghost" id="rvall">Отметить всё</button>
      </section>`;
      app.querySelectorAll(".rvi").forEach(b=>b.onclick=()=>{ const i=+b.dataset.i; sel.has(i)?sel.delete(i):sel.add(i); draw(); });
      document.getElementById("rvall").onclick=()=>{ list.forEach((_,i)=>sel.add(i)); draw(); };
      document.getElementById("rvgo").onclick=()=>{ res(new Set([...sel].map(i=>list[i].task.id))); };
      window.scrollTo(0,0);
    };
    draw();
    speakP(`Закончено. Ошибок: ${list.length}. Отметь, где реально затупил.`,"ru");
  });
}

  const st=info.step, c=st.c;
  const next=nNext();
  app.innerHTML=`<section class="screen res">
    <div class="stage small bg-${c.bg}">${sceneDeco(c.bg)}<div class="girlwrap">${girlSVG(info.err===0?"blush":"laugh")}</div></div>
    <h2>${info.err===0?"ЧИСТО, БЛЯТЬ":info.rounds>2?"ДОЖАЛ, ТУГОДУМ":"ЗАСЧИТАНО"}</h2>
    <p>${st.k==="call"?`Глава «${esc(c.t)}» закрыта${N5C[c.ci+1]?` — открыта следующая: «${esc(N5C[c.ci+1].t)}»`:""}.`:"Урок голосом пройден."}</p>
    <div class="stats"><div class="stat"><b>${info.n}</b><small>вопросов</small></div><div class="stat"><b>${info.err}</b><small>ошибок</small></div><div class="stat"><b>${fmtClock(info.secs*1000)}</b><small>время</small></div></div>
    ${next&&next.k!=="final"?`<button class="big" id="nx" ${pinkBtn}>▶ ДАЛЬШЕ: ${esc(nStepLabel(next))}</button>`:next&&next.k==="final"?`<button class="big" id="nx" ${pinkBtn}>🔥 К ЭКЗАМЕНУ N5</button>`:""}
    <button class="ghost" id="hm">На главную</button>
  </section>`;
  const nx=document.getElementById("nx"); if(nx) nx.onclick=()=>nRunStep(next);
  document.getElementById("hm").onclick=home; window.scrollTo(0,0);
}

function nStepLabel(s){ if(!s) return ""; if(s.k==="final") return "Экзамен N5"; const c=s.c; return `${c.t} — ${s.k==="tap"?s.l.t+" (руками)":s.k==="voice"?s.l.t+(c.kana?" (вслух)":" (голосом)"):s.k==="exam"?"экзамен главы":"созвон"}`; }
function nRunStep(s){
  if(!s) return home();
  if(s.k==="final") return n5Final();
  const c=s.c;
  if(s.k==="tap") return tapStart({mode:"lesson",title:s.l.t,items:s.l.items,l:s.l,ci:c.ci});
  if(s.k==="voice"||s.k==="call") return vGate(s);
  if(s.k==="exam") return tapStart({mode:"exam",title:"Экзамен: "+c.t,items:c.L.flatMap(l=>l.items),talk:c.T,c,ci:c.ci});
}
function vGate(s){ // перед голосом: проверка микрофона и как это работает
  hfStop(); hideSheet();
  const c=s.c, b=vBuild(s);
  const mins=Math.max(2,Math.round(b.tasks.length*(s.k==="voice"?.45:.3)+(b.teach.length*.35)));
  app.innerHTML=`<section class="screen">
    <div class="pu-head"><button class="x" id="back">←</button><h2>${s.k==="call"?"📞 Созвон: "+esc(c.t):s.k==="oral"?"Экзамен Юки":"🎤 "+esc(s.l.t)}</h2></div>
    <div class="stage small bg-${s.k==="oral"?"whims":c.bg}">${sceneDeco(s.k==="oral"?"whims":c.bg)}<div class="girlwrap">${girlSVG("happy")}</div></div>
    <div class="note">${c.kana?"Буква на экране — ты читаешь вслух. Говори как слышится: «ка», «си», «цу». Ошибся — она скажет как надо, и в конце пойдёт новый круг.":s.k==="voice"?"Сначала Юки знакомит с каждым словом — ты повторяешь. Потом спрашивает по-русски, ты отвечаешь по-японски. Нажимать ничего не надо — можно в наушниках, без рук и без глаз.":"Юки говорит по-японски и даёт подсказку, что ответить. Отвечаешь голосом. Она проверит <b>всю главу</b>, и пока не ответишь всё без ошибок — не отпустит."}<br><br>В конце покажу список ошибок — отметишь галочкой, где реально затупил, а где микрофон не расслышал.</div>
    <div class="tline">Вопросов: <b>${b.tasks.length}</b>${b.teach.length?` + знакомство с ${b.teach.length}`:""} · примерно <b>${mins} мин</b> за круг</div>
    ${SR?`<label class="switch"><input type="checkbox" id="vv" ${S.voice?"checked":""}><span><b>🎤 Отвечать голосом</b><small>Микрофон включается сам. Команды голосом: «повтори», «не помню».</small></span></label>
    <div class="mictest"><button class="mini" id="micT">🎤 Проверить микрофон</button><span id="micRes">${VOICE.denied?"❌ "+esc(voiceNote()):""}</span></div>`:`<div class="micerr">${esc(voiceErrText())} Можно отвечать текстом — латиницей, она сама превратится в японский.</div>`}
    ${!c.kana?`<label class="switch"><input type="checkbox" id="vh" ${NS().hintVoice?"checked":""}><span><b>Подсказку говорить голосом</b><small>Выключи, если хочешь понимать её вопрос сам — подсказка останется только на экране.</small></span></label>`:""}
    <button class="big" id="go" ${pinkBtn}>${s.k==="call"?"📞 ПОЗВОНИТЬ":"ПОЕХАЛИ"}</button>
  </section>`;
  document.getElementById("back").onclick=home;
  const vv=document.getElementById("vv"); if(vv) vv.onchange=e=>{ S.voice=e.target.checked; save(); voicePrime(); };
  const vh=document.getElementById("vh"); if(vh) vh.onchange=e=>{ NS().hintVoice=e.target.checked; save(); };
  const mt=document.getElementById("micT"); if(mt) mt.onclick=micTest;
  document.getElementById("go").onclick=()=>vStart(s);
  window.scrollTo(0,0);
}

function nKjToday(){ return NS().kjd[dayKey()]||0; }
function nKjNext(n){ const k=NS().kj; return N5K.filter(x=>!k[x.k]).slice(0,n); }
function kanjiDay(force){
  hideSheet();
  const n=NS(), left=Math.max(0,n.kjDay-nKjToday());
  if(!left&&!force){
    const known=Object.keys(n.kj).length;
    app.innerHTML=`<section class="screen"><div class="pu-head"><button class="x" id="back">←</button><h2>Кандзи дня</h2></div>

let N5_MENU=false;
function nForecast(){
  const n=NS(), cn=nCounts(), left=cn.n-cn.l;
  const d=dayKey(), y=yesterday();
  const td=(n.log[d]||{}).n||0, yd=(n.log[y]||{}).n||0;
  const keys=Object.keys(n.log); const now=new Date(); let wk=0, wd=0;
  for(let i=0;i<7;i++){ const dd=new Date(now); dd.setDate(now.getDate()-i); const l=n.log[dayKey(dd)]; if(l){ wk+=l.n||0; } }
  wd=wk/7;
  const secs=Object.values(n.log).reduce((a,l)=>a+(l.s||0),0), learnedLog=Object.values(n.log).reduce((a,l)=>a+(l.n||0),0);
  const perMin=learnedLog>5&&secs>300?learnedLog/(secs/60):.5; // сколько новых в минуту
  const eta=rate=>{ if(!rate||rate<=0) return null; const days=Math.ceil(left/rate); const dt=new Date(); dt.setDate(dt.getDate()+days); return {days,dt}; };
  const fmt=e=>e?`${e.dt.toLocaleDateString("ru-RU",{day:"numeric",month:"long",year:e.days>300?"numeric":undefined})} (${e.days} ${plural(e.days)})`:"—";
  const base=yd||td;
  return {left,cn,lines:[
    {t:`Как ${yd?"вчера":"сегодня"} (${base} новых в день)`,e:eta(base)},
    {t:`Как в среднем за неделю (${Math.round(wd*10)/10} в день)`,e:eta(wd)},
    {t:`Если 30 минут в день (~${Math.round(perMin*30)} в день)`,e:eta(perMin*30)},
    {t:`Если час в день (~${Math.round(perMin*60)} в день)`,e:eta(perMin*60)}
  ].map(x=>({t:x.t,v:x.e?fmt(x.e):"нужно начать заниматься"}))};
}
function nSkills(){
  const n=NS(), cn=nCounts(), cov=cn.l/Math.max(1,cn.n);
  const acc=k=>{ const a=n.sk[k]; return a&&a[1]>=5?a[0]/a[1]:a&&a[1]?(a[0]+2)/(a[1]+3):0; };
  const words=N5_ALL().filter(t=>t.kind==="w"), sents=N5_ALL().filter(t=>t.kind==="s");
  const lw=words.filter(t=>nLearned(t.id)).length/Math.max(1,words.length), ls=sents.filter(t=>nLearned(t.id)).length/Math.max(1,sents.length);
  const kjc=Object.keys(n.kj).length/N5K.length;
  const sk=[
    ["🎧","Аудирование",cov*acc("listen"),acc("listen")],
    ["🧩","Грамматика",ls*acc("gram"),acc("gram")],
    ["📖","Чтение",(cov*.6+kjc*.4)*Math.max(.3,acc("read")),acc("read")],
    ["✍️","Письмо",cov*acc("write"),acc("write")],
    ["🗣","Произношение",cov*acc("pron"),acc("pron")],
    ["🧠","Словарный запас",lw,acc("vocab")]];
  return sk;
}

/* =================================================================
   ГОЛОС ВНУТРИ CLAUDE: озвучка Claude (tts) + диктовка Claude (dictation)
   На github.io всё работает как раньше — через браузер.
   ================================================================= */
let C_TTS=null, C_DIC=null, C_MODE=false;
const C_SLEEP=ms=>new Promise(r=>setTimeout(r,ms));
async function cSpeak(text,lang,rate){
  let txt=ttsClean(text); if(lang!=="ja"&&/[а-я]/i.test(txt)) txt=txt.replace(/\b[a-z][a-z:']*\b/gi,"").replace(/\s*·\s*/g," ").replace(/\s{2,}/g," ").trim();
  if(!txt) return;
  if(C_DIC&&C_DIC.active()) { try{ await C_DIC.stop(); }catch(e){} }
  setTalk(true);
  try{ await Promise.race([C_TTS.speak(txt.slice(0,1990),{voice:S.cVoice||"airy",language:lang==="ja"?"ja":"ru",rate:Math.min(1.5,Math.max(.7,rate||(lang==="ja"?.85:1.1)))}),C_SLEEP(4000+txt.length*260)]); }
  catch(e){ if(e&&e.code==="rate_limited") await C_SLEEP(400); if(e&&e.code==="not_granted") C_TTS=null; }
  finally{ setTalk(false); }
}
const _speakP0=speakP, _sayQ0=sayQ, _say0=say, _hfStop0=hfStop;
/* мгновенный голос браузера, если он работает внутри Claude; голос Claude — запасной (он с задержкой) */
let C_BR=false;
const cUseClaude=()=>C_TTS&&!(C_BR&&S.cVoiceMode!=="claude");
function cProbe(){ return new Promise(res=>{ try{ if(!window.speechSynthesis) return res(false); const u=new SpeechSynthesisUtterance("а"); u.lang="ru-RU"; u.volume=0; let ok=false; u.onstart=()=>{ ok=true; res(true); }; u.onend=()=>{ if(!ok){ ok=true; res(true); } }; u.onerror=()=>res(false); speechSynthesis.speak(u); setTimeout(()=>{ if(!ok) { try{speechSynthesis.cancel()}catch(e){} res(false); } },1500); }catch(e){ res(false); } }); }
async function cSpeakBr(text,lang,rate,pitch){ if(C_DIC&&C_DIC.active()&&!(window.AP&&AP.on)) { try{ await C_DIC.stop(); }catch(e){} } return _speakP0(text,lang,rate,pitch); }
speakP=function(text,lang,rate,pitch){ return !C_MODE?_speakP0(text,lang,rate,pitch):cUseClaude()?cSpeak(text,lang,rate):cSpeakBr(text,lang,rate,pitch); };
sayQ=function(text,lang){ if(C_MODE&&cUseClaude()){ cSpeak(text,lang); return; } _sayQ0(text,lang); };
say=function(text,lang="ja"){ if(C_MODE&&cUseClaude()){ cSpeak(text,lang); return; } _say0(text,lang); };
hfStop=function(){ _hfStop0(); if(C_TTS) C_TTS.stop().catch(()=>{}); if(C_DIC&&C_DIC.active()) C_DIC.stop().catch(()=>{}); };
const _nVoiceOn0=nVoiceOn; const _voicePrime0=voicePrime; voicePrime=function(){ if(!C_MODE) _voicePrime0(); };

function nCyrSyl(jp){ const s=toHira(kanaOf(String(jp))).replace(/[、。？！…]/g,"").split(" ").map(t=>t.length>1?t.replace(/は$/,"わ").replace(/へ$/,"え"):t).join(" ").replace(/を/g,"お"); const out=[]; let dbl=false;
  for(let i=0;i<s.length;i++){ const c=s[i];
    if(c===" "){ out.push(" "); continue; }
    if(c==="っ"){ dbl=true; continue; }
    if(c==="ー"){ if(out.length) out[out.length-1]+="-"; continue; }
    let m=c; if(i+1<s.length&&/[ゃゅょぁぃぅぇぉ]/.test(s[i+1])&&BYK[c+s[i+1]]){ m=c+s[i+1]; i++; }
    let r=kanaRu(m)||kanaRu(c)||c; if(dbl&&r){ r=r[0]+r; dbl=false; } out.push(r); }
  // склеиваем как слышится: сай, то:, хон, мас
  const V=/[аэиоуяеёюы]$/; const res=[];
  for(const x of out){ const p=res.length?res[res.length-1]:null;
    if(x===" "||!p||p===" "){ res.push(x); continue; }
    if(x==="и"&&/[ао]$/.test(p)){ res[res.length-1]=p+"й"; continue; }
    if(x==="у"&&/[оё]$/.test(p)){ res[res.length-1]=p+"-"; continue; }
    if(x==="и"&&/[эе]$/.test(p)){ res[res.length-1]=p+"-"; continue; }
    if(x==="н"){ res[res.length-1]=p+"н"; continue; }
    res.push(x); }
  return res.join("·").replace(/·? ·?/g,"  ").replace(/(ма|дэ)·су(?=\s|$)/g,"$1с").replace(/-/g,"\u02D0").replace(/^·|·$/g,""); }
