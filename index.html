{ const _vt=vTitle; vTitle=function(){ const s=NV.step; return (AP.on?"🚗 ":"")+((s.k==="errv"||s.k==="apr")?s.l.t:_vt()); }; }
{ const _va=vAsk; vAsk=async function(task,alive){ const r=await _va(task,alive); if(AP.on&&r&&!r.back){ const id=task.it?task.it.id:task.tk?task.tk.id:null; if(id){ if(!r.ok) AP.fail.add(id); AP.seen.add(id); } } return r; }; }
{ const _vr=vReview; vReview=function(){ if(!AP.on) return _vr(); return apReview(); }; }
const AP_NEXT=/дальше|далее|засчит|правильно|нормально|норм\b|идём|идем|пошли|погнали|next|つぎ|次|だーりしぇ|だりしぇ|ダーリシェ|ダリシェ/i;
const AP_AGAIN=/заново|занова|ещ[её] раз|повтор|снова|again|もう一度|もういちど|ざのう?ば|ザノーヴァ|ザノバ/i;
async function apReview(){
  const list=[...NV.errs.values()]; const ids=new Set(list.map(e=>e.task.id));
  const jp=t=>t.t==="reply"?t.tk.ans[0]:t.it.jp, ru=t=>t.t==="reply"?t.tk.hint:t.it.ru;
  let res=null; const done=v=>{ if(!res){ res=v; try{speechSynthesis.cancel()}catch(e){} try{stopListen()}catch(e){} } };
  app.innerHTML=`<section class="screen nrev">
    <div class="stage small bg-${NV.bg}">${sceneDeco(NV.bg)}<div class="speech"><span class="akru">Я засчитала ошибки: ${list.length}. Ты реально ошибся — или я не расслышала?</span></div><div class="girlwrap">${girlSVG("pout")}</div></div>
    <div class="rvlist">${list.map(e=>`<div class="rvi"><span class="tx"><span class="jfont">${rb(jp(e.task))}</span><small>${esc(ru(e.task))}</small>${e.heard?`<small class="hd">услышала: «${esc(e.heard)}»</small>`:""}</span></div>`).join("")}</div>
    <button class="big" id="apNx" ${pinkBtn}>▶ Я СКАЗАЛ ПРАВИЛЬНО — ИДЁМ ДАЛЬШЕ</button>
    <button class="big" id="apAg">🔁 ДА, ОШИБСЯ — ЗАНОВО</button>
    <div class="note">Голосом: скажи <b>«дальше»</b>. Молчишь 20 секунд — урок засчитан. Заново — только если сам нажмёшь кнопку.</div></section>`;
  document.getElementById("apNx").onclick=()=>done("next"); document.getElementById("apAg").onclick=()=>done("again");
  const lines=list.slice(0,6).map(e=>`${ru(e.task)}`).join(". ");
  await speakP(`Я засчитала ошибок: ${list.length}. ${lines}. Если это я не расслышала — скажи «дальше» или просто молчи, через двадцать секунд засчитаю. Если реально ошибся — жми кнопку внизу.`,"ru");
  const t00=Date.now();
  while(!res&&AP.on&&NV&&!NV.dead){
    let alts=[];
    if(!C_MODE){ const h=await listen("ru",12000,()=>!res&&AP.on); alts=(h&&h.alts)||[]; if(!alts.length) await sleep(300); }
    else { NV.listening="ru"; CD.text=null; const t0=Date.now(); while(!res&&CD.text==null&&Date.now()-t0<12000) await sleep(150); NV.listening=null; if(CD.text){ alts=[CD.text]; CD.text=null; } }
    if(res) break;
    const s=alts.join(" ");
    if(AP_NEXT.test(s)) done("next");
    if(Date.now()-t00>20000) done("next");
  }
  if(!res) res="next";
  const n=NS();
  if(res==="next"){ ids.forEach(id=>{ const k=id.replace(/#m$/,""); if(n.errc&&n.errc[k]){ n.errc[k]--; if(n.errc[k]<3&&n.ew) delete n.ew[k]; if(n.errc[k]<=0) delete n.errc[k]; } AP.fail.delete(k); }); save();
    await speakP(pick(["Ладно, верю. Засчитала.","Окей, значит я глухая. Дальше.","Хорошо, засчитано."]),"ru"); return new Set(); }
  await speakP(pick(["Заново эти. Погнали.","Окей, гоню ошибки ещё раз."]),"ru"); return ids; }
{ const _ve=vEnd; vEnd=function(info){ if(!AP.on) return _ve(info); const st=info.step, n=NS();
    if(st.k==="voice"){ const d=n.done[st.l.id]||(n.done[st.l.id]={}); if(!d.tap) d.tap=Date.now(); }
    if(st.k==="errv"){ (st.ids||[]).forEach(id=>{ if(!AP.fail.has(id)){ delete (n.ew||{})[id]; delete (n.errc||{})[id]; } }); if(!errPool().n) n.les3=0; else n.les3=0; n.errDone=(n.errDone||0)+1; }
    save(); AP.fail=new Set(); apNext(info); }; }
{ const _h=home; home=function(){ if(AP.on&&!AP.inNext){ apStop(); } _h(); }; }
function apStop(){ AP.on=false; const o=document.getElementById("apLost"); if(o) o.remove(); try{ if(C_DIC&&C_DIC.active()) C_DIC.stop().catch(()=>{}); }catch(e){} wakeOff(); }
async function apNext(prev){
  if(!AP.on) return;
  const s=apStepNext();
  if(!s){ apStop(); await speakP("Всё. Курс пройден голосом. Остался экзамен — его глазами.","ru"); return home(); }
  const lbl=s.k==="voice"?`${s.l.gram?"Урок частицы: ":"Урок: "}${s.l.t}`:s.k==="call"?`Созвон по главе «${s.c.t}». Вся глава голосом.`:s.k==="errv"?"Стоп. Сначала работа над ошибками.":"Сначала быстрый повтор старого.";
  app.innerHTML=`<section class="screen live-screen nv"><div class="stage bg-${s.c.bg}">${sceneDeco(s.c.bg)}<div class="callbadge">🚗 Автопилот</div><div class="speech"><span class="akru">${esc(lbl)}</span></div><div class="girlwrap">${girlSVG("happy")}</div></div><div class="vbtns"><button class="mini" id="apStop">⏹ Остановить автопилот</button></div></section>`;
  document.getElementById("apStop").onclick=()=>{ apStop(); home(); };
  const pre=prev?(prev.err?pick(["Готово. Дальше.","Закрыли. Едем дальше.","Сделано, хоть и с косяками. Дальше."]):pick(["Чисто. Дальше.","Красава. Следующее.","Готово. Погнали дальше."]))+" ":"";
  await speakP(pre+lbl,"ru"); if(!AP.on) return;
  AP.fail=new Set(); vStart(s);
}
function apStart(){
  AP.on=true; AP.revDone=false; AP.fail=new Set();
  if(C_MODE&&C_DIC){ CD.buf=""; CD.text=null; apDicStart(); }
  else { S.voice=true; voicePrime(); }
  NS().showTxt=NS().showTxt; save(); wakeOn();
  apNext(null);
}
/* «стоп» голосом — выйти из автопилота */
{ const _vl=vListen; vListen=async function(lang,alive){ const r=await _vl(lang,alive); if(AP.on&&r&&r.alts&&r.alts.length&&!r.typed){ const s=r.alts.join(" ").toLowerCase(); if(/^(стоп|хватит|пауза|выключи автопилот)|ストップ|すとっぷ|やめて/.test(s)){ apStop(); NV&&(NV.dead=true); NV=null; setTimeout(()=>{ home(); _speakP0("Автопилот выключен.","ru"); },50); return {dead:true}; } } return r; }; }
{ const _h=home; home=function(){ _h(); if(N5_MENU) return; const sb=document.getElementById("statsBtn"); const tb=document.querySelector(".n5home .tbtns"); const at=sb||tb; if(!at||document.getElementById("apBtn")) return;
  const b=document.createElement("button"); b.className="big apbtn"; b.id="apBtn"; b.innerHTML="🚗 АВТОПИЛОТ<small>без рук и без глаз — она сама ведёт, ты только говоришь</small>"; b.onclick=apStart; at.after(b); }; }

/* «Я уже проходил» — засчитать урок/главу с подтверждением */
function passConfirm(text,yes){ const o=document.createElement("div"); o.className="pconf"; o.innerHTML=`<div class="pcbox"><b>${esc(text)}</b><div class="pcbtns"><button class="big" id="pcY" ${pinkBtn}>ДА, ЗАСЧИТАТЬ</button><button class="ghost" id="pcN">НЕТ</button></div></div>`; document.body.appendChild(o);
  o.querySelector("#pcN").onclick=()=>o.remove(); o.querySelector("#pcY").onclick=()=>{ o.remove(); yes(); }; }
function passStep(st){ const n=NS(), now=Date.now(); const markL=l=>{ const d=n.done[l.id]||(n.done[l.id]={}); if(!d.tap) d.tap=now; if(!d.voice) d.voice=now; l.items.forEach(it=>{ if(!n.srs[it.id]) n.srs[it.id]={b:1,d:now+N_INT[1],t:now}; }); };
  if(st.l&&(st.k==="voice"||st.k==="tap")) markL(st.l);
  if(st.k==="call"||st.k==="exam"){ const ch=n.ch[st.c.id]||(n.ch[st.c.id]={}); if(!ch.exam) ch.exam=now; if(st.k==="call"){ ch.call=now; ch.callErr=0; } st.c.L.forEach(markL); }
  n.les3=(n.les3||0)+(st.k==="voice"||st.k==="call"?1:0); save(); }
function passLabel(st){ return st.k==="call"?`Засчитать созвон — вся глава «${st.c.t}» будет пройдена?`:st.k==="exam"?`Засчитать экзамен главы «${st.c.t}»?`:`Вы уверены, что можно засчитать урок «${st.l.t}»?`; }
{ const _r=vRender; vRender=function(){ _r(); if(!NV||!NV.step) return; const st=NV.step; if(!["voice","call"].includes(st.k)) return; const vb=document.querySelector(".nv .vbtns"); if(!vb||document.getElementById("vpass")) return;
  const b=document.createElement("button"); b.className="mini"; b.id="vpass"; b.textContent="✅ Уже проходил"; vb.appendChild(b);
  b.onclick=()=>passConfirm(passLabel(st),()=>{ const ap=AP.on; NV.dead=true; try{speechSynthesis.cancel()}catch(e){} try{stopListen()}catch(e){} hfStop(); VOICE.onInterim=null; NV=null; passStep(st); if(st.k==="voice"&&st.c&&!st.c.kana){} if(ap){ AP.on=true; apNext({err:0}); } else home(); }); }; }
{ const _r=tapRender; tapRender=function(){ _r(); if(!NT||!NT.l&&!NT.c) return; if(!["lesson","exam"].includes(NT.mode)) return; const top=document.querySelector(".nq .top"); if(!top||document.getElementById("tpass")) return;
  const st=NT.mode==="lesson"?{k:"tap",l:NT.l,c:N5C[NT.l.ci]}:{k:"exam",c:NT.c};
  const b=document.createElement("button"); b.className="x tpass"; b.id="tpass"; b.textContent="✅"; b.title="Уже проходил"; top.appendChild(b);
  b.onclick=()=>passConfirm(st.k==="tap"?`Вы уверены, что можно засчитать урок «${st.l.t}»? (засчитаю и руками, и голосом)`:passLabel(st),()=>{ hideSheet(); try{speechSynthesis.cancel()}catch(e){} NT=null; passStep(st); home(); }); }; }

/* меню урока: начать / засчитать / в недоученные / пройти снова */
function lessonMenu(c,l){ const n=NS(), d=n.done[l.id]||{}, done=d.tap&&d.voice;
  const o=document.createElement("div"); o.className="pconf"; o.innerHTML=`<div class="pcbox lmbox"><b>${esc(l.t)}</b><small>${done?"✅ пройден":d.tap?"✋ руками пройден, голосом — нет":d.voice?"🎤 голосом пройден, руками — нет":"не пройден"} · ${l.items.length} ${c.kana?"букв":"слов и фраз"}</small>
    <div class="pcbtns">
      <button class="big" data-a="start" ${pinkBtn}>▶ ${done?"Начать (голосом)":"Начать"}</button>
      <button class="ghost" data-a="pass">✅ Засчитать</button>
      <button class="ghost" data-a="redo">🔁 Пройти снова (с нуля)</button>
      <button class="ghost" data-a="unl">↩ Кинуть в недоученные</button>
      <button class="ghost" data-a="x">Закрыть</button></div></div>`;
  document.body.appendChild(o);
  o.onclick=e=>{ if(e.target===o) o.remove(); };
  o.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{ const a=b.dataset.a; o.remove();
    if(a==="start"){ nRunStep({k:d.tap&&!d.voice?"voice":(!d.tap?"tap":"voice"),c,l}); }
    else if(a==="redo"){ nRunStep({k:"tap",c,l}); }
    else if(a==="pass"){ passConfirm(`Вы уверены, что можно засчитать урок «${l.t}»?`,()=>{ passStep({k:"tap",c,l}); home(); }); }
    else if(a==="unl"){ passConfirm(`Кинуть «${l.t}» в недоученные? Отметки «пройден» снимутся, а все слова урока встанут в повтор прямо сейчас.`,()=>{ const now=Date.now(); delete n.done[l.id]; l.items.forEach(it=>{ n.srs[it.id]={b:0,d:now,t:(n.srs[it.id]||{}).t||now}; }); save(); home(); }); }
  }); }
document.addEventListener("click",e=>{ const t=e.target.closest&&e.target.closest("[data-lm]"); if(!t) return; const [ci,li]=t.dataset.lm.split(":").map(Number); const c=N5C[ci]; if(c&&c.L[li]) lessonMenu(c,c.L[li]); });

/* ===== карточка-превью другого уровня ===== */
function lvStats(l){
  if(l==="n5"){ const ch=LV_SUM.n5; return {ch:ch.map(c=>({t:c.t,d:c.d,n:c.n,w:c.w})),g:LV_SUM.n5g,k:LV_SUM.n5k}; }
  const D=l==="n4"?N4_DATA:N3_DATA; const gby={}; D.grams.forEach(g=>gby[g.ch]=(gby[g.ch]||0)+1);
  return {ch:D.chapters.map(c=>({t:c.t,d:c.d,n:c.L.length+(gby[c.id]||0),w:c.L.reduce((a,x)=>a+x.it.length,0)+D.grams.filter(g=>g.ch===c.id).reduce((a,g)=>a+g.it.length,0),gr:gby[c.id]||0})),g:D.grams.length,k:D.kanji.split("\n").length,
    gl:D.grams.map(g=>g.t)};
}
function lvPreview(l){ const s=lvStats(l), L=l.toUpperCase(); const les=s.ch.reduce((a,c)=>a+c.n,0), w=s.ch.reduce((a,c)=>a+c.w,0); const st=S[l]||{}, done=Object.keys(st.srs||{}).length;
  return `<details class="chc lvprev"><summary class="chh"><span class="chn">${L}</span><span class="cht"><b>Уровень ${L}</b><small>${s.ch.length} глав · ${les} уроков · ${w} слов и фраз · ${s.g} уроков грамматики · ${s.k} кандзи${done?` · выучено ${done}`:""}</small></span><span class="chp">▾</span></summary>
    <div class="lvpbody">${s.ch.map((c,i)=>`<div class="lvprow"><b>${i+1}. ${esc(c.t)}</b><small>${esc(c.d||"")} — ${c.n} уроков, ${c.w} слов${c.gr?`, грамматика: ${c.gr}`:""}</small></div>`).join("")}
    ${s.gl?`<details class="lvpg"><summary>Вся грамматика ${L} (${s.g})</summary><div>${s.gl.map(t=>`<div>📐 ${esc(t)}</div>`).join("")}</div></details>`:""}
    <button class="big" data-lvl="${l}" ${pinkBtn}>Перейти на ${L}</button><small class="lvpnote">Прогресс каждого уровня хранится отдельно — вернуться можно в любой момент.</small></div></details>`; }

/* ===== переключение уровня ===== */
function lvSwitch(l){ if(l===LVL) return; S.lvl=l; S._ts=Date.now(); save();
  const go=()=>{ try{ const u=new URL(location.href); u.searchParams.delete("lvl"); history.replaceState(null,"",u.toString()); }catch(e){} try{ location.reload(); }catch(e){}
    setTimeout(()=>{ const o=document.createElement("div"); o.className="pconf"; o.innerHTML=`<div class="pcbox"><b>Уровень ${l.toUpperCase()} выбран</b><small style="display:block;margin-top:8px">Если экран не обновился сам — закрой «Кану» и открой заново. Откроется ${l.toUpperCase()}.</small></div>`; document.body.appendChild(o); },1500); };
  try{ if(typeof CLOUD!=="undefined"&&CLOUD.db){ CLOUD.dirty=true; Promise.resolve(cloudPush()).then(()=>CLOUD.chain).then(go,go); return; } }catch(e){}
  go(); }
document.addEventListener("click",e=>{ const b=e.target.closest&&e.target.closest("[data-lvl]"); if(!b) return; const l=b.dataset.lvl;
  passConfirm(`Перейти на ${l.toUpperCase()}? Прогресс ${LVLN} никуда не денется — вернуться можно в любой момент.`,()=>lvSwitch(l)); });
/* подписи «N5» в интерфейсе → текущий уровень */
if(LVL!=="n5"){ const fix=root=>{ const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT); let t; while((t=w.nextNode())){ if(/N5/.test(t.nodeValue)&&!(t.parentElement&&t.parentElement.closest(".lvkeep"))) t.nodeValue=t.nodeValue.replace(/N5/g,LVLN); } };
  new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(nd=>{ if(nd.nodeType===1) fix(nd); else if(nd.nodeType===3&&/N5/.test(nd.nodeValue)&&!(nd.parentElement&&nd.parentElement.closest(".lvkeep"))) nd.nodeValue=nd.nodeValue.replace(/N5/g,LVLN); }))).observe(document.body,{childList:true,subtree:true});
  fix(document.body);
  const _sp2=speakP; speakP=function(t,l,r,p){ return _sp2(typeof t==="string"?t.replace(/N5/g,LVLN):t,l,r,p); }; }

/* сердечки в работе над ошибками */
function heartsHTML(n){ return [0,1].map(i=>`<span class="hrt ${i<n?"":"off"}">${i<n?"❤️":"🖤"}</span>`).join(""); }
function errFailFlash(){ hideSheet(); try{speechSynthesis.cancel()}catch(e){}
  app.innerHTML=`<section class="screen res"><div class="stage small bg-scold">${sceneDeco("scold")}<div class="girlwrap">${girlSVG("angry")}</div></div><h2>💔 СЕРДЕЧКИ ВСЁ</h2><p>Две ошибки — начинаем с самого начала. Заново, сука.</p></section>`;
  speakP(S.noMat?"Две ошибки. Начинаем заново.":"Две ошибки. Всё, заново, с самого начала.","ru"); NT=null; setTimeout(()=>errStart(),1800); }
{ const _r=tapRender; tapRender=function(){ _r(); if(!NT||NT.mode!=="errors") return; const top=document.querySelector(".nq .top"); if(!top||top.querySelector(".hearts")) return;
  const s=document.createElement("span"); s.className="hearts"; s.innerHTML=heartsHTML(NT.hearts==null?2:NT.hearts); top.appendChild(s); }; }

if(!NS().init){ NS().init=1; if(SR) S.voice=true; save(); }
{ const n=NS(); N5C.filter(c=>(n.ch[c.id]||{}).skipped).forEach(c=>{ const ch=n.ch[c.id]; if(ch.call&&ch.call===ch.skipped){ delete ch.call; delete ch.exam; c.L.forEach(l=>{ const d=n.done[l.id]; if(d&&d.tap===ch.skipped) delete d.tap; if(d&&d.voice===ch.skipped) delete d.voice; l.items.forEach(it=>{ delete n.srs[it.id]; }); }); } }); save(); }

home();
