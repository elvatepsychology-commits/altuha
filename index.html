async function akRun(resume){
  const my=++HF.token, alive=()=>HF.token===my;
  const eyes=true, full=AK.mode==="full", bg=AK.mode==="bg";
  const r=resume||AK.resume; AK.resume=r;
  const talk=async(ru,mood)=>{ if(mood)AK.mood=mood; AK.view={kind:"talk",ru}; akRender(); await speakP(ru,"ru"); return alive(); };
  const pauseFor=async(n,view)=>{ AK.skip=false; for(let t=n;t>0;t--){ if(AK.skip)break; AK.view=Object.assign({},view,{sec:t,total:n,skippable:full}); akRender(); await sleep(1000); if(!alive())return false; } AK.view=Object.assign({},view); return true; };
  const setLabel=p=>{ AK.cur={ci:p.ci}; AK.lbl=(AK.review||p.ci!==AK.ch||!AK.items.includes(p))?"Повтор · "+COURSE[p.ci].t:null; };

  const voiceOn=()=>S.voice&&SR&&!VOICE.denied;
  /* «повтори» с микрофоном: ждём, пока реально скажешь, проверяем похожесть */
  async function echo(target,view,anySpeech,fallbackSec){
    if(!voiceOn()) return pauseFor(fallbackSec,view);
    for(let tries=0;tries<3;tries++){
      AK.view=Object.assign({},view,{skippable:true}); AK.listening="rep"; AK.heardTxt=""; akRender();
      VOICE.onInterim=tx=>{ AK.heardTxt=tx; const el=document.getElementById("micTxt"); if(el) el.textContent=tx||"слушаю…"; };
      AK.skip=false;
      const h=await listenUntil("ja",()=>alive()&&!AK.skip);
      AK.listening=null; VOICE.onInterim=null;
      if(!alive())return false;
      if(AK.skip||h.cancel||VOICE.denied) { AK.view=Object.assign({},view); akRender(); return true; }
      const alts=(h.alts||[]).filter(Boolean);
      const cmd=voiceCmd(alts);
      if(cmd==="forgot"){ return true; }
      if(cmd!=="repeat"&&(anySpeech||jaOk(alts,target,true))){ AK.view=Object.assign({},view,{heard:alts[0]}); akRender(); await speakP(pick(["Норм.","Похоже.","Да.","Красиво.","Ага."]),"ru"); return alive(); }
      if(cmd!=="repeat"){ AK.view=Object.assign({},view,{heard:alts[0]}); akRender(); await speakP(pick(["Не похоже. Слушай ещё раз.","Неа, не то. Ещё раз.","Ты что-то своё сказал. Слушай."]),"ru"); if(!alive())return false; }
      await speakP(target,"ja",.65); if(!alive())return false;
    }
    await speakP("Ладно, потом дожмём.","ru"); return alive();
  }
  async function intro(task){
    const p=task.p; setLabel(p);
    const story=S.akShort?(/[.!?…)]$/.test(p[1])?p[1]:p[1]+"."):p[2];
    if(!await talk((task.n?`${p.kind==="w"?"Слово":"Фраза"} ${task.n} из ${task.of}. `:"")+story,task.n%2?"happy":"laugh"))return false;
    AK.view={kind:"teach",p,chunk:p[0]}; AK.mood="happy"; akRender();
    await speakP(p[0],"ja",.7); if(!alive())return false;
    const ch=p.kind==="g"?[]:chunksOf(p[0]);
    if(ch.length){
      if(!S.akShort){ AK.view={kind:"teach",p,chunk:p[0],note:"по кусочкам"}; akRender(); await speakP("Длинная. Разберём по кусочкам.","ru"); if(!alive())return false; }
      for(let k=0;k<ch.length;k++){
        AK.view={kind:"teach",p,chunk:ch[k],note:`кусочек ${k+1}`}; akRender();
        await speakP(ch[k],"ja",.65); if(!alive())return false;
        if(k===0){ await speakP("Повтори.","ru"); if(!alive())return false; }
        if(!await echo(ch[k],{kind:"repeat",p,chunk:ch[k],cue:"повтори кусочек"},true,Math.max(2,repP())))return false;
      }
      AK.view={kind:"teach",p,chunk:p[0],note:"целиком"}; akRender();
      await speakP("Теперь целиком.","ru"); if(!alive())return false;
      await speakP(p[0],"ja",.75); if(!alive())return false;
    }
    const cue=S.akShort?pick(AK_SHORT_REP):pick(AK_REPEAT);
    AK.view={kind:"repeat",p,chunk:p[0],cue}; akRender();
    await speakP(cue,"ru"); if(!alive())return false;
    if(!await echo(p[0],{kind:"repeat",p,chunk:p[0],cue},false,repP()+1))return false;
    AK.view={kind:"teach",p,chunk:p[0],note:"в живом темпе"}; akRender();
    await speakP(S.akShort?"Быстрее.":"И ещё раз, в живом темпе.","ru"); if(!alive())return false;
    await speakP(p[0],"ja",.95); if(!alive())return false;
    if(!await echo(p[0],{kind:"repeat",p,chunk:p[0],cue:"повтори быстро"},false,repP()))return false;
    srsSeen(p[0],true);
    return true;
  }

  async function recall(task){
    const p=task.p; setLabel(p);
    const v={jp:p[0],ru:p[1]};
    const c=COURSE[p.ci], same=(p.kind==="w"?c.W:c.P).map(q=>({jp:q[0],ru:q[1]}));
    const gapQ=p.kind==="g";
    const jr=task.dir==="jr"&&!gapQ;
    const word=p.kind==="w";
    const readCh=!!COURSE[p.ci].read;
    const promptRu=readCh?(jr?"Как читается:":p[3]):jr?(word?"Что значит слово:":"Что значит:"):(S.akShort?"Как будет: "+p[1].replace(/[?!.]+$/,"")+"?":p[3]);
    let promptHtml=jr?`<span class="akru">${esc(promptRu)}</span><span class="jp akjp">${rb(p[0])}</span>`:`<span class="akru">${esc(promptRu)}</span>`;
    let opts=null;
    if(gapQ){ promptHtml=`<span class="akru">${esc(p[3])}</span>${gapHTML(p)}<span class="hint">${esc(p[1])}</span>`; opts=gapOpts(p,full?4:3); }
    else if(eyes){ const n=full?4:3; opts=jr?shuffle([v,...otherV(v,same,n-1,"ru")]).map(o=>({ru:o.ru,ok:o===v})):shuffle([v,...otherV(v,same,n-1,"jp")]).map(o=>({jp:o.jp,ok:o===v})); }
    AK.tap=null; AK.view={kind:"check",p,opts,promptHtml}; akRender();
    if(bg){ chime(); await sleep(700); if(!alive())return false; }
    if(gapQ){ await speakP((S.akShort?"":p[3]+" ")+p[1]+".","ru"); if(!alive())return false; const [ga,gb]=p.gapT.split("＿"); await speakP(ga+"… "+gb,"ja",.8); if(!alive())return false; }
    else { await speakP(promptRu,"ru"); if(!alive())return false;
    if(jr){ await speakP(p[0],"ja",.8); if(!alive())return false; } }
    const T=hfT(AK.mode);
    let vres=null, said="";
    if(S.voice&&SR&&!VOICE.denied&&AK.tap==null){
      const lang=(jr&&!readCh)?"ru":"ja";
      AK.listening=gapQ?"gap":readCh?"read":lang; AK.heardTxt=""; akRender();
      VOICE.onInterim=tx=>{ AK.heardTxt=tx; const el=document.getElementById("micTxt"); if(el) el.textContent=tx||"слушаю…"; };
      AK.showOpts=false;
      const heard=await Promise.race([listenUntil(lang,alive),new Promise(res=>{AK.waitResolve=()=>{cancelListen();res({tapped:true});};})]);
      AK.waitResolve=null; AK.listening=null; VOICE.onInterim=null; AK.showOpts=false;
      if(!alive())return false;
      if(VOICE.denied){ AK.view={kind:"talk",ru:"Микрофон не работает, так что отвечай кнопками. Причину написала сверху."}; akRender(); await speakP("Микрофон не работает, отвечай кнопками.","ru"); if(!alive())return false; AK.view={kind:"check",p,opts,promptHtml}; akRender(); }
      else if(heard.cancel){ vres="forgot"; }
      else if(!heard.tapped){
        const alts=(heard.alts||[]).filter(Boolean); said=alts[0]||"";
        if(alts.length){
          if(gapQ?gapVoiceOk(alts,p):(jr&&!readCh)?ruOk(alts,p[1]):jaOk(alts,p[0],false,/\d/.test(p[1]))) vres="right";
          else { const cmd=voiceCmd(alts); vres=cmd||"wrong"; if(vres==="wrong"&&alts.some(x=>RUDE.test(x))) AK.rude=true; }
        }
      }
      if(vres==="repeat"){ await talk(pick(VOICE_REPEAT),"calm"); if(!alive())return false; return recall(task); }
      if(vres==="back"){ await talk(pick(VOICE_BACK),"calm"); if(!alive())return false; return "back"; }
    }
    if(!vres&&AK.tap==null){
      if(full){ await akWait(); if(!alive())return false; }
      else if(!(S.voice&&SR&&!VOICE.denied)){
        if(bg&&Math.random()<.3){ await speakP(pick(AK_RECALL_CUE),"ru"); if(!alive())return false; }
        for(let t=T;t>0;t--){ if(AK.tap!=null)break; AK.view={kind:"check",p,opts,promptHtml,sec:t,total:T}; akRender(); tick(false); await sleep(1000); if(!alive())return false; }
        tick(true);
      }
    }
    const tapped=vres?(vres==="right"||vres==="wrong"):AK.tap!=null;
    const right=vres?vres==="right":(tapped&&opts[AK.tap].ok);
    const talkSaid=vres&&vres!=="forgot"?said:"";
    const revealHtml=gapQ?`<span class="akru">Правильно:</span>${gapHTML(p,p.ans,"ok")}<span class="hint">${esc(p[1])}</span><span class="hint">${esc(p[2])}</span>`:promptHtml;
    const sayAnswer=async(withRepeat)=>{
      AK.view={kind:"reveal",p,opts,promptHtml:revealHtml}; akRender();
      if(gapQ){ await speakP(p[0],"ja",.8); if(!alive())return false; if(!S.akShort){ await speakP(p[2],"ru"); if(!alive())return false; }
        if(withRepeat){ await speakP("Повтори целиком.","ru"); if(!alive())return false; if(!await echo(p[0],{kind:"reveal",p,opts,promptHtml:revealHtml},false,Math.max(2,repP())))return false; }
        return true; }
      if(jr){ await speakP("Это: "+p[1],"ru"); if(!alive())return false; if(bg){ await speakP(p[0],"ja",.85); if(!alive())return false; } }
      else{
        await speakP(p[0],"ja",.8); if(!alive())return false;
        if(bg){ await sleep(400); await speakP(p[0],"ja",.95); if(!alive())return false; }
        if(withRepeat){ await speakP(S.akShort?"Повтори.":pick(["Повтори.","Скажи вслух.","Повторяй."]),"ru"); if(!alive())return false;
          if(!await echo(p[0],{kind:"reveal",p,opts,promptHtml},false,Math.max(2,repP())))return false; }
      }
      return true;
    };
    if(vres==="forgot"){
      AK.mood="pout"; AK.view={kind:"react",ru:pick(VOICE_FORGOT),opts}; akRender();
      await speakP(AK.view.ru,"ru"); if(!alive())return false;
      if(!await sayAnswer(true))return false;
      if(task.grade||AK.review) srsGrade(p[0],0);
      const key=srsKey(p[0])+task.dir;
      if((r.requeued[key]||0)<2){ r.requeued[key]=(r.requeued[key]||0)+1; AK.plan.splice(r.i+3,0,{t:"recall",p,dir:"rj",fresh:true}); }
    } else if(tapped&&!right){
      AK.bad++; AK.mood=AK.bad>=3?"angry":"pout";
      const ins=AK.rude?pick(RUDE_BACK):pick(HER_RU[Math.min(1,Math.floor((AK.bad-1)/2))]); AK.rude=false;
      AK.view={kind:"react",ru:ins,bad:true,opts,said:talkSaid}; akRender(); beep(false); buzz();
      await speakP(ins,"ru"); if(!alive())return false;
      await speakP("Правильно:","ru"); if(!alive())return false;
      if(!await sayAnswer(true))return false;
      if(task.grade||AK.review) srsGrade(p[0],0);
      const key=srsKey(p[0])+task.dir;
      if((r.requeued[key]||0)<2){ r.requeued[key]=(r.requeued[key]||0)+1; AK.plan.splice(r.i+3,0,{t:"recall",p,dir:"rj",fresh:true}); }
      if(full){ AK.view={kind:"react",ru:"Запомнил? Я скоро ещё раз спрошу.",opts,wait:true}; akRender(); await akWait(); if(!alive())return false; }
    } else if(right){
      AK.good++; AK.mood=pick(["blush","laugh","happy"]);
      const pr=Math.random()<.3?pick(AK_PRAISE):pick(AK_RIGHT_SHORT);
      AK.view={kind:"react",ru:pr,opts,said:talkSaid}; akRender(); beep(true);
      await speakP(pr,"ru"); if(!alive())return false;
      AK.view={kind:"reveal",p,opts,promptHtml:revealHtml}; akRender();
      await speakP(jr?p[1]:p[0],jr?"ru":"ja",.85); if(!alive())return false;
      if(task.grade||AK.review) srsGrade(p[0],2);
    } else {
      await speakP("Ответ.","ru"); if(!alive())return false;
      if(!await sayAnswer(!jr))return false;
      if(task.grade||AK.review) srsGrade(p[0],1);
    }
    AK.reviewed++;
    await sleep(250);
    return alive();
  }

  while(r.i<AK.plan.length){
    const task=AK.plan[r.i];
    AK.prog=Math.min(.98,r.i/AK.plan.length);
    if(task.t==="hello"){
      const been=!AK.review&&(()=>{const s=chStats(AK.ch);return s.w.l+s.p.l>0;})();
      const hello=S.akShort?pick(AK_SHORT_HELLO):!AK.review&&!been?pick(AK_HELLO):S.acad.lastBad>=3?pick(AK_HELLO_BAD):S.acad.lastGood?pick(AK_HELLO_GOOD):pick(AK_HELLO);
      if(!await talk(hello,"happy"))return;
    }
    else if(task.t==="rule"){ const c=COURSE[AK.ch]; AK.view={kind:"talk",ru:c.rule}; AK.mood="laugh"; akRender(); await speakP(c.rule,"ru"); if(!alive())return; S.ruleHeard=S.ruleHeard||{}; S.ruleHeard[AK.ch]=Date.now(); save(); }
    else if(task.t==="preview"){
      const L=AK.items, names=L.slice(0,6).map(p=>p[1].replace(/[?!.]+$/,"").replace(/\s*\(.*\)/,"")).join(", ");
      if(!await talk((L.length<=6?"Сегодня выучишь: "+names+".":`Сегодня ${L.length} новых. Начнём с: ${names}.`)+" Не страшно, я помогу.","blush"))return;
    }
    else if(task.t==="say"){ if(!await talk(task.ru,"calm"))return; }
    else if(task.t==="intro"){ if(!await intro(task))return; }
    else if(task.t==="recall"){ const x=await recall(task); if(x===false)return; if(x==="back"){ let j=r.i-1; while(j>0&&!["intro","recall"].includes(AK.plan[j].t)) j--; r.i=Math.max(0,j); continue; } }
    else if(task.t==="final"){
      const used=new Set(); let k=task.k||0;
      while(k<task.limit){
        const p=srsPick(1,used,task.chapters)[0]; if(!p) break;
        used.add(srsKey(p[0]));
        task.k=++k;
        const x=await recall({t:"recall",p,dir:k%4===0?"jr":"rj",grade:true}); if(x===false)return;
        AK.prog=Math.min(.98,k/task.limit);
      }
    }
    else if(task.t==="end"){
      AK.prog=1;
      S.acad.lastBad=AK.bad; S.acad.lastGood=AK.bad===0&&AK.good>0; S.xp+=AK.reviewed*3; markDay(); save();
      const end=S.akShort?pick(AK_SHORT_END):AK.bad>=3?pick(AK_END_BAD):pick(AK_END_GOOD);
      AK.mood=AK.bad>=3?"pout":"blush";
      if(!await talk(end))return;
      wakeOff(); r.i++; return AK.review?akReviewEnd():akEnd();
    }
    r.i++;
  }
}

function akReviewEnd(){

function examPool(chs){ const set=new Set(chs); const seen=new Set(); return ALLI.filter(t=>set.has(t.ci)&&!seen.has(srsKey(t[0]))&&seen.add(srsKey(t[0]))); }
function akExamStart(chs,lv,final){
  const L=(final?EXAM_FINAL:EXAM_LV)[lv];
  const pool=examPool(chs);
  const qs=[]; let bag=[];
  while(qs.length<L.n){ if(!bag.length) bag=shuffle(pool.slice()); const p=bag.pop();
    const canBuild=p.kind==="p"&&p[0].split(" ").length>=2;
    const r=Math.random(); const type=p.kind==="g"?"g":canBuild&&r<(lv==="easy"?.15:lv==="mid"?.25:.35)?"c":r<.6?"a":"b";
    qs.push({p,type}); }
  AK.ch=chs[0]; AK.lbl=null; AK.cur=null; AK.review=false; AK.bad=0; AK.good=0; AK.mood="happy"; AK.paused=false;
  const lives=final?5:3;
  AK.exam={lv,lives,max:lives,i:0,n:L.n,o:L.o,qs,streak:0,maxStreak:0,final,chs,t0:Date.now()};
  AK.view={kind:"talk",ru:""};

}

/* транслитерация каны в кириллицу (по Поливанову) — показываем только когда ошибся */
function kanaCyr(jp){
  const s=kanaOf(jp).replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
  let out="", i=0, gem=false;
  while(i<s.length){
    const two=s.slice(i,i+2), one=s[i];
    let it=BYK[two]||BYK[one], used=BYK[two]?2:1;
    if(one==="っ"){ gem=true; i++; continue; }
    if(one==="ー"){ out+=":"; i++; continue; }
    if(one==="ん"){ out+="н"; i++; continue; }
    if(!it){ out+=one; i++; gem=false; continue; }
    let c=CYR[it.r[0]]||it.r[0];
    if(it.k==="を") c="о"; if(it.k==="は"&&/^\s*$/.test(s[i+1]||" ")&&i>0) c="ва"; if(it.k==="へ"&&/^\s*$/.test(s[i+1]||" ")&&i>0) c="э";
    if(gem){ c=c[0]+c; gem=false; }
    out+=c; i+=used;
  }
  return out;
}

async function listenRun(){
  const my=++HF.token, alive=()=>HF.token===my;
  const list=shuffle(DIALOGS).slice(0,8); let good=0; wakeOn();
  const st={};
  const render=(v)=>{ st.v=v;
    app.innerHTML=`<section class="screen live-screen">
      <div class="top"><button class="x" id="quit" aria-label="Стоп">✕</button><div class="prog"><i style="width:${Math.round(st.i/list.length*100)}%;background:var(--pink)"></i></div><div class="hfmode">🎧 ${st.i+1}/${list.length} · ✓${good}</div></div>
      <div class="stage bg-day">${sceneDeco("day")}<div class="speech"><span class="akru">${esc(v.msg)}</span></div><div class="girlwrap ${v.bad?"shake":""}">${girlSVG(v.mood||"calm")}</div></div>
      ${v.listening?`<div class="micbar"><span class="mdot"></span><span class="mtx"><b>Ответь по-русски <small>· или тыкни</small></b><span id="micTxt">слушаю…</span></span></div>`:""}
      ${v.opts?`<div class="hfopts">${v.opts.map((o,i)=>`<button class="hfo akopt ${v.done?(o.ok?"ok":v.tap===i?"no":"dim2"):""}" data-i="${i}" ${v.done?"disabled":""}><span class="num">${i+1}</span><span class="ru">${esc(o.t)}</span></button>`).join("")}</div>`:""}
      ${v.done?`<div class="note dlg">${st.d.l.map((x,k)=>`<div class="akrow"><span class="jp">${k%2?"🙋‍♀️":"🙋"} ${esc(x)}</span></div>`).join("")}</div><button class="big" id="lnext" ${pinkBtn}>Дальше →</button>`:""}
      ${v.opts&&!v.done?`<button class="ghost" id="lrep">🔊 Ещё раз</button>`:""}
    </section>`;
    document.getElementById("quit").onclick=()=>{ hfStop(); listenScreen(); };
    app.querySelectorAll(".akopt").forEach(b=>b.onclick=()=>{ if(st.v.done) return; st.tap=+b.dataset.i; cancelListen(); st.res&&st.res(); });
    const n=document.getElementById("lnext"); if(n) n.onclick=()=>st.res&&st.res();
    const r=document.getElementById("lrep"); if(r) r.onclick=()=>{ cancelListen(); st.replay=true; st.res&&st.res(); };
  };
  if(!S.akShort){ st.i=0; app.innerHTML=`<section class="screen live-screen"><div class="stage bg-day">${sceneDeco("day")}<div class="speech"><span class="akru">Сейчас я буду болтать быстро, как настоящая японка. Не паникуй: лови знакомые слова, остальное само дойдёт. Поехали.</span></div><div class="girlwrap">${girlSVG("laugh")}</div></div></section>`; await speakP("Сейчас я буду болтать быстро, как настоящая японка. Не паникуй: лови знакомые слова, остальное само дойдёт. Поехали.","ru"); if(!alive()) return; }
  const play=async()=>{ for(let k=0;k<st.d.l.length;k++){ await speakP(st.d.l[k],"ja",S.ls.rate,k%2?1.35:.95); if(!alive()) return false; await sleep(250); } return true; };
  for(st.i=0;st.i<list.length;st.i++){
    st.d=list[st.i]; const d=st.d;
    const opts=shuffle([{t:d.a,ok:true},...d.w.map(x=>({t:x,ok:false}))]);
    render({msg:"🎧 Слушай…",mood:"calm"});
    if(!await play()) return;
    while(true){
      st.tap=null; st.replay=false;
      const voice=S.voice&&SR&&!VOICE.denied;
      render({msg:d.q,opts,listening:voice,mood:"happy"});
      await speakP(d.q,"ru"); if(!alive()) return;
      let heard=null;
      const waitTap=new Promise(r=>{st.res=r;});
      if(voice){
        VOICE.onInterim=tx=>{ const el=document.getElementById("micTxt"); if(el) el.textContent=tx||"слушаю…"; };
        heard=await Promise.race([listenUntil("ru",alive),waitTap.then(()=>null)]); VOICE.onInterim=null;
      } else await waitTap;
      if(!alive()) return;
      if(st.replay){ render({msg:"🎧 Ещё раз…",mood:"calm"}); if(!await play()) return; continue; }
      let ok;
      if(st.tap!=null) ok=opts[st.tap].ok;
      else { const alts=(heard&&heard.alts||[]).filter(Boolean); if(voiceCmd(alts)==="repeat"){ render({msg:"🎧 Ещё раз…",mood:"calm"}); if(!await play()) return; continue; } ok=ruOk(alts,d.a); st.tap=opts.findIndex(o=>o.ok&&ok)>=0?opts.findIndex(o=>o.ok):opts.findIndex(o=>!o.ok); }
      if(ok){ good++; render({msg:pick(RP_RIGHT),opts,done:true,tap:st.tap,mood:"blush"}); beep(true); await speakP(st.v.msg,"ru"); }
      else { render({msg:pick(HER_RU[0])+" Правильно: "+d.a,opts,done:true,tap:st.tap,bad:true,mood:"angry"}); beep(false); buzz(); await speakP(st.v.msg,"ru"); }
      if(!alive()) return;
      await new Promise(r=>{st.res=r;}); if(!alive()) return;
      break;
    }
  }
  wakeOff(); S.ls.best=Math.max(S.ls.best||0,good); S.xp+=good*5; markDay(); save();
  app.innerHTML=`<section class="screen res">
    <div class="stage small bg-day">${sceneDeco("day")}<div class="girlwrap">${girlSVG(good>=7?"blush":good>=5?"happy":"pout")}</div></div>
    <h2>${good===8?"ЕБАТЬ ТЫ МАКТРАХЕР ПРЯМ":good>=6?"СЛЫШИШЬ, КРАСАВА":"НУ Я В АХУЕ С ВАС"}</h2>

    <button class="ghost" id="back">Назад</button>
  </section>`;
  document.getElementById("again").onclick=()=>{ voicePrime(); listenRun(); };
  document.getElementById("back").onclick=listenScreen;
}

      :`<div class="vhow"><b>💻 На компе:</b> лучше всего звучат голоса <b>Google 日本語</b> и <b>Google русский</b> в Chrome, или <b>Microsoft Nanami Online (Natural)</b> в Edge. На Маке ещё можно скачать улучшенные Kyoko/Milena: Настройки → Универсальный доступ → Устный контент → Системный голос → Управлять голосами.</div>`}
