async function akRun(resume){
  const my=++HF.token, alive=()=>HF.token===my;
  const eyes=true, full=AK.mode==="full", bg=AK.mode==="bg";
  const r=resume||AK.resume; AK.resume=r;
  const talk=async(ru,mood)=>{ if(mood)AK.mood=mood; AK.view={kind:"talk",ru}; akRender(); await speakP(ru,"ru"); return alive(); };
  const pauseFor=async(n,view)=>{ AK.skip=false; for(let t=n;t>0;t--){ if(AK.skip)break; AK.view=Object.assign({},view,{sec:t,total:n,skippable:full}); akRender(); await sleep(1000); if(!alive())return false; } AK.view=Object.assign({},view); return true; };
  const setLabel=p=>{ AK.cur={ci:p.ci}; AK.lbl=(AK.review||p.ci!==AK.ch||!AK.items.includes(p))?"Повтор · "+COURSE[p.ci].t:null; };

  async function intro(task){
    const p=task.p; setLabel(p);
    const story=S.akShort?(/[.!?…)]$/.test(p[1])?p[1]:p[1]+"."):p[2];
    if(!await talk((task.n?`${p.kind==="w"?"Слово":"Фраза"} ${task.n} из ${task.of}. `:"")+story,task.n%2?"happy":"laugh"))return false;
    AK.view={kind:"teach",p,chunk:p[0]}; AK.mood="happy"; akRender();
    await speakP(p[0],"ja",.7); if(!alive())return false;
    const ch=chunksOf(p[0]);
    if(ch.length){
      if(!S.akShort){ AK.view={kind:"teach",p,chunk:p[0],note:"по кусочкам"}; akRender(); await speakP("Длинная. Разберём по кусочкам.","ru"); if(!alive())return false; }
      for(let k=0;k<ch.length;k++){
        AK.view={kind:"teach",p,chunk:ch[k],note:`кусочек ${k+1}`}; akRender();
        await speakP(ch[k],"ja",.65); if(!alive())return false;
        if(k===0){ await speakP("Повтори.","ru"); if(!alive())return false; }
        if(!await pauseFor(Math.max(2,repP()),{kind:"repeat",p,chunk:ch[k],cue:"повтори кусочек"}))return false;
      }
      AK.view={kind:"teach",p,chunk:p[0],note:"целиком"}; akRender();
      await speakP("Теперь целиком.","ru"); if(!alive())return false;
      await speakP(p[0],"ja",.75); if(!alive())return false;
    }
    const cue=S.akShort?pick(AK_SHORT_REP):pick(AK_REPEAT);
    AK.view={kind:"repeat",p,chunk:p[0],cue}; akRender();
    await speakP(cue,"ru"); if(!alive())return false;
    if(!await pauseFor(repP()+1,{kind:"repeat",p,chunk:p[0],cue}))return false;
    AK.view={kind:"teach",p,chunk:p[0],note:"в живом темпе"}; akRender();
    await speakP(S.akShort?"Быстрее.":"И ещё раз, в живом темпе.","ru"); if(!alive())return false;
    await speakP(p[0],"ja",.95); if(!alive())return false;
    if(!await pauseFor(repP(),{kind:"repeat",p,chunk:p[0],cue:"повтори быстро"}))return false;
    srsSeen(p[0],true);
    return true;
  }

  async function recall(task){
    const p=task.p; setLabel(p);
    const v={jp:p[0],ru:p[1]};
    const c=COURSE[p.ci], same=(p.kind==="w"?c.W:c.P).map(q=>({jp:q[0],ru:q[1]}));
    const jr=task.dir==="jr";
    const word=p.kind==="w";
    const promptRu=jr?(word?"Что значит слово:":"Что значит:"):(S.akShort?"Как будет: "+p[1].replace(/[?!.]+$/,"")+"?":p[3]);
    const promptHtml=jr?`<span class="akru">${esc(promptRu)}</span><span class="jp akjp">${rb(p[0])}</span>`:`<span class="akru">${esc(promptRu)}</span>`;
    let opts=null;
    if(eyes){ const n=full?4:3; opts=jr?shuffle([v,...otherV(v,same,n-1,"ru")]).map(o=>({ru:o.ru,ok:o===v})):shuffle([v,...otherV(v,same,n-1,"jp")]).map(o=>({jp:o.jp,ok:o===v})); }
    AK.tap=null; AK.view={kind:"check",p,opts,promptHtml}; akRender();
    if(bg){ chime(); await sleep(700); if(!alive())return false; }
    await speakP(promptRu,"ru"); if(!alive())return false;
    if(jr){ await speakP(p[0],"ja",.8); if(!alive())return false; }
    const T=hfT(AK.mode);
    let vres=null, said="";
    if(S.voice&&SR&&!VOICE.denied&&AK.tap==null){
      const lang=jr?"ru":"ja";
      AK.listening=lang; AK.heardTxt=""; akRender();
      VOICE.onInterim=tx=>{ AK.heardTxt=tx; const el=document.getElementById("micTxt"); if(el) el.textContent=tx||"слушаю…"; };
      const ms=(bg?Math.max(T,6):9)*1000;
      const heard=await Promise.race([listen(lang,ms,alive),new Promise(res=>{AK.waitResolve=()=>{stopListen();res({tapped:true});};})]);
      AK.waitResolve=null; AK.listening=null; VOICE.onInterim=null;
      if(!alive())return false;
      if(VOICE.denied){ S.voice=false; save(); AK.view={kind:"talk",ru:"Микрофон закрыт, так что отвечай кнопками."}; akRender(); await speakP("Микрофон закрыт, отвечай кнопками.","ru"); if(!alive())return false; AK.view={kind:"check",p,opts,promptHtml}; akRender(); }
      else if(!heard.tapped){
        const alts=(heard.alts||[]).filter(Boolean); said=alts[0]||"";
        if(alts.length){
          if(jr?ruOk(alts,p[1]):jaOk(alts,p[0])) vres="right";
          else { const cmd=voiceCmd(alts); vres=cmd||"wrong"; }
        }
      }
      if(vres==="repeat"){ await talk(pick(VOICE_REPEAT),"calm"); if(!alive())return false; return recall(task); }
      if(vres==="back"){ await talk(pick(VOICE_BACK),"calm"); if(!alive())return false; return "back"; }
    }
    if(!vres&&AK.tap==null){
      if(full){ await akWait(); if(!alive())return false; }
      else if(!(S.voice&&SR&&!VOICE.denied)){
        if(bg&&Math.random()<.3){ await speakP(pick(AK_RECALL_CUE),"ru"); if(!alive())return false; }
        for(let t=T;t>0;t--){ if(AK.tap!=null)break; AK.view={kind:"check",p,opts,promptHtml,sec:t,total:T}; akRender(); tick(false); await sleep(1000); if(!alive())return false; }
        tick(true);
      }
    }
    const tapped=vres?(vres==="right"||vres==="wrong"):AK.tap!=null;
    const right=vres?vres==="right":(tapped&&opts[AK.tap].ok);
    const talkSaid=vres&&vres!=="forgot"?said:"";
    const sayAnswer=async(withRepeat)=>{
      AK.view={kind:"reveal",p,opts,promptHtml}; akRender();
      if(jr){ await speakP("Это: "+p[1],"ru"); if(!alive())return false; if(bg){ await speakP(p[0],"ja",.85); if(!alive())return false; } }
      else{
        await speakP(p[0],"ja",.8); if(!alive())return false;
        if(bg){ await sleep(400); await speakP(p[0],"ja",.95); if(!alive())return false; }
        if(withRepeat){ await speakP(S.akShort?"Повтори.":pick(["Повтори.","Скажи вслух.","Повторяй."]),"ru"); if(!alive())return false;
          if(!await pauseFor(Math.max(2,repP()),{kind:"reveal",p,opts,promptHtml}))return false; }
      }
      return true;
    };
    if(vres==="forgot"){
      AK.mood="pout"; AK.view={kind:"react",ru:pick(VOICE_FORGOT),opts}; akRender();
      await speakP(AK.view.ru,"ru"); if(!alive())return false;
      if(!await sayAnswer(true))return false;
      if(task.grade||AK.review) srsGrade(p[0],0);
      const key=srsKey(p[0])+task.dir;
      if((r.requeued[key]||0)<2){ r.requeued[key]=(r.requeued[key]||0)+1; AK.plan.splice(r.i+3,0,{t:"recall",p,dir:"rj",fresh:true}); }
    } else if(tapped&&!right){
      AK.bad++; AK.mood=AK.bad>=3?"angry":"pout";
      const ins=pick(HER_RU[Math.min(1,Math.floor((AK.bad-1)/2))]);
      AK.view={kind:"react",ru:ins,bad:true,opts,said:talkSaid}; akRender(); beep(false); buzz();
      await speakP(ins,"ru"); if(!alive())return false;
      await speakP("Правильно:","ru"); if(!alive())return false;
      if(!await sayAnswer(true))return false;
      if(task.grade||AK.review) srsGrade(p[0],0);
      const key=srsKey(p[0])+task.dir;
      if((r.requeued[key]||0)<2){ r.requeued[key]=(r.requeued[key]||0)+1; AK.plan.splice(r.i+3,0,{t:"recall",p,dir:"rj",fresh:true}); }
      if(full){ AK.view={kind:"react",ru:"Запомнил? Я скоро ещё раз спрошу.",opts,wait:true}; akRender(); await akWait(); if(!alive())return false; }
    } else if(right){
      AK.good++; AK.mood=pick(["blush","laugh","happy"]);
      const pr=Math.random()<.3?pick(AK_PRAISE):pick(AK_RIGHT_SHORT);
      AK.view={kind:"react",ru:pr,opts,said:talkSaid}; akRender(); beep(true);
      await speakP(pr,"ru"); if(!alive())return false;
      AK.view={kind:"reveal",p,opts,promptHtml}; akRender();
      await speakP(jr?p[1]:p[0],jr?"ru":"ja",.85); if(!alive())return false;
      if(task.grade||AK.review) srsGrade(p[0],2);
    } else {
      await speakP("Ответ.","ru"); if(!alive())return false;
      if(!await sayAnswer(!jr))return false;
      if(task.grade||AK.review) srsGrade(p[0],1);
    }
    AK.reviewed++;
    await sleep(250);
    return alive();
  }

  while(r.i<AK.plan.length){
    const task=AK.plan[r.i];
    AK.prog=Math.min(.98,r.i/AK.plan.length);
    if(task.t==="hello"){
      const hello=S.akShort?pick(AK_SHORT_HELLO):S.acad.lastBad>=3?pick(AK_HELLO_BAD):S.acad.lastGood?pick(AK_HELLO_GOOD):pick(AK_HELLO);
      if(!await talk(hello,"happy"))return;
    }
    else if(task.t==="preview"){
      const L=AK.items, names=L.slice(0,6).map(p=>p[1].replace(/[?!.]+$/,"").replace(/\s*\(.*\)/,"")).join(", ");
      if(!await talk((L.length<=6?"Сегодня выучишь: "+names+".":`Сегодня ${L.length} новых. Начнём с: ${names}.`)+" Не страшно, я помогу.","blush"))return;
    }
    else if(task.t==="say"){ if(!await talk(task.ru,"calm"))return; }
    else if(task.t==="intro"){ if(!await intro(task))return; }
    else if(task.t==="recall"){ const x=await recall(task); if(x===false)return; if(x==="back"){ let j=r.i-1; while(j>0&&!["intro","recall"].includes(AK.plan[j].t)) j--; r.i=Math.max(0,j); continue; } }
    else if(task.t==="final"){
      const used=new Set(); let k=task.k||0;
      while(k<task.limit){
        const p=srsPick(1,used,task.chapters)[0]; if(!p) break;
        used.add(srsKey(p[0]));
        task.k=++k;
        const x=await recall({t:"recall",p,dir:k%4===0?"jr":"rj",grade:true}); if(x===false)return;
        AK.prog=Math.min(.98,k/task.limit);
      }
    }
    else if(task.t==="end"){
      AK.prog=1;
      S.acad.lastBad=AK.bad; S.acad.lastGood=AK.bad===0&&AK.good>0; S.xp+=AK.reviewed*3; save();
      const end=S.akShort?pick(AK_SHORT_END):AK.bad>=3?pick(AK_END_BAD):pick(AK_END_GOOD);
      AK.mood=AK.bad>=3?"pout":"blush";
      if(!await talk(end))return;
      wakeOff(); r.i++; return AK.review?akReviewEnd():akEnd();
    }
    r.i++;
  }
}
function akEnd(){
  const c=COURSE[AK.ch], s=chStats(AK.ch);
  app.innerHTML=`<section class="screen res">
    <div class="stage small bg-${c.bg}">${sceneDeco(c.bg)}<div class="girlwrap">${girlSVG(AK.mood)}</div></div>
    <h2>${AK.bad===0&&AK.good>0?"ЕБАТЬ ТЫ МАКТРАХЕР ПРЯМ":AK.bad>=3?"НУ Я В АХУЕ С ВАС":"УРОК ПРОЙДЕН"}</h2>
    <p>${esc(AK.title)} · ${AK.items.length} шт.${AK.good+AK.bad?` · тыкнул правильно ${AK.good} из ${AK.good+AK.bad}`:""}</p>
    <div class="note">${AK.items.map(p=>`<div class="akrow"><span class="jp">${rb(p[0])}</span><span>${esc(p[1])}</span></div>`).join("")}</div>
    <div class="stats"><div class="stat"><b>${s.w.l}/${s.w.n}</b><small>слова главы</small></div><div class="stat"><b>${s.p.l}/${s.p.n}</b><small>фразы главы</small></div><div class="stat fire"><b>+${AK.reviewed*3}</b><small>XP</small></div></div>
    <button class="big" id="more" ${pinkBtn}>Выбрать ещё ${AK.kind==="w"?"слова":"фразы"}</button>
    ${AK.kind==="w"&&s.p.l<s.p.n?`<button class="ghost" id="toP">Перейти к фразам главы</button>`:""}
    <button class="ghost" id="toX">📞 Созвон-экзамен по главе</button>
    <button class="ghost" id="menu">К главам</button>
  </section>`;
  document.getElementById("more").onclick=()=>{ AK.sel[AK.ch+AK.kind]=new Set(); chapterScreen(AK.ch,AK.kind); };
  const tp=document.getElementById("toP"); if(tp) tp.onclick=()=>chapterScreen(AK.ch,"p");
  document.getElementById("toX").onclick=()=>chapterScreen(AK.ch,"x");
  document.getElementById("menu").onclick=akMenu;
  window.scrollTo(0,0);
}
function akReviewEnd(){
  const st=srsStats();
  app.innerHTML=`<section class="screen res">
    <div class="stage small bg-whims">${sceneDeco("whims")}<div class="girlwrap">${girlSVG(AK.bad>=3?"pout":"blush")}</div></div>
    <h2>${AK.bad===0&&AK.good>0?"ЕБАТЬ ТЫ МАКТРАХЕР ПРЯМ":AK.bad>=3?"НУ Я В АХУЕ С ВАС":"ПОВТОРЕНИЕ ГОТОВО"}</h2>
    <p>Повторил ${AK.reviewed} раз${AK.good+AK.bad?` · тыкнул правильно ${AK.good} из ${AK.good+AK.bad}`:""}</p>
    <div class="stats"><div class="stat"><b>${st.learned}</b><small>в памяти</small></div><div class="stat"><b>${st.due}</b><small>пора повторить</small></div><div class="stat fire"><b>+${AK.reviewed*3}</b><small>XP</small></div></div>
    <button class="big" id="again" ${pinkBtn}>Ещё повторение</button>
    <button class="ghost" id="menu">К главам</button>
  </section>`;
  document.getElementById("again").onclick=akReviewStart;
  document.getElementById("menu").onclick=akMenu;
  window.scrollTo(0,0);
}

/* =================== СОЗВОН-ЭКЗАМЕН =================== */
function examPool(chs){ const set=new Set(chs); const seen=new Set(); return ALLI.filter(t=>set.has(t.ci)&&!seen.has(srsKey(t[0]))&&seen.add(srsKey(t[0]))); }
function akExamStart(chs,lv,final){
  const L=(final?EXAM_FINAL:EXAM_LV)[lv];
  const pool=examPool(chs);
  const qs=[]; let bag=[];
  while(qs.length<L.n){ if(!bag.length) bag=shuffle(pool.slice()); const p=bag.pop();
    const canBuild=p.kind==="p"&&p[0].split(" ").length>=2;
    const r=Math.random(); const type=canBuild&&r<(lv==="easy"?.15:lv==="mid"?.25:.35)?"c":r<.6?"a":"b";
    qs.push({p,type}); }
  AK.ch=chs[0]; AK.lbl=null; AK.cur=null; AK.review=false; AK.bad=0; AK.good=0; AK.mood="happy"; AK.paused=false;
  const lives=final?5:3;
  AK.exam={lv,lives,max:lives,i:0,n:L.n,o:L.o,qs,streak:0,maxStreak:0,final,chs,t0:Date.now()};
  AK.view={kind:"talk",ru:""};
  akBoot(); akExamRun();
}
async function akExamRun(resume){
  const my=++HF.token, alive=()=>HF.token===my;
  const E=AK.exam;
  const talk=async(ru,mood)=>{ if(mood)AK.mood=mood; AK.view={kind:"talk",ru}; akRender(); await speakP(ru,"ru"); return alive(); };
  const r=resume||{started:false}; AK.resume=r;
  if(!r.started){ if(!await talk(S.akShort?pick(AK_SHORT_HELLO)+(E.final?" Финальный экзамен.":" Созвон, три жизни."):pick(E.final?EX_HELLO_FINAL:EX_HELLO),"pout"))return; r.started=true; }
  while(E.i<E.n&&E.lives>0){
    const q=E.qs[E.i], p=q.p, v={jp:p[0],ru:p[1]}; AK.prog=E.i/E.n; AK.cur={ci:p.ci};
    const c=COURSE[p.ci], same=(p.kind==="w"?c.W:c.P).map(x=>({jp:x[0],ru:x[1]}));
    let ok=false, rightLabel, rightLang;
    AK.tap=null;
    if(q.type==="c"){
      const toks=p[0].split(" "); const extra=[];
      for(const o of shuffle(ALLI.filter(t=>t.kind==="p"))){ if(extra.length>=2)break; for(const t of o[0].split(" ")){ if(!toks.includes(t)&&!extra.includes(t)){extra.push(t);break;} } }
      const b={tiles:shuffle([...toks,...extra].map((t,i)=>({t,i}))),sel:[],answer:p[0],done:false,ok:false};
      const promptHtml=`<span class="akru">Собери по-японски:</span><span class="akru" style="font-size:20px">${esc(p[1])}</span>`;
      AK.view={kind:"build",p,b,promptHtml}; akRender();
      await speakP("Собери: "+p[1],"ru"); if(!alive())return;
      if(!b.done){ await akWait(); if(!alive())return; }
      ok=b.ok; rightLabel=p[0]; rightLang="ja";
      AK.view={kind:"reveal",p,opts:[{jp:p[0],ok:true}],promptHtml};
    } else {
      let opts,promptRu,promptHtml;
      if(q.type==="a"){
        opts=shuffle([v,...otherV(v,same,E.o-1,"jp")]).map(o=>({jp:o.jp,ok:o===v}));
        promptRu=S.akShort?"Как будет: "+p[1].replace(/[?!.]+$/,"")+"?":p[3];
        promptHtml=`<span class="akru">${esc(promptRu)}</span>`;
      } else {
        opts=shuffle([v,...otherV(v,same,E.o-1,"ru")]).map(o=>({ru:o.ru,ok:o===v}));
        promptRu="Переведи.";
        promptHtml=`<span class="akru">Переведи:</span><span class="jp akjp">${rb(p[0])}</span>`;
      }
      AK.view={kind:"check",p,opts,promptHtml}; akRender();
      await speakP(promptRu,"ru"); if(!alive())return;
      if(q.type==="b"){ await speakP(p[0],"ja",.8); if(!alive())return; }
      if(AK.tap==null){ await akWait(); if(!alive())return; }
      ok=opts[AK.tap].ok; rightLabel=q.type==="a"?p[0]:p[1]; rightLang=q.type==="a"?"ja":"ru";
      AK.view={kind:"reveal",p,opts,promptHtml};
    }
    if(!ok){
      E.lives--; AK.bad++; E.streak=0; AK.mood=E.lives<=1?"angry":"pout"; srsGrade(p[0],0);
      const opts=AK.view.opts;
      if(E.lives<=0){ const lv=pick(HER_LEAVE); AK.view={kind:"react",ru:lv,bad:true,opts}; akRender(); beep(false); buzz(); await speakP(lv,"ru"); if(!alive())return; break; }
      const ins=pick(HER_RU[Math.min(1,AK.bad-1)])+(E.lives===1?" Последняя жизнь, долбоёб.":"");
      AK.view={kind:"react",ru:ins,bad:true,opts}; akRender(); beep(false); buzz();
      await speakP(ins,"ru"); if(!alive())return;
      AK.view={kind:"reveal",p,opts,promptHtml:`<span class="akru">Правильно:</span><span class="jp akjp">${rb(p[0])}</span><span class="hint">${esc(p[1])}</span>`}; akRender();
      await speakP("Правильно:","ru"); if(!alive())return;
      await speakP(p[0],"ja",.85); if(!alive())return;
      AK.view={kind:"react",ru:"Запомнил? Дальше.",opts,wait:true}; akRender(); await akWait(); if(!alive())return;
    } else {
      AK.good++; E.streak++; E.maxStreak=Math.max(E.maxStreak,E.streak); AK.mood=pick(["blush","laugh","happy"]); srsGrade(p[0],2);
      const pr=EX_STREAK[E.streak]||pick(S.akShort?["Да.","Ага.","Норм.","Верно, сука."]:AK_PRAISE);
      const opts=AK.view.opts;
      AK.view={kind:"react",ru:pr,opts}; akRender(); beep(true);
      await speakP(pr,"ru"); if(!alive())return;
      await speakP(rightLabel,rightLang,.9); if(!alive())return;
    }
    await sleep(300); if(!alive())return;
    E.i++;
  }
  AK.prog=1;
  const pass=E.lives>0;
  const key=E.final?"F":E.chs[0];
  const prev=S.acad.exam[key]||{best:0,pass:false,lv:{}};
  prev.lv=prev.lv||{}; prev.lv[E.lv]=Math.max(prev.lv[E.lv]||0,AK.good);
  S.acad.exam[key]={best:Math.max(prev.best,AK.good),pass:prev.pass||pass,lv:prev.lv};
  S.xp+=AK.good*8; save();
  if(pass){ AK.mood="blush"; const m=S.akShort?"Сдал. Свободен, красавчик.":pick(EX_PASS); AK.view={kind:"talk",ru:m}; akRender(); await speakP(m,"ru"); if(!alive())return; }
  wakeOff(); akExamEnd(pass);
}
function akExamEnd(pass){
  const E=AK.exam,L=(E.final?EXAM_FINAL:EXAM_LV)[E.lv];
  const lvls=Object.keys(EXAM_LV), nextLv=lvls[lvls.indexOf(E.lv)+1];
  const c=COURSE[E.chs[0]];
  app.innerHTML=`<section class="screen res">
    <div class="stage small bg-${c.bg}">${sceneDeco(c.bg)}<div class="girlwrap">${girlSVG(pass?"blush":"angry")}</div></div>
    <h2>${pass?(E.lives===E.max?"ЕБАТЬ ТЫ МАКТРАХЕР ПРЯМ":"ЭКЗАМЕН СДАН"):"ОНА ПОЛОЖИЛА ТРУБКУ"}</h2>
    <p>${E.final?"Финальный экзамен":esc(c.t)} · ${L.t} · правильно ${AK.good} из ${AK.good+AK.bad} · ${fmtClock(Date.now()-E.t0)}</p>
    <div class="stats"><div class="stat"><b>${"♥".repeat(E.lives)}${"♡".repeat(E.max-E.lives)}</b><small>жизни</small></div><div class="stat"><b>×${E.maxStreak}</b><small>серия</small></div><div class="stat fire"><b>+${AK.good*8}</b><small>XP</small></div></div>
    ${!pass?`<div class="note">Ошибки уже помечены — они первыми придут в «Повторить выученное». Подучи и перезвони.</div>`:""}
    ${pass&&nextLv?`<button class="big" id="up" ${pinkBtn}>Уровень выше: ${EXAM_LV[nextLv].t}</button>`:""}
    ${pass&&!nextLv&&!E.final&&E.chs[0]+1<COURSE.length?`<button class="big" id="nextC" ${pinkBtn}>Глава ${E.chs[0]+2}: ${esc(COURSE[E.chs[0]+1].t)}</button>`:""}
    <button class="${pass?"ghost":"big"}" id="again">${pass?"Ещё раз (новые вопросы)":"ПЕРЕЗВОНИТЬ, СУКА"}</button>
    <button class="ghost" id="menu">${E.final?"К главам":"К главе"}</button>
  </section>`;
  const up=document.getElementById("up"); if(up) up.onclick=()=>akExamStart(E.chs,nextLv,E.final);
  const nc=document.getElementById("nextC"); if(nc) nc.onclick=()=>chapterScreen(E.chs[0]+1,"w");
  document.getElementById("again").onclick=()=>akExamStart(E.chs,E.lv,E.final);
  document.getElementById("menu").onclick=()=>E.final?akMenu():chapterScreen(E.chs[0],"x");
  window.scrollTo(0,0);
}

home();
</script>
