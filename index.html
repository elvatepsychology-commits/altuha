<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Кана, блять">
<meta name="theme-color" content="#17183A">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Кана, блять</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Noto+Sans+JP:wght@400;500&family=Zen+Maru+Gothic:wght@500;700&family=Rubik:wght@400;500;700;900&display=swap">
<style>
/* Layout: one-screen mobile app, 480px column. Top bar → mascot speech → task → answer grid; feedback slides up as a bottom sheet like a hanko stamp. */
:root{
  --bg:#ECEEF8; --surface:#FFFFFF; --surface2:#DDE0F2; --ink:#17183A; --muted:#5D6191;
  --accent:#FF3D2E; --accent-ink:#FFFFFF; --good:#0F9D4E; --bad:#E0213A; --gold:#F2A900;
  --line:#C9CDE6; --pink:#E8338A;
  --f-jp:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif;
  --f-display:"Dela Gothic One","Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
  --f-kana:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --f-body:"Rubik",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E0F2C; --surface:#1A1C46; --surface2:#25285C; --ink:#F2F2FF; --muted:#A3A7DA;
  --accent:#FF5847; --accent-ink:#FFFFFF; --good:#2BD27A; --bad:#FF4D66; --gold:#FFC53D; --line:#33377A; --pink:#FF5FAE; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E0F2C; --surface:#1A1C46; --surface2:#25285C; --ink:#F2F2FF; --muted:#A3A7DA;
  --accent:#FF5847; --accent-ink:#FFFFFF; --good:#2BD27A; --bad:#FF4D66; --gold:#FFC53D; --line:#33377A; --pink:#FF5FAE; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-inline:16px;padding-block:12px 20px}
.screen{display:flex;flex-direction:column;gap:16px;flex:1}

/* ---------- HOME ---------- */
.brand{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:6px}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,10vw,46px);line-height:.95;margin:0;letter-spacing:-.01em;text-wrap:balance}
.brand h1 span{color:var(--accent)}
.brand .kanji{font-family:var(--f-display);font-size:15px;color:var(--muted);writing-mode:vertical-rl;letter-spacing:.2em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.stat small{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500}
.stat.fire b{color:var(--accent)}
.nag{background:var(--ink);color:var(--bg);border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:center}
.nag .face{font-size:18px;white-space:nowrap;font-weight:700}
.nag p{margin:0;font-size:14px;line-height:1.35;font-weight:500}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:4px 0 -6px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px;transition:transform .1s}
.mode:active{transform:scale(.97)}
.mode .k{font-family:var(--f-display);font-size:24px;line-height:1}
.mode .t{font-weight:700;font-size:14px}
.mode .d{font-size:12px;color:var(--muted)}
.mode[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.mastery{background:var(--surface);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.mastery .row{display:flex;justify-content:space-between;font-size:13px;font-weight:500}
.bar{height:10px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .4s}
.big{display:block;width:100%;background:var(--accent);color:var(--accent-ink);font-weight:900;font-size:18px;letter-spacing:.04em;padding:18px;border-radius:16px;box-shadow:0 5px 0 color-mix(in srgb,var(--accent) 55%,#000);transition:transform .08s,box-shadow .08s;text-transform:uppercase}
.big:active{transform:translateY(4px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 55%,#000)}
.ghost{display:block;width:100%;background:var(--surface);border:2px solid var(--line);font-weight:700;padding:14px;border-radius:14px}
.foot{font-size:12px;color:var(--muted);text-align:center;margin-top:auto;padding-top:8px}

/* ---------- LESSON ---------- */
.top{display:flex;align-items:center;gap:12px}
.x{width:36px;height:36px;border-radius:10px;font-size:22px;color:var(--muted);flex:none}
.prog{flex:1;height:14px;background:var(--surface2);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .35s}
.hearts{font-weight:900;color:var(--bad);font-variant-numeric:tabular-nums;white-space:nowrap}
.combo{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;color:var(--gold);min-height:16px;text-align:center}
.sensei{display:flex;gap:10px;align-items:flex-start}
.sensei .face{flex:none;background:var(--surface);border-radius:14px;padding:10px 8px;font-size:15px;font-weight:700;min-width:96px;text-align:center}
.bubble{background:var(--surface);border-radius:14px;padding:10px 12px;font-size:14px;line-height:1.35;font-weight:500;position:relative}
.prompt{font-size:13px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--muted);text-align:center}
.card{background:var(--surface);border-radius:22px;padding:18px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative}
.card .glyph{font-family:var(--f-display);font-size:clamp(96px,32vw,140px);line-height:1.05}
.card .roma{font-weight:900;font-size:clamp(54px,18vw,76px);line-height:1.1;letter-spacing:.02em}
.card .tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;background:var(--surface2);padding:4px 10px;border-radius:99px;color:var(--muted)}
.say{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:12px;background:var(--surface2);font-size:18px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:16px;padding:16px 8px;font-size:24px;font-weight:700;min-height:74px;transition:transform .08s}
.opt.kana{font-family:var(--f-display);font-weight:400;font-size:38px}
.opt:active{transform:translateY(2px)}
.opt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,var(--surface))}
.opt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--surface))}
.opt:disabled{cursor:default}
.typebox{display:flex;flex-direction:column;gap:10px}
.typebox input{width:100%;font:inherit;font-size:28px;font-weight:700;text-align:center;padding:14px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--ink);text-transform:lowercase}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.pop{animation:pop .35s}
@keyframes pop{40%{transform:scale(1.08)}}

/* ---------- FEEDBACK SHEET ---------- */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(110%);transition:transform .22s ease-out}
.sheet.show{transform:none}
.sheet.good{background:color-mix(in srgb,var(--good) 22%,var(--bg))}
.sheet.bad{background:color-mix(in srgb,var(--bad) 22%,var(--bg))}
.sheet .in{max-width:448px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.sheet h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.05;text-transform:uppercase}
.sheet.good h2{color:var(--good)}.sheet.bad h2{color:var(--bad)}
.sheet p{margin:0;font-weight:500;font-size:15px}
.sheet p .k{font-family:var(--f-display);font-size:22px}
.sheet .big.g{background:var(--good);box-shadow:0 5px 0 color-mix(in srgb,var(--good) 55%,#000)}
.sheet .big.b{background:var(--bad);box-shadow:0 5px 0 color-mix(in srgb,var(--bad) 55%,#000)}
.stamp{position:fixed;z-index:6;left:50%;top:38%;transform:translate(-50%,-50%) rotate(-12deg) scale(2.4);opacity:0;pointer-events:none;font-family:var(--f-display);font-size:64px;border:6px solid currentColor;border-radius:14px;padding:0 14px;line-height:1.2}
.stamp.go{animation:stamp .7s forwards}
@keyframes stamp{0%{opacity:0;transform:translate(-50%,-50%) rotate(-12deg) scale(2.4)}25%{opacity:.95;transform:translate(-50%,-50%) rotate(-12deg) scale(1)}75%{opacity:.95}100%{opacity:0;transform:translate(-50%,-50%) rotate(-12deg) scale(1)}}

/* ---------- RESULT ---------- */
.res{display:flex;flex-direction:column;gap:14px;align-items:stretch;text-align:center;padding-top:20px}
.res .face{font-size:30px;font-weight:700}
.res h2{font-family:var(--f-display);font-weight:400;font-size:clamp(30px,9vw,40px);margin:0;line-height:1.05;text-wrap:balance}
.res p{margin:0;color:var(--muted);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{font-family:var(--f-display);font-size:22px;background:var(--surface);border:2px solid var(--bad);border-radius:12px;padding:4px 10px}

/* ---------- CHEAT SHEET ---------- */
.sh-h{display:flex;align-items:center;gap:10px}
.sh-h h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:26px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.cell{background:var(--surface);border-radius:12px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid transparent}
.cell .g{font-family:var(--f-display);font-size:30px;line-height:1.1}
.cell .r{font-size:12px;font-weight:700;color:var(--muted)}
.cell.m1{border-color:var(--gold)}.cell.m2{border-color:var(--good)}.cell.weak{border-color:var(--bad)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);font-weight:500}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.legend .l1::before{background:var(--bad)}.legend .l2::before{background:var(--gold)}.legend .l3::before{background:var(--good)}
.note{background:var(--surface);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.45}
.note b{font-family:var(--f-display);font-weight:400}

/* ---------- ПИКАП ---------- */
.pu-entry{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--pink);color:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 5px 0 color-mix(in srgb,var(--pink) 55%,#000);transition:transform .08s}
.pu-entry:active{transform:translateY(4px);box-shadow:0 1px 0 color-mix(in srgb,var(--pink) 55%,#000)}
.pu-entry .k{font-family:var(--f-display);font-size:40px;line-height:1}
.pu-entry b{display:block;font-weight:900;font-size:18px;text-transform:uppercase;letter-spacing:.03em}
.pu-entry small{font-size:13px;opacity:.92}
.pu-head{display:flex;align-items:center;gap:10px}
.pu-head h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:24px;flex:1;line-height:1.05}
.tog{background:var(--surface);border:2px solid var(--line);border-radius:99px;padding:6px 12px;font-size:12px;font-weight:700;white-space:nowrap}
.tog[aria-pressed="true"]{border-color:var(--pink);color:var(--pink)}
.ch{background:var(--surface);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.ch .hd{display:flex;gap:12px;align-items:flex-start}
.ch .n{font-family:var(--f-display);font-size:26px;color:var(--pink);line-height:1;min-width:28px}
.ch h3{margin:0;font-size:17px;font-weight:900}
.ch p{margin:2px 0 0;font-size:13px;color:var(--muted);line-height:1.35}
.stages{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stg{background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:8px 4px;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.15}
.stg i{font-style:normal;font-size:11px;color:var(--muted);font-weight:500}
.stg.done{border-color:var(--good)}.stg.done i{color:var(--good);font-weight:700}
.ph{display:flex;gap:10px;align-items:center;background:var(--surface);border-radius:14px;padding:12px}
.ph .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.jp{font-family:var(--f-jp);font-weight:700;line-height:1.35;word-break:keep-all;overflow-wrap:anywhere}
.ph .jp{font-size:20px}
.rm{font-size:13px;color:var(--muted);font-style:italic}
.ph .ru{font-size:14px;font-weight:500}
.spk{flex:none;width:40px;height:40px;border-radius:12px;background:var(--surface2);font-size:17px}
.card .jpbig{word-break:keep-all;overflow-wrap:anywhere;font-family:var(--f-jp);font-weight:700;font-size:clamp(26px,8vw,34px);text-align:center;line-height:1.3;padding-inline:36px}
.card .rubig{font-weight:900;font-size:clamp(22px,7vw,30px);text-align:center;line-height:1.2;padding-inline:8px}
.opts1{display:flex;flex-direction:column;gap:8px}
.ropt{background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:14px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:2px;transition:transform .08s}
.ropt:active{transform:translateY(2px)}
.ropt .jp{font-size:19px}
.ropt .ru{font-size:16px;font-weight:700}
.ropt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 16%,var(--surface))}
.ropt.no{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,var(--surface))}
.slot{min-height:64px;border-bottom:2px dashed var(--line);display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;padding-bottom:10px}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:48px}
.tile{font-family:var(--f-jp);font-weight:700;font-size:19px;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:8px 12px}
.tile.ghosted{visibility:hidden}
.meter{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:14px;padding:8px 12px}
.meter .f{font-weight:700;white-space:nowrap;font-size:15px}
.meter .bar{flex:1}.meter .bar i{background:var(--pink)}
.meter b{font-variant-numeric:tabular-nums;font-size:14px;min-width:40px;text-align:right}
.narr{font-size:13px;color:var(--muted);text-align:center;font-weight:500;line-height:1.4;padding-inline:8px}
.chat{display:flex;flex-direction:column;gap:8px}
.msg{max-width:86%;padding:10px 12px;border-radius:16px;display:flex;flex-direction:column;gap:3px}
.msg .jp{font-size:18px}
.msg.her{align-self:flex-start;background:var(--surface);border-bottom-left-radius:4px}
.msg.me{align-self:flex-end;background:var(--pink);color:#fff;border-bottom-right-radius:4px}
.msg.me .rm{color:#fff;opacity:.85}
.msg.me.x{opacity:.45;text-decoration:line-through}
.msg .who{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;opacity:.7}
.msg .acts{display:flex;gap:6px;margin-top:2px}
.mini{font-size:12px;font-weight:700;background:var(--surface2);border-radius:99px;padding:4px 10px}
.msg .ru{font-size:14px;font-weight:500;color:var(--muted)}
.ask{font-size:13px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--pink);text-align:center;margin-top:4px}
.motiv{background:var(--surface);border-left:0;border-radius:14px;padding:12px 14px;font-size:14px;font-weight:500;line-height:1.4}
.motiv b{color:var(--pink)}

/* ---------- ЖИВОЕ ОБЩЕНИЕ ---------- */
.livegrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.live{position:relative;text-align:left;border-radius:16px;padding:12px;min-height:118px;display:flex;flex-direction:column;gap:3px;color:#1B1530;overflow:hidden;transition:transform .08s}
.live:active{transform:scale(.97)}
.live .k{font-family:var(--f-display);font-size:30px;line-height:1;opacity:.85}
.live b{font-weight:900;font-size:15px;line-height:1.15}
.live small{font-size:12px;line-height:1.3;opacity:.8}
.live i{font-style:normal;font-size:11px;font-weight:700;margin-top:auto;opacity:.75}
.live.bg-scold,.live.bg-day{color:#fff}
.bg-cafe{background:linear-gradient(#F3D9B8,#E6BE92)}
.bg-park{background:linear-gradient(#9FD8FF,#D8F1FF)}
.bg-home{background:linear-gradient(#D9CCF2,#C4B4EA)}
.bg-whims{background:linear-gradient(#FFB3D1,#FF8DBD)}
.bg-day{background:linear-gradient(#F59E6B,#6A3F8E)}
.bg-scold{background:linear-gradient(#7A0F22,#C2223B)}
.bg-game{background:linear-gradient(#FFE97A,#FFC93D)}
.gate{background:var(--ink);color:var(--bg);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:4px}
.gate b{font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1.1}
.gate span{font-weight:700;color:var(--pink)}
.live-screen{gap:12px}
.stage{position:relative;height:min(52vh,380px);min-height:300px;border-radius:22px;overflow:hidden;display:flex;justify-content:center;align-items:flex-end;transition:filter .4s}
.stage.small{height:220px;min-height:0}
.stage .deco{position:absolute;inset:0;width:100%;height:100%}
.girlwrap{position:relative;width:min(62%,250px);margin-bottom:-6px;animation:bob 3.2s ease-in-out infinite}
.girlwrap svg{display:block;width:100%;height:auto}
.stage.gone .girlwrap{animation:leave 1.6s ease-in forwards}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes leave{to{transform:translateX(140%) rotate(6deg);opacity:0}}
.girl .eye{animation:blink 4.2s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.08)}}
.girl .tear{animation:tear 1.4s ease-in infinite}
@keyframes tear{from{transform:translateY(0);opacity:1}to{transform:translateY(16px);opacity:0}}
.speech{position:absolute;top:12px;left:12px;right:12px;z-index:2;background:#fff;color:#1B1530;border-radius:18px;padding:12px 14px;box-shadow:0 4px 0 rgba(0,0,0,.12);display:flex;flex-direction:column;gap:4px;animation:pop .3s}
.speech::after{content:"";position:absolute;bottom:-9px;left:50%;border:10px solid transparent;border-top-color:#fff;border-bottom:0;margin-left:-10px}
.speech .jp{font-size:22px}
.speech .hint{font-size:13px;color:#6B6890;font-weight:500}
.ru-speech{background:#E0213A;color:#fff;font-weight:900;font-size:19px;line-height:1.25}
.ru-speech::after{border-top-color:#E0213A}
.lovebar{position:absolute;left:12px;bottom:12px;z-index:2;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.88);border-radius:99px;padding:5px 10px;width:min(170px,45%);color:#1B1530;font-size:13px;font-weight:700}
.lovebar .bar{flex:1;height:8px;background:#EAD9E4}.lovebar .bar i{background:#E8338A}
.toast{position:absolute;right:10px;bottom:56px;z-index:3;background:var(--gold);color:#1B1530;font-weight:900;font-size:13px;padding:6px 10px;border-radius:10px;transform:rotate(-4deg);animation:pop .4s}
.liverow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.coach{background:var(--surface);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px}

<script>
/* ===== DATA: только твои буквы + все модификации ===== */
const RAW = {
  h:  "う:u|え:e|け:ke|さ:sa|せ:se|た:ta|ち:chi,ti|と:to|な:na|ぬ:nu|ね:ne|の:no|は:ha|ひ:hi|へ:he|ほ:ho|ま:ma|む:mu|め:me|も:mo|ら:ra|れ:re|ろ:ro|を:wo,o",
  hm: "ゔ:vu|げ:ge|ざ:za|ぜ:ze|だ:da|ぢ:ji,di,dzi|ど:do|ば:ba|ぱ:pa|び:bi|ぴ:pi|べ:be|ぺ:pe|ぼ:bo|ぽ:po",
  k:  "ア:a|ウ:u|エ:e|ケ:ke|サ:sa|シ:shi,si|ス:su|セ:se|タ:ta|チ:chi,ti|ト:to|ナ:na|ヌ:nu|ネ:ne|ノ:no|ハ:ha|ヒ:hi|ヘ:he|ホ:ho|マ:ma|ム:mu|メ:me|モ:mo|ヤ:ya|ラ:ra|レ:re|ロ:ro|ヲ:wo,o",
  km: "ヴ:vu|ゲ:ge|ザ:za|ジ:ji,zi|ズ:zu|ゼ:ze|ダ:da|ヂ:ji,di,dzi|ド:do|バ:ba|パ:pa|ビ:bi|ピ:pi|ベ:be|ペ:pe|ボ:bo|ポ:po"
};
const ITEMS=[];
for(const [key,str] of Object.entries(RAW)){
  for(const p of str.split("|")){
    const [kana,rs]=p.split(":"); const r=rs.split(",");
    let disp=r[0]; if(kana==="ぢ"||kana==="ヂ") disp="ji (di)";
    ITEMS.push({k:kana,r,disp,s:key[0],mod:key.length>1});
  }
}
const BYK=Object.fromEntries(ITEMS.map(i=>[i.k,i]));
// пара хирагана↔катакана по звуку
ITEMS.forEach(i=>{ i.twin = ITEMS.find(j=>j.s!==i.s && j.r[0]===i.r[0] && j.mod===i.mod && !(j.k==="ヂ"&&i.k!=="ぢ") && !(i.k==="ヂ"&&j.k!=="ぢ") && !(j.k==="ジ")&&!(i.k==="ジ")) || null; });
// похожие по форме — их подсовываем как ловушки
const CONF=[["ぬ","め"],["ね","れ"],["は","ほ"],["さ","ち"],["ア","マ"],["ス","ヌ"],["ノ","メ"],["ウ","ワ"],["シ","ン"],["ケ","ク"],["ロ","コ"],["ナ","メ"],["ハ","ヘ"],["れ","ね"],["む","す"],["ろ","る"],["ら","ち"],["た","な"],["ぬ","ね"],["め","ぬ"],["ヲ","ヨ"],["ホ","ネ"],["チ","テ"],["セ","サ"],["ば","ぱ"],["バ","パ"],["ビ","ピ"],["び","ぴ"],["ボ","ポ"],["ぼ","ぽ"],["ベ","ペ"],["べ","ぺ"],["ザ","サ"],["ジ","シ"],["ヂ","ジ"],["ぢ","ち"]];
const CONFMAP={}; CONF.forEach(([a,b])=>{(CONFMAP[a]=CONFMAP[a]||[]).push(b);(CONFMAP[b]=CONFMAP[b]||[]).push(a);});

/* ===== МАТ ===== */
const WRONG=["ПИЗДЕЦ, ДОЛБАЁБ","ЕБАТЬ ТЫ ТРУБА","ЕБЛАН","ИДИОТ","ЛОШАРА","ГЛАЗА РАЗУЙ, САМУРАЙ ХУЕВ","ХУЙНЮ НАЖАЛ, БРО","ТЫ ЯПОНЦЕВ ПОЗОРИШЬ","СЭНСЭЙ ПЛАЧЕТ КРОВЬЮ","НУ ТЫ И ТАПОК","МАМА, ЗАБЕРИ МЕНЯ ОТСЮДА","БЛЯ, НУ ТЫ СЕРЬЁЗНО?","ДАЖЕ МОЯ БАБКА ЗНАЕТ","МИМО, ДОЛБОЁБИНА"];
const WRONG_SUB=["Запоминай, хуйло:","Смотри и рыдай:","Правильно было вот так, гений:","Записывай, клоун:","Учи, лошпед:"];
const RIGHT=["ЗАЕБИСЬ!","КРАСАВА","ДА ОХУЕННО","НЕ ПРОЕБИ СЕРИЮ","ЕБАТЬ ТЫ ГЕНИЙ","В ЯБЛОЧКО, СУКА","ТОКИО ГОРДИТСЯ","МОЩНО, БЛЯТЬ","ВОТ ЭТО ДРУГОЕ ДЕЛО","ДЕРЖИ ПЯТЬ, СЭМПАЙ"];
const SLOW=["Ну пойдёт","Ну пойдёт. Медленно, как черепаха","Ну пойдёт. Думал как будто ипотеку берёшь"];
const COMBO={3:"ТРИ ПОДРЯД, ЕБАТЬ",5:"ТЫ ЧЁ, ЯПОНЕЦ?",8:"НЕ ПРОЕБИ СЕРИЮ, СУКА",10:"САМУРАЙ НАХУЙ",15:"ИМПЕРАТОР КАНЫ",20:"ТЫ ВООБЩЕ ЧЕЛОВЕК?"};
const BROKE="СЕРИЮ ПРОЕБАЛ, КЛОУН";
const FACE={idle:"(•̀ᴗ•́)و",ok:"(ﾉ◕ヮ◕)ﾉ",bad:"(╬ Ò﹏Ó)",dead:"(×_×)",think:"(¬_¬ )",king:"(⌐■_■)"};
const TAUNTS=["Ну давай, удиви меня","Если ошибёшься — я узнаю","Не тупи, всё на глазах","Сосредоточься, раздолбай","Это ж элементарно, бля","Я в тебя верю. Почти.","Покажи, что ты не овощ"];
const _lastPick=new WeakMap();
const pick=a=>{if(a.length<2)return a[0];let x,g=0;do{x=a[Math.floor(Math.random()*a.length)]}while(x===_lastPick.get(a)&&++g<20);_lastPick.set(a,x);return x;};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* ===== ХРАНИЛКА ===== */
const LS="kana-blyat-v1";
let S={xp:0,streak:0,last:null,best:0,stats:{},mode:"all",lessons:0};
try{const d=JSON.parse(localStorage.getItem(LS)||"null"); if(d) S=Object.assign(S,d);}catch(e){}
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}};
const dayKey=(d=new Date())=>d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
const yesterday=()=>{const d=new Date();d.setDate(d.getDate()-1);return dayKey(d)};
function liveStreak(){ return (S.last===dayKey()||S.last===yesterday())?S.streak:0; }
const st=k=>S.stats[k]||(S.stats[k]={c:0,w:0});
const level=k=>{const s=S.stats[k]; if(!s||s.c+s.w===0) return 0; const acc=s.c/(s.c+s.w); if(s.c>=4&&acc>=.8) return 2; if(s.w>s.c) return -1; return 1;};

/* ===== ЗВУК / ВИБРА / ОЗВУЧКА ===== */
let AC=null;
function beep(ok){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime;const notes=ok?[660,880]:[220,150];notes.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ok?"triangle":"sawtooth";o.frequency.value=f;g.gain.setValueAtTime(.0001,t+i*.09);g.gain.exponentialRampToValueAtTime(.18,t+i*.09+.01);g.gain.exponentialRampToValueAtTime(.0001,t+i*.09+.16);o.connect(g).connect(AC.destination);o.start(t+i*.09);o.stop(t+i*.09+.18)})}catch(e){}}
function buzz(){try{navigator.vibrate&&navigator.vibrate([60,40,90])}catch(e){}}
function speak(text){try{if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(ttsClean(text));u.lang="ja-JP";u.rate=.8;speechSynthesis.speak(u)}catch(e){}}
/* чёткая озвучка буквы: медленно два раза по-японски + слог по-русски */
const CYR={a:"а",u:"у",e:"э",ke:"кэ",sa:"са",shi:"си",su:"су",se:"сэ",ta:"та",chi:"ти",to:"то",na:"на",nu:"ну",ne:"нэ",no:"но",ha:"ха",hi:"хи",he:"хэ",ho:"хо",ma:"ма",mu:"му",me:"мэ",mo:"мо",ya:"я",ra:"ра",re:"рэ",ro:"ро",wo:"о",vu:"ву",ge:"гэ",za:"дза",ji:"дзи",zu:"дзу",ze:"дзэ",da:"да",do:"до",ba:"ба",pa:"па",bi:"би",pi:"пи",be:"бэ",pe:"пэ",bo:"бо",po:"по"};
const kanaRu=k=>{const it=BYK[k];return it?CYR[it.r[0]]:null;};
if(S.ruEcho===undefined) S.ruEcho=true;
async function kanaSayP(k){ await speakP(k+"。 "+k,"ja",.55); if(S.ruEcho){const c=kanaRu(k); if(c) await speakP(c,"ru",.8);} }
function speakKana(k){ try{speechSynthesis.cancel()}catch(e){} kanaSayP(k); }

/* ===== УРОК ===== */
const MODES={
  hira:{t:"Хирагана",k:"ひ",d:"только ひらがな",f:i=>i.s==="h"},
  kata:{t:"Катакана",k:"カ",d:"только カタカナ",f:i=>i.s==="k"},
  mods:{t:"Точки и кружки",k:"ガ",d:"゛ и ゜ — дакутэн",f:i=>i.mod},
  all:{t:"Всё нахуй",k:"全",d:"полный замес",f:()=>true},
  mine:{t:"Мои буквы",k:"我",d:"что не ебу",f:i=>inMine(i),hidden:true},
};
let L=null;
const app=document.getElementById("app");

function weightOf(i){const s=S.stats[i.k]; if(!s) return 3; return Math.max(.4, 1.5 + s.w*1.5 - s.c*.35);}
function pickItems(pool,n){
  const res=[],avail=pool.slice();
  while(res.length<n&&avail.length){
    const tot=avail.reduce((a,i)=>a+weightOf(i),0); let r=Math.random()*tot, idx=0;
    for(;idx<avail.length;idx++){r-=weightOf(avail[idx]); if(r<=0)break;}
    res.push(avail.splice(Math.min(idx,avail.length-1),1)[0]);
  }
  return res;
}
const clash=(a,b)=>a.r.some(x=>b.r.includes(x));
function distractors(item,script,n,exclude){
  const pool=ITEMS.filter(j=>j.s===script && j!==exclude && !clash(j,item));
  const conf=(CONFMAP[exclude?exclude.k:item.k]||[]).map(k=>BYK[k]).filter(j=>j&&pool.includes(j));
  const out=shuffle(conf).slice(0,2);
  for(const j of shuffle(pool)){ if(out.length>=n)break; if(!out.includes(j)) out.push(j); }
  return out.slice(0,n);
}
function makeQ(item,forceType){
  let types=["read","read","find","find","type"];
  let t=forceType||pick(types);
  if(t==="twin"&&!item.twin) t="read";
  const q={item,type:t};
  if(t==="read"){ // кана → ромадзи
    const ds=distractors(item,item.s,3).filter((j,ix,a)=>a.findIndex(z=>z.disp===j.disp)===ix && j.disp!==item.disp);
    q.opts=shuffle([item,...ds].slice(0,4)).map(j=>({label:j.disp,ok:j===item}));
  } else if(t==="find"){ // ромадзи → кана
    q.opts=shuffle([item,...distractors(item,item.s,3)]).map(j=>({label:j.k,ok:j===item,kana:true}));
  } else if(t==="twin"){ // хирагана ↔ катакана
    const tw=item.twin;
    q.opts=shuffle([tw,...distractors(tw,tw.s,3,tw)]).map(j=>({label:j.k,ok:j===tw,kana:true}));
  }
  return q;
}
function startLesson(){
  const pool=ITEMS.filter(MODES[S.mode].f);
  if(!pool.length){ return pickerScreen(); }
  const items=pickItems(pool,12);
  L={queue:items.map(i=>makeQ(i)),total:items.length,done:0,hearts:5,combo:0,maxCombo:0,right:0,wrong:0,missed:new Set(),xp:0,cur:null,t0:0,locked:false};
  next();
}
function next(){
  hideSheet();
  if(L.hearts<=0) return result(true);
  if(!L.queue.length) return result(false);
  L.cur=L.queue.shift(); L.locked=false; L.t0=performance.now();
  renderQ();
}
function promptText(q){
  const sc=q.item.s==="h"?"хирагана":"катакана";
  return {read:"Как это читается, а?",find:`Найди ${sc==="хирагана"?"хирагану":"катакану"}`,twin:`Найди брата-${q.item.s==="h"?"катакану":"хирагану"}`,type:"Напиши ромадзи, грамотей"}[q.type];
}
function renderQ(face=FACE.idle,bub=pick(TAUNTS)){
  const q=L.cur,i=q.item,pct=Math.round(L.done/L.total*100);
  const showKana = q.type!=="find";
  const tag = (i.s==="h"?"хирагана":"катакана")+(i.mod?" · модифицированная":"");
  let ans="";
  if(q.type==="type"){
    ans=`<form class="typebox" id="tf" autocomplete="off"><input id="ti" inputmode="latin" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="ka, shi, wo…" aria-label="Ромадзи"><button class="big" type="submit">Проверить, блять</button></form>`;
  } else {
    ans=`<div class="opts">${q.opts.map((o,ix)=>`<button class="opt ${o.kana?"kana":""}" data-ix="${ix}">${o.label}</button>`).join("")}</div>`;
  }
  app.innerHTML=`<section class="screen">
    <div class="top"><button class="x" id="quit" aria-label="Выйти">✕</button><div class="prog"><i style="width:${pct}%"></i></div><div class="hearts" aria-label="Жизни">♥ ${L.hearts}</div></div>
    <div class="combo">${L.combo>=2?`серия ×${L.combo}`:""}</div>
    <div class="sensei"><div class="face" id="face">${face}</div><div class="bubble" id="bub">${bub}</div></div>
    <div class="prompt">${promptText(q)}</div>
    <div class="card" id="card">
      ${showKana?`<button class="say" id="say" aria-label="Озвучить">🔊</button><div class="glyph">${i.k}</div>`:`<div class="roma">${i.disp}</div>`}
      <span class="tag">${q.type==="find"?(i.s==="h"?"ищем хирагану":"ищем катакану"):tag}</span>
    </div>
    ${ans}
  </section>`;
  document.getElementById("quit").onclick=()=>home();
  const sb=document.getElementById("say"); if(sb) sb.onclick=()=>speakKana(i.k);
  if(q.type==="type"){
    const f=document.getElementById("tf"),inp=document.getElementById("ti");
    setTimeout(()=>inp.focus(),50);
    f.onsubmit=e=>{e.preventDefault(); if(L.locked)return; const v=inp.value.trim().toLowerCase(); if(!v){inp.classList.remove("shake");void inp.offsetWidth;inp.classList.add("shake");return;} answer(i.r.includes(v),v);};
  } else {
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      if(L.locked)return; const o=q.opts[+b.dataset.ix];
      app.querySelectorAll(".opt").forEach((bb,ix)=>{bb.disabled=true; if(q.opts[ix].ok) bb.classList.add("ok");});
      if(!o.ok) b.classList.add("no");
      answer(o.ok,o.label);
    });
  }
}
function answer(ok){
  L.locked=true;
  const q=L.cur,i=q.item,s=st(i.k),slow=(performance.now()-L.t0)>6000;
  const card=document.getElementById("card"),face=document.getElementById("face"),bub=document.getElementById("bub");
  if(ok){
    s.c++; L.right++; L.done++; L.combo++; L.maxCombo=Math.max(L.maxCombo,L.combo);
    const gain=10+Math.min(L.combo,10); L.xp+=gain;
    let title=slow?pick(SLOW):pick(RIGHT); if(COMBO[L.combo]) title=COMBO[L.combo];
    face.textContent=L.combo>=5?FACE.king:FACE.ok; bub.textContent=slow?"Мог бы и побыстрее, тормоз":"Вот это я понимаю";
    card.classList.add("pop"); beep(true); stampIt(L.combo>=5?"神":"良",true);
    const extra = q.type==="twin" ? `<span class="k">${i.k}</span> ↔ <span class="k">${i.twin.k}</span> = ${i.disp}` : `<span class="k">${i.k}</span> = ${i.disp}`;
    showSheet(true,title,`${extra} · +${gain} XP`,slow?"ДАЛЬШЕ, ЧЕРЕПАХА":"ПОГНАЛИ ДАЛЬШЕ");
  } else {
    s.w++; L.wrong++; L.hearts--; L.missed.add(i.k);
    const broke=L.combo>=5; L.combo=0;
    face.textContent=L.hearts<=0?FACE.dead:FACE.bad; bub.textContent=broke?BROKE:"Я разочарован в тебе";
    card.classList.add("shake"); beep(false); buzz(); stampIt("駄",false);
    const right = q.type==="twin" ? `<span class="k">${i.k}</span> ↔ <span class="k">${i.twin.k}</span> (${i.disp})` : `<span class="k">${i.k}</span> = ${i.disp}`;
    L.queue.push(makeQ(i, q.type==="type"?"read":undefined)); // вернётся в конце урока
    showSheet(false,broke?BROKE:pick(WRONG),`${pick(WRONG_SUB)} ${right}`, L.hearts<=0?"СДОХ. ДАЛЬШЕ":"ПОНЯЛ, Я ДОЛБОЁБ");
  }
  save();
}
function stampIt(ch,ok){const el=document.getElementById("stamp");el.textContent=ch;el.style.color=ok?"var(--good)":"var(--bad)";el.classList.remove("go");void el.offsetWidth;el.classList.add("go");}
function showSheet(ok,title,sub,btn,cb){
  const sh=document.getElementById("sheet"),inn=document.getElementById("sheetIn");
  sh.className="sheet "+(ok?"good":"bad");
  inn.innerHTML=`<h2>${title}</h2><p>${sub}</p><button class="big ${ok?"g":"b"}" id="nx">${btn}</button>`;
  requestAnimationFrame(()=>sh.classList.add("show"));
  const nx=document.getElementById("nx"); nx.onclick=cb||next; setTimeout(()=>nx.focus({preventScroll:true}),60);
}
function hideSheet(){document.getElementById("sheet").classList.remove("show");}

/* ===== ИТОГ ===== */
function result(dead){
  hideSheet();
  const acc=Math.round(L.right/Math.max(1,L.right+L.wrong)*100);
  let face,title,sub;
  if(dead){face=FACE.dead;title="ТЫ ОБОСРАЛСЯ";sub="Жизни кончились. Иди глянь шпаргалку и возвращайся, лошара.";}
  else if(acc===100){face=FACE.king;title="ИМПЕРАТОР ЯПОНИИ";sub="Ни одной ошибки. Я аж прослезился, сука.";}
  else if(acc>=80){face=FACE.ok;title="КРАСАВА";sub="Но не зазнавайся, пару раз ты всё-таки обосрался.";}
  else if(acc>=55){face=FACE.think;title="НУ ПОЙДЁТ";sub="Сойдёт для сельской местности. Завтра лучше.";}
  else {face=FACE.bad;title="ПИЗДЕЦ";sub="Половину просрал. Шпаргалка ждёт тебя, еблан.";}
  if(!dead){
    S.xp+=L.xp; S.lessons++;
    const today=dayKey(); if(S.last!==today){ S.streak=(S.last===yesterday())?S.streak+1:1; S.last=today; }
    S.best=Math.max(S.best,L.maxCombo); save();
  }
  const missed=[...L.missed];
  app.innerHTML=`<section class="screen res">
    <div class="face">${face}</div>
    <h2>${title}</h2><p>${sub}</p>
    <div class="stats"><div class="stat"><b>${acc}%</b><small>точность</small></div><div class="stat"><b>+${dead?0:L.xp}</b><small>XP</small></div><div class="stat fire"><b>×${L.maxCombo}</b><small>макс. серия</small></div></div>
    ${dead?"":`<p>Огонёк: <b style="color:var(--accent)">${S.streak} ${plural(S.streak)}</b> подряд. Завтра не приходишь — обнулю, клянусь.</p>`}
    ${missed.length?`<div class="label" style="text-align:left">На чём ты обосрался</div><div class="chips">${missed.map(k=>`<span class="chip">${k} <small style="font-family:var(--f-body);font-size:13px;color:var(--muted)">${BYK[k].disp}</small></span>`).join("")}</div>`:""}
    <button class="big" id="again">${dead?"РЕВАНШ, СУКА":"ЕЩЁ РАЗОК"}</button>
    <button class="ghost" id="back">На главную</button>
  </section>`;
  document.getElementById("again").onclick=startLesson;
  document.getElementById("back").onclick=home;
}
const plural=n=>{const a=n%10,b=n%100; if(a===1&&b!==11)return"день"; if(a>=2&&a<=4&&(b<10||b>=20))return"дня"; return"дней";};

/* ===== ШПАРГАЛКА ===== */

  const block=(title,f)=>`<div class="label">${title}</div><div class="grid">${ITEMS.filter(f).map(i=>{const l=level(i.k);return `<button class="cell ${l===2?"m2":l===1?"m1":l===-1?"weak":""}" data-k="${i.k}" aria-label="${i.k} ${i.disp}"><span class="g">${i.k}</span><span class="r">${i.disp}</span></button>`}).join("")}</div>`;
  app.innerHTML=`<section class="screen">
    <div class="sh-h"><button class="x" id="back" aria-label="Назад">←</button><h2>Шпаргалка</h2></div>

    <div class="note">Тапни по букве — озвучу. <b>゛</b> (две точки, дакутэн) делает звук звонким: к→г, с→з, т→д, х→б. <b>゜</b> (кружок, хандакутэн) только у ха-ряда: х→п. А <b>へ</b> и <b>ヘ</b> почти одинаковые, не еби себе мозг.</div>

    ${block("Катакана с ゛ ゜",i=>i.s==="k"&&i.mod)}
    <button class="big" id="go">ХВАТИТ ПЯЛИТЬСЯ, УЧИСЬ</button>

/* ===== МОИ БУКВЫ ===== */
if(!S.myKana) S.myKana=[];
if(S.myMods===undefined) S.myMods=true;
const baseOf=k=>k.normalize("NFD")[0];
function inMine(i){const sel=new Set(S.myKana); return i.mod ? (S.myMods&&sel.has(baseOf(i.k))) : sel.has(i.k);}
const myPool=()=>ITEMS.filter(inMine);
function pickerScreen(from){
  hideSheet();
  const sel=new Set(S.myKana);
  const modsOf=k=>ITEMS.filter(i=>i.mod&&baseOf(i.k)===k).map(i=>i.k);
  const block=(title,s)=>`<div class="label">${title}</div><div class="grid">${ITEMS.filter(i=>i.s===s&&!i.mod).map(i=>{const l=level(i.k),md=modsOf(i.k);return `<button class="cell pick ${sel.has(i.k)?"on":""} ${l===2?"m2":l===-1?"weak":""}" data-k="${i.k}" aria-pressed="${sel.has(i.k)}"><span class="g">${i.k}</span>${md.length?`<span class="r md">${S.myMods?"+"+md.join(""):"&nbsp;"}</span>`:`<span class="r md">&nbsp;</span>`}</button>`}).join("")}</div>`;
  const n=myPool().length;
  app.innerHTML=`<section class="screen">
    <div class="sh-h"><button class="x" id="back" aria-label="Назад">←</button><h2>Мои буквы</h2></div>
    <div class="note">Тыкай буквы, которые <b>не ебёшь</b>. Гонять будем только их. Подсказок под буквами нет специально — отмечай честно. Зелёная рамка: уже выучено, красная: ты на ней тупишь.</div>
    <div class="pickbtns">
      <button class="mini" id="pAll">Все</button><button class="mini" id="pNone">Сбросить</button><button class="mini" id="pWeak">Всё невыученное</button><button class="mini" id="pBad">Только где туплю</button>
    </div>
    <label class="switch"><input type="checkbox" id="pMods" ${S.myMods?"checked":""}><span><b>+ подзвуки ゛゜</b><small>к отмеченным добавятся げ ざ だ ば ぱ… (け→げ, は→ば/ぱ)</small></span></label>
    <label class="switch"><input type="checkbox" id="pEcho" ${S.ruEcho?"checked":""}><span><b>Русский дубль звука</b><small>после японского голоса скажет «пэ», «кэ», «дзи» — чтобы не путать ペ и テ</small></span></label>
    ${block("Хирагана","h")}
    ${block("Катакана","k")}
    <div class="pickgo"><button class="big" id="go" ${n?"":"disabled"}>${n?`Гонять ${n} букв, сука`:"Сначала отметь буквы"}</button></div>

/* =================================================================
   ПИКАПИМ АЛЬТУХ
   Разметка кандзи: {今日|きょう} → кандзи с фуриганой сверху
   ================================================================= */
const rb=t=>esc(t).replace(/\{([^|}]+)\|([^}]+)\}/g,"<ruby>$1<rt>$2</rt></ruby>");
const plain=t=>t.replace(/\{([^|}]+)\|([^}]+)\}/g,"$1");
/* текст для голоса: без кавычек, слэшей, скобок и эмодзи, чтобы она их не зачитывала */
const ttsClean=t=>plain(String(t)).replace(/[«»"“”„‘’'`]/g,"").replace(/\s*\/\s*/g,", ").replace(/[()\[\]]/g,"").replace(/\s[—–-]\s/g,", ").replace(/[\u{1F300}-\u{1FAFF}\u2600-\u27BF]/gu,"").replace(/\s{2,}/g," ").trim();
let _talkT=null;
function sayQ(text,lang){ try{ if(!window.speechSynthesis)return; const txt=ttsClean(text); const u=new SpeechSynthesisUtterance(txt); u.lang=lang==="ja"?"ja-JP":"ru-RU"; const fv=femaleVoice(lang); if(fv) u.voice=fv; u.rate=lang==="ja"?.75:1; u.pitch=1.2; speechSynthesis.speak(u);}catch(e){} }
function setTalk(on){ try{ clearTimeout(_talkT); const el=document.getElementById("app")||document.getElementById("kb-app"); if(el) el.classList.toggle("talking",!!on); }catch(e){} }
const esc=t=>String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const V=(jp,ru)=>({jp,ru});

/* ---------- ГОЛОС ---------- */
let VOICES=[];
function loadVoices(){try{VOICES=speechSynthesis.getVoices()||[]}catch(e){}}
try{loadVoices(); speechSynthesis.onvoiceschanged=loadVoices;}catch(e){}
function femaleVoice(lang){
  const v=VOICES.filter(x=>x.lang&&x.lang.toLowerCase().startsWith(lang));
  return v.find(x=>/female|kyoko|haruka|ayumi|nanami|sayaka|o-ren|milena|irina|svetlana|dariya|alena|google/i.test(x.name))||v[0]||null;
}
function say(text,lang="ja"){
  try{ if(!window.speechSynthesis) return; speechSynthesis.cancel();
    const txt=ttsClean(text); const u=new SpeechSynthesisUtterance(txt); u.lang=lang==="ja"?"ja-JP":"ru-RU";
    const fv=femaleVoice(lang); if(fv) u.voice=fv; u.pitch=1.25; u.rate=lang==="ja"?.9:1.05;
    setTalk(true); u.onend=u.onerror=()=>setTalk(false); _talkT=setTimeout(()=>setTalk(false),1500+txt.length*(lang==="ja"?200:90));
    speechSynthesis.speak(u);
  }catch(e){}
}

/* похожие по виду варианты: та же пунктуация, близкая длина, общие слова + один «мутант» правильного */
const PUNCT=/[？！?!。、.,…〜~]+$/;
const endP=s=>{const m=s.match(PUNCT);return m?m[0].replace(/[!！]/g,"!").replace(/[?？]/g,"?"):"";};
function simScore(a,b){
  a=plain(a);b=plain(b);
  let s=0; if(endP(a)===endP(b)) s+=3;
  s-=Math.abs(a.length-b.length)/Math.max(a.length,b.length)*6;
  const ta=a.split(/[ 、。，,]+/),tb=new Set(b.split(/[ 、。，,]+/));
  ta.forEach(w=>{if(w&&tb.has(w)) s+=1.5;});
  if(a[0]===b[0]) s+=1;
  if(a.includes("、")===b.includes("、")) s+=.7;
  if((a.match(/ /g)||[]).length===(b.match(/ /g)||[]).length) s+=1;
  return s+Math.random()*1.2;
}
const CLAUSE=/[^、。！？!?,.…]+[、。！？!?,.…\s]*/g;
function mutate(text,key){
  const src=ALLV().map(x=>key==="jp"?x.jp:x.ru);
  const fixCase=(w,first)=>key==="ru"?(first?w.charAt(0).toUpperCase()+w.slice(1):(/^(Юки|Денис|Беларус)/.test(w)?w:w.charAt(0).toLowerCase()+w.slice(1))):w;
  const cl=text.match(CLAUSE)||[text];
  if(cl.length>=2){
    const bodies=[...new Set(src.flatMap(s=>(s.match(CLAUSE)||[]).map(c=>c.replace(/[、。！？!?,.…\s]+$/,"").trim())))].filter(b=>b&&!/[{}]/.test(b));
    for(let tries=0;tries<30;tries++){
      const i=Math.floor(Math.random()*cl.length);
      const body=cl[i].replace(/[、。！？!?,.…\s]+$/,"").trim(), tail=cl[i].slice(cl[i].replace(/[、。！？!?,.…\s]+$/,"").length);
      if(/[{}]/.test(body)) continue;
      const own=cl.map(x=>x.replace(/[、。！？!?,.…\s]+$/,"").trim().toLowerCase());
      const c=bodies.filter(b=>!own.includes(b.toLowerCase())&&Math.abs(b.length-body.length)<=Math.max(3,body.length*.5));
      if(!c.length) continue;
      const nc=cl.slice(); nc[i]=(i>0&&key==="ru"?"":"")+fixCase(pick(c),i===0)+tail;
      const out=nc.join("").trim();
      if(out!==text&&!src.includes(out)) return out;
    }
  }
  if(key!=="jp") return null;
  const toks=text.split(" "); if(toks.length<2) return null;
  const words=[...new Set(src.flatMap(s=>s.split(" ")))].map(w=>w.replace(PUNCT,"")).filter(w=>w&&!/[{}、。！？]/.test(w));
  for(let tries=0;tries<30;tries++){
    const i=Math.floor(Math.random()*toks.length);
    const orig=toks[i], core=orig.replace(PUNCT,""), tail=orig.slice(core.length);
    if(!core||/[{}、。！？]/.test(core)) continue;
    const cands=words.filter(w=>w!==core&&Math.abs(w.length-core.length)<=2);
    if(!cands.length) continue;
    const nt=toks.slice(); nt[i]=pick(cands)+tail; const out=nt.join(" ");
    if(out!==text&&!src.includes(out)) return out;
  }
  return null;
}
const STOPW=new Set(["я","ты","а","да","ну","ой","и","же","эм","вот","так","уж"]);
const ruToks=s=>new Set(String(s||"").toLowerCase().replace(/ё/g,"е").replace(/обожаю/g,"люблю").split(/[^а-яa-z]+/).filter(w=>w&&!STOPW.has(w)));
function sameMeaning(a,b){const A=ruToks(a),B=ruToks(b);if(!A.size||!B.size)return false;let n=0;A.forEach(w=>{if(B.has(w))n++;});return n/(A.size+B.size-n)>=.5;}
function otherV(v,pool,n,key){
  const keyOf=x=>key==="jp"?plain(x.jp):x.ru;
  const cands=[...new Set([...pool,...ALLV()])].filter(x=>keyOf(x)!==keyOf(v)&&!sameMeaning(x.ru,v.ru)&&plain(x.jp)!==plain(v.jp));
  const ranked=cands.map(x=>({x,s:simScore(key==="jp"?v.jp:v.ru,key==="jp"?x.jp:x.ru)})).sort((a,b)=>b.s-a.s);
  const out=[];
  const m=mutate(key==="jp"?v.jp:v.ru,key);
  if(m&&n>=2) out.push(key==="jp"?{jp:m,ru:"(не то)",fake:true}:{jp:v.jp,ru:m,fake:true});
  for(const {x} of ranked){if(out.length>=n)break; if(!out.some(o=>keyOf(o)===keyOf(x)))out.push(x);}
  return out;
}
function puQuiz(ci){
  puQuizList(PU[ci].v,{ci,kind:"w"});
}
function puQuizList(list,opt){
  const qs=[];list.forEach(v=>{qs.push({t:"jr",v});qs.push({t:"rj",v});});
  P=Object.assign({pool:list,queue:shuffle(qs),total:qs.length,done:0,hearts:5,combo:0,maxCombo:0,right:0,wrong:0,kind:"w"},opt);
  puNext();
}
function puBuild(ci){
  const qs=PU[ci].v.map(v=>({t:"b",v}));
  P={ci,pool:PU[ci].v,kind:"b",queue:shuffle(qs),total:qs.length,done:0,hearts:5,combo:0,maxCombo:0,right:0,wrong:0};
  puNext();
}
function puNext(){
  hideSheet();
  if(P.hearts<=0) return puResult(true);
  if(!P.queue.length) return puResult(false);
  P.cur=P.queue.shift(); P.locked=false;
  const q=P.cur,v=q.v;
  if(q.t==="jr") q.opts=shuffle([v,...otherV(v,P.pool,3,"ru")]);
  if(q.t==="rj") q.opts=shuffle([v,...otherV(v,P.pool,3,"jp")]);
  if(q.t==="b"){
    const toks=v.jp.split(" "); const extra=[];
    for(const o of shuffle(ALLV())){ if(extra.length>=2)break; for(const t of o.jp.split(" ")){ if(!toks.includes(t)&&!extra.includes(t)){extra.push(t);break;} } }
    q.tiles=shuffle([...toks,...extra].map((t,i)=>({t,i}))); q.sel=[];
  }
  puRender();
}
function puRender(){
  const q=P.cur,v=q.v; let body="";
  const pct=Math.round(P.done/P.total*100);
  if(q.t==="jr"){
    body=`<div class="prompt">Что это значит?</div>
    <div class="card" id="card"><button class="say" id="say" aria-label="Озвучить">🔊</button><div class="jpbig">${rb(v.jp)}</div></div>
    <div class="opts1">${q.opts.map((o,i)=>`<button class="ropt" data-i="${i}"><span class="ru">${esc(o.ru)}</span></button>`).join("")}</div>`;
  } else if(q.t==="rj"){
    body=`<div class="prompt">Как сказать по-японски?</div>
    <div class="card" id="card"><div class="rubig">${esc(v.ru)}</div></div>
    <div class="opts1">${q.opts.map((o,i)=>`<button class="ropt" data-i="${i}"><span class="jp">${rb(o.jp)}</span></button>`).join("")}</div>`;
  } else {
    body=`<div class="prompt">Собери фразу по-японски</div>
    <div class="card" id="card"><div class="rubig">${esc(v.ru)}</div></div>
    <div class="slot" id="slot">${q.sel.map(i=>`<button class="tile" data-i="${i}">${rb(q.tiles.find(t=>t.i===i).t)}</button>`).join("")}</div>
    <div class="pool" id="pool">${q.tiles.map(t=>`<button class="tile ${q.sel.includes(t.i)?"ghosted":""}" data-i="${t.i}">${rb(t.t)}</button>`).join("")}</div>
    <button class="big" id="chk" ${pinkBtn}>Проверить</button>`;
  }
  app.innerHTML=`<section class="screen">
    <div class="top"><button class="x" id="quit" aria-label="Выйти">✕</button><div class="prog"><i style="width:${pct}%;background:var(--pink)"></i></div><div class="hearts">♥ ${P.hearts}</div></div>
    <div class="combo">${P.combo>=2?`серия ×${P.combo}`:""}</div>${body}</section>`;
  document.getElementById("quit").onclick=P.back||akMenu;
  const sy=document.getElementById("say"); if(sy) sy.onclick=()=>say(v.jp);
  if(q.t==="b"){
    document.getElementById("pool").querySelectorAll(".tile").forEach(b=>b.onclick=()=>{if(P.locked)return;const i=+b.dataset.i;if(!q.sel.includes(i)){q.sel.push(i);puRender();}});

function liveAsk(){

function liveAnswer(o,btn){
  if(P.state!=="ask")return; P.state="busy";

  app.querySelectorAll(".ropt").forEach(x=>x.disabled=true);

function speakP(text,lang,rate){
  return new Promise(res=>{
    try{
      if(!window.speechSynthesis){setTimeout(res,600);return;}
      const txt=ttsClean(text); if(!txt){setTimeout(res,50);return;}
      const u=new SpeechSynthesisUtterance(txt); u.lang=lang==="ja"?"ja-JP":"ru-RU";
      const fv=femaleVoice(lang); if(fv) u.voice=fv; u.rate=rate||(lang==="ja"?.85:1.1); u.pitch=lang==="ja"?1.2:1;
      let done=false; const fin=()=>{if(!done){done=true;setTalk(false);res();}}; setTalk(true);
      u.onend=fin; u.onerror=fin;
      setTimeout(fin,1800+plain(text).length*(lang==="ja"?220:95)/(rate?Math.min(1,rate+.2):1));
      speechSynthesis.speak(u);
    }catch(e){res();}
  });
}

function hfPhrasePool(){const seen=new Set();return ALLV().filter(v=>{const k=plain(v.jp);if(seen.has(k))return false;seen.add(k);return true;});}
function hfMakeQ(){
  const eyes=HF.mode==="eyes", n=eyes?4:3;
  const useKana=eyes&&HF.content!=="phr";
  if(useKana){
    let kpool=ITEMS.filter(i=>HF.content==="hira"?i.s==="h":HF.content==="kata"?i.s==="k":HF.content==="mine"?inMine(i):true); if(!kpool.length) kpool=ITEMS;
    const item=pickItems(kpool.filter(i=>i.k!==HF.lastK),1)[0]||pick(kpool); HF.lastK=item.k;
    if(false){
      const tw=item.twin, opts=shuffle([tw,...distractors(tw,tw.s,n-1,tw)]);
      return {kind:"twin",show:item.k,sayIntro:"Найди пару.",sayJa:item.k,opts:opts.map(o=>({label:o.k,kana:true,ok:o===tw})),answerJa:tw.k,answerRu:null};
    }
    const opts=shuffle([item,...distractors(item,item.s,n-1)]);
    return {kind:"listen",show:null,sayIntro:"Найди.",sayJa:item.k,opts:opts.map(o=>({label:o.k,kana:true,ok:o===item})),answerJa:item.k,answerRu:null,hint:item.s==="h"?"хирагана":"катакана"};
  }
  const pool=hfPhrasePool();
  // умный выбор: новая фраза только изредка и сначала разбирается, остальное — повтор того, что пора освежить
  const learned=pool.filter(x=>S.srs[srsKey(x.jp)]), fresh=pool.filter(x=>!S.srs[srsKey(x.jp)]);
  HF.sinceNew=(HF.sinceNew||0)+1; HF.recent=HF.recent||[];
  let v, intro=false;
  if(fresh.length&&(learned.length<4||HF.sinceNew>=6)){ v=fresh[0]; intro=true; HF.sinceNew=0; }
  else{
    const now=Date.now();
    const cand=learned.filter(x=>!HF.recent.includes(srsKey(x.jp))).sort((a,b)=>(S.srs[srsKey(a.jp)].d-now)-(S.srs[srsKey(b.jp)].d-now)||S.srs[srsKey(a.jp)].b-S.srs[srsKey(b.jp)].b);
    v=pick(cand.slice(0,5).length?cand.slice(0,5):learned);
  }
  HF.recent.push(srsKey(v.jp)); if(HF.recent.length>3) HF.recent.shift();
  if(!intro&&Math.random()<.4){
    const opts=shuffle([v,...otherV(v,pool,n-1,"ru")]);
    return {kind:"jr",v,show:v.jp,sayIntro:"Переведи.",sayJa:v.jp,opts:opts.map(o=>({label:o.ru,ok:o===v})),answerRu:v.ru};
  }
  const opts=shuffle([v,...otherV(v,pool,n-1,"jp")]);
  return {kind:"rj",v,intro,show:null,showRu:v.ru,sayIntro:"Как сказать: "+v.ru.replace(/[?!.]+$/,"")+"?",sayJa:null,opts:opts.map(o=>({label:o.jp,jp:true,ok:o===v})),answerJa:v.jp};
}
function hfStart(mode){
  HF.mode=mode; HF.count=0; HF.paused=false;
  if(mode==="ears") HF.contentRun="phr";
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume();}catch(e){}
  wakeOn();
  if(!window.speechSynthesis){
    app.innerHTML=`<section class="screen"><div class="note">Этот браузер не умеет говорить. Открой в Safari или Chrome.</div><button class="ghost" id="back">Назад</button></section>`;
    document.getElementById("back").onclick=hfMenu; return;
  }
  hfLoop();
}
function hfRender(q,state,sec,total){
  const eyes=HF.mode==="eyes";
  const reveal=state==="reveal";
  const head=eyes
    ? (q.kind==="jr"?`<div class="hfq jp">${rb(q.show)}</div>`
      :q.kind==="rj"?`<div class="hfq ru">${esc(q.showRu)}</div>`
      :q.kind==="twin"?`<div class="hfq kana">${q.show}</div><div class="hfsub">найди пару</div>`
      :`<div class="hfq listen">🔊</div><div class="hfsub">слушай и найди · ${q.hint}</div>`)
    : `<div class="hfq ears">🎧</div><div class="hfsub">${q.kind==="jr"?"переведи на слух":"как сказать по-японски"}</div>`;
  const opts=`<div class="hfopts ${eyes?"":"dim"}">${q.opts.map((o,i)=>`<div class="hfo ${reveal?(o.ok?"ok":"no"):""}"><span class="num">${i+1}</span><span class="${o.kana?"kana":o.jp?"jp":"ru"}">${o.kana?o.label:o.jp?rb(o.label):esc(o.label)}</span></div>`).join("")}</div>`;
  const pct=state==="count"?Math.round(sec/total*100):state==="reveal"?0:100;
  app.innerHTML=`<section class="screen hf">
    <div class="top"><button class="x" id="quit" aria-label="Стоп">✕</button><div class="hfmode">${eyes?"👀 смотрю в экран":"🎧 в наушниках"} · №${HF.count}</div></div>
    <div class="hfstage">${head}<div class="timer"><i style="width:${pct}%"></i></div>${state==="count"?`<div class="sec">${sec}</div>`:reveal?`<div class="sec ok">✓</div>`:`<div class="sec">…</div>`}</div>
    ${opts}
    <div class="tsrun"><button class="mini" id="tminus" aria-label="Меньше секунд">−</button><span>⏱ ${hfT(HF.mode)} сек на ответ</span><button class="mini" id="tplus" aria-label="Больше секунд">+</button></div>
    <div class="hfctl"><button class="big" id="pause">${HF.paused?"▶ Дальше":"⏸ Пауза"}</button><button class="ghost" id="stop">Стоп, хватит</button></div>
  </section>`;
  document.getElementById("quit").onclick=hfMenu;
  document.getElementById("stop").onclick=hfMenu;
  const adj=d=>{S.hfT[HF.mode]=Math.min(9,Math.max(1,hfT(HF.mode)+d));save();const el=app.querySelector(".tsrun span");if(el)el.textContent=`⏱ ${hfT(HF.mode)} сек на ответ`;};
  document.getElementById("tminus").onclick=()=>adj(-1);
  document.getElementById("tplus").onclick=()=>adj(1);
  document.getElementById("pause").onclick=()=>{ if(HF.paused){HF.paused=false;wakeOn();hfLoop();} else {HF.paused=true;HF.token++;try{speechSynthesis.cancel()}catch(e){};wakeOff();hfRender(q,state,sec,total);} };
}
async function hfLoop(){
  const my=++HF.token; const alive=()=>HF.token===my;
  while(alive()){
    HF.count++;
    const q=hfMakeQ(), eyes=HF.mode==="eyes", T=hfT(HF.mode);
    if(q.intro){
      hfRender(Object.assign({},q,{kind:"jr",show:q.v.jp}),"ask",T,T);
      await speakP("Новая фраза. "+q.v.ru,"ru"); if(!alive())return;
      await speakP(q.v.jp,"ja",.65); if(!alive())return;
      await speakP("Повтори.","ru"); if(!alive())return;
      await sleep(Math.max(2,S.repPause)*1000); if(!alive())return;
      await speakP(q.v.jp,"ja",.9); if(!alive())return;
      await sleep(Math.max(2,S.repPause)*1000); if(!alive())return;
      srsSeen(q.v.jp);
    }
    hfRender(q,"ask",T,T);
    await speakP(q.sayIntro,"ru"); if(!alive())return;
    if(q.sayJa){ if(q.kind==="listen"||q.kind==="twin") await kanaSayP(q.sayJa); else await speakP(q.sayJa,"ja"); if(!alive())return; }
    if(!eyes&&q.kind!=="jr"&&q.kind!=="rj"){
      for(let i=0;i<q.opts.length;i++){
        await speakP(NUM_RU[i]+".","ru"); if(!alive())return;
        const o=q.opts[i]; await speakP(o.label,o.jp?"ja":"ru"); if(!alive())return;
      }
    }
    for(let s=T;s>0;s--){ hfRender(q,"count",s,T); tick(false); await sleep(1000); if(!alive())return; }
    tick(true); hfRender(q,"reveal",0,T);
    const idx=q.opts.findIndex(o=>o.ok);
    if(eyes){
      if(q.answerRu){ await speakP("Ответ: "+q.answerRu,"ru"); }
      else { await speakP("Ответ:","ru"); if(!alive())return; if(q.kind==="listen"||q.kind==="twin") await kanaSayP(q.answerJa); else await speakP(q.answerJa,"ja"); }
    } else if(q.kind==="rj"){
      await speakP("Ответ.","ru"); if(!alive())return;
      await speakP(q.answerJa,"ja",.8); if(!alive())return;
      await speakP("Повтори.","ru"); if(!alive())return;
      await sleep(Math.max(2,S.repPause)*1000); if(!alive())return;
      await speakP(q.answerJa,"ja",.95);
    } else if(q.kind==="jr"){
      await speakP("Это: "+q.answerRu,"ru"); if(!alive())return;
      await speakP(q.sayJa,"ja",.85);
    } else {
      await speakP("Ответ: "+NUM_RU[idx].toLowerCase()+".","ru"); if(!alive())return;
      const o=q.opts[idx]; await speakP(o.label,o.jp?"ja":"ru");
    }
    if(q.v) srsGrade(q.v.jp,1);
    if(!alive())return;
    await sleep(900);
  }
}

/* длинное режем на кусочки: сначала частица (ベラルーシ|から), иначе посередине, не разрывая слоги */
function chunksOf(jp){
  const pl=plain(jp); if(pl.replace(/[、。！？…\s]/g,"").length<=5) return [];
  const parts=[];
  jp.split(" ").forEach((t,ti)=>{
    const tp=plain(t);
    if(!/[{]/.test(t)&&tp.replace(/[、。！？…]/g,"").length>6){
      const core=t.replace(/[、。！？…]+$/,"");
      const prt=["から","まで","ので","けど","は","が","を","に","で","の","と","も","へ"].find(x=>core.endsWith(x)&&core.length-x.length>=3);
      const SM=/[ゃゅょっぁぃぅぇぉャュョッァィゥェォーん、。！？]/;
      const okCut=c=>c>=2&&core.length-c>=2&&!SM.test(t[c])&&t[c-1]!=="っ"&&t[c-1]!=="ッ"&&!(t[c]==="う"&&/[ゅょ]/.test(t[c-1]));
      let cut; const comma=core.indexOf("、");
      if(comma>=2&&comma<core.length-2) cut=comma+1;
      else if(prt) cut=core.length-prt.length;
      else{ const mid=Math.ceil(core.length/2); cut=[0,-1,1,-2,2,-3,3].map(d=>mid+d).find(okCut)||mid; }
      parts.push({s:t.slice(0,cut),sp:ti>0}); parts.push({s:t.slice(cut),sp:false});
    } else parts.push({s:t,sp:ti>0});
  });
  if(parts.length<2) return [];
  const pref=[]; let acc=""; parts.forEach(p=>{acc+=(p.sp?" ":"")+p.s; pref.push(acc);}); pref.pop();
  if(pref.length>3){ return [...new Set([pref[0],pref[Math.floor(pref.length/2)],pref[pref.length-1]])]; }
  return pref;
}

function planSecs(plan){

      s+=ruS(S.akShort?p[1]:p[2])+jaS(p[0],.7);
      ch.forEach(c=>{s+=jaS(c,.65)+Math.max(2,rp)+.3;}); if(ch.length) s+=(S.akShort?0:2.5)+1.5+jaS(p[0],.75);

function listen(lang,ms,alive){
  return new Promise(res=>{
    if(!SR||VOICE.denied){res({err:"na",alts:[]});return;}
    let r; try{ r=new SR(); }catch(e){res({err:"na",alts:[]});return;}
    VOICE.rec=r; r.lang=lang==="ja"?"ja-JP":"ru-RU"; r.interimResults=true; r.maxAlternatives=5; r.continuous=false;
    let done=false, interim="", alts=[];
    const fin=o=>{ if(done)return; done=true; clearTimeout(to); clearInterval(iv); try{r.abort()}catch(e){} if(VOICE.rec===r)VOICE.rec=null; res(o); };
    r.onresult=e=>{ let fl=false; const a=[]; for(let i=0;i<e.results.length;i++){ const R=e.results[i]; if(R.isFinal) fl=true; for(let k=0;k<R.length;k++) a.push(R[k].transcript); } if(a.length){ alts=a; interim=a[0]; } VOICE.onInterim&&VOICE.onInterim(interim); if(fl) fin({alts}); };
    r.onerror=e=>{ if(e.error==="not-allowed"||e.error==="service-not-allowed") VOICE.denied=true; fin({err:e.error,alts}); };
    r.onend=()=>fin({alts});

    const iv=setInterval(()=>{ if(alive&&!alive()) fin({alts:[],dead:true}); },200);

  });
}
const toHira=s=>String(s).replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60));
const jaNorm=s=>toHira(plain(String(s))).replace(/[\s、。！？!?…・ー〜~,.「」『』]/g,"");
function jaMatch(said,target){
  const a=jaNorm(said), b=jaNorm(target); if(!a||!b) return 0;
  const isK=c=>/[一-鿿々]/.test(c), n=a.length, m=b.length, INF=1e9;
  const D=Array.from({length:n+1},()=>new Array(m+1).fill(INF)); D[0][0]=0;
  for(let i=0;i<=n;i++)for(let j=0;j<=m;j++){ const d=D[i][j]; if(d>=INF)continue;
    if(i<n&&j<m) D[i+1][j+1]=Math.min(D[i+1][j+1],d+(a[i]===b[j]?0:1));
    if(i<n) D[i+1][j]=Math.min(D[i+1][j],d+1);
    if(j<m) D[i][j+1]=Math.min(D[i][j+1],d+1);
    if(i<n&&isK(a[i])) for(let k=1;k<=4&&j+k<=m;k++) D[i+1][j+k]=Math.min(D[i+1][j+k],d); }
  return 1-D[n][m]/m;
}
const jaOk=(alts,target)=>{ const m=jaNorm(target).length, thr=m<=3?.99:m<=6?.8:.72; return alts.some(s=>jaMatch(s,target)>=thr); };
const ruWords=s=>String(s).toLowerCase().replace(/ё/g,"е").replace(/\(.*?\)/g," ").replace(/[^а-яa-z0-9\s]/g," ").split(/\s+/).filter(w=>w&&!STOPW.has(w));
const stemRu=w=>w.slice(0,Math.max(3,Math.min(5,w.length-1)));
function ruOk(alts,target){
  const variants=[target,...target.split(/[\/,]/)];
  return alts.some(said=>{ const A=new Set(ruWords(said).map(stemRu)); return variants.some(v=>{ const T=ruWords(v); if(!T.length) return false; return T.filter(w=>A.has(stemRu(w))).length/T.length>=.6; }); });
}
function voiceCmd(alts){
  const s=alts.join(" | ").toLowerCase(), h=toHira(s);
  if(/назад|верн[её]м|вернись|предыдущ/.test(s)||/もどって|もどる/.test(h)||/なざ/.test(h)) return "back";

function akPlan(review,items,ci){
  if(ci==null) ci=AK.ch;
  const tasks=[{t:"hello"}];
  if(review){
    tasks.push({t:"say",ru:S.akShort?"Повторение.":pick(AK_REVIEW_HELLO)});
    tasks.push({t:"final",review:true,chapters:COURSE.map((_,i)=>i),limit:Math.max(5,Math.min(30,srsStats().learned))});
    tasks.push({t:"end"}); return tasks;
  }
  const newSet=new Set(items.map(t=>srsKey(t[0])));
  const chapters=COURSE.map((_,i)=>i).filter(i=>i<=ci);
  const warm=S.akWarm?srsPick(6,newSet,chapters):[];
  if(!S.akShort) tasks.push({t:"preview"});
  if(warm.length){ tasks.push({t:"say",ru:S.akShort?"Разминка.":pick(AK_WARM)}); warm.forEach((p,i)=>tasks.push({t:"recall",p,dir:i%3===2?"jr":"rj",grade:true})); }
  else if(!S.akShort&&!srsStats().learned) tasks.push({t:"say",ru:"Это твой первый урок, так что старого нет. Начинаем с нуля."});
  tasks.push({t:"say",ru:S.akShort?"Новое.":pick(AK_NEWBLOCK)});
  items.forEach((p,i)=>{
    tasks.push({t:"intro",p,n:i+1,of:items.length});
    tasks.push({t:"recall",p,dir:"jr",fresh:true});
    for(let j=i-1;j>=Math.max(0,i-2);j--) tasks.push({t:"recall",p:items[j],dir:"rj",fresh:true});
  });
  if(items.length>1){ tasks.push({t:"say",ru:S.akShort?"Вперемешку.":pick(AK_MIX)}); shuffle(items).forEach(p=>tasks.push({t:"recall",p,dir:"rj"})); }
  tasks.push({t:"say",ru:S.akShort?"Финал.":pick(AK_FINAL)});
  shuffle(items).forEach((p,i)=>tasks.push({t:"recall",p,dir:i%3===1?"jr":"rj",grade:true}));
  tasks.push({t:"end"});
  return tasks;
}
